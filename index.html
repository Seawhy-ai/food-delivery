    --mt-yellow-grad: linear-gradient(160deg, #FFE566 0%, #FFD100 52%, #FFBE00 100%);

    --mt-black: #111111;
    --mt-red: #E60012;
    --mt-red-soft: #FFEDED;
    --mt-orange: #FF6B00;

    --mt-bg: #F5F5F7;
    --mt-surface: #FFFFFF;
    --mt-surface-2: #F7F7F9;
    --mt-border: #EDEDF0;
    --mt-line: #F1F1F4;

    --mt-text: #151519;
    --mt-text-2: #6B6B72;
    --mt-text-3: #9E9EA6;

    --mt-shadow-sm: 0 1px 2px rgba(16, 16, 20, .05);
    --mt-shadow: 0 1px 2px rgba(16, 16, 20, .04), 0 10px 26px -14px rgba(16, 16, 20, .18);
    --mt-radius: 14px;
    --mt-radius-lg: 18px;

    --tab-h: 54px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
}
body.dark {
    --mt-bg: #101012;
    --mt-surface: #1B1B1E;
    --mt-surface-2: #242428;
    --mt-border: #2A2A2F;
    --mt-line: #242428;

    --mt-text: #F1F1F4;
    --mt-text-2: #A6A6AE;
    --mt-text-3: #74747C;

    --mt-yellow-bg: #2B2600;
    --mt-red-soft: #3A1A1C;

    --mt-shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
    --mt-shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 12px 28px -14px rgba(0, 0, 0, .6);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* ---- 双击放大修复 ------------------------------------------------------
   touch-action: manipulation 保留平移与捏合缩放，只禁掉「双击缩放」。
   不用 user-scalable=no，避免破坏无障碍的捏合缩放能力。               */
html, body, .app, button, [data-action], [data-go], .tab, .shop-card, .kk-item,
.menu-row, .row, .tile, .dish-cat, .step-btn, .cart-ico-wrap, .search-bar {
    touch-action: manipulation;
}
/* 双击不再选中交互元素上的文字 */
button, .kk-item, .shop-card, .tab, .step-btn, .cart-ico-wrap, .menu-row,
.row, .tile, .dish-cat, .tabbar, .cartbar, .subheader, .hero, .search-bar,
.status-tab, .sort-item, .chips, .badge-dot {
    -webkit-user-select: none; user-select: none;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, sans-serif;
    background: var(--mt-bg);
    color: var(--mt-text);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
}
body.locked { overflow: hidden; }

button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mt-yellow-deep); outline-offset: 2px; }
body.dark :focus-visible { outline-color: var(--mt-yellow); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app {
        max-width: 480px; margin: 0 auto; min-height: 100vh;
        background: var(--mt-bg); position: relative;
    }
    /* 从主屏幕独立运行时，避开刘海与手势条 */
    body.standalone .app {
        padding-left: var(--safe-l);
        padding-right: var(--safe-r);
    }
    body.standalone { background: var(--mt-bg); }
    /* 独立模式禁用下拉刷新与橡皮筋，观感更接近原生 */
    body.standalone, body.standalone .app { overscroll-behavior: none; }
.page { padding-bottom: calc(var(--tab-h) + var(--safe-b) + 14px); min-height: 100vh; }

/* ============================ 图标 / 插画 ============================ */
.ic {
    width: 22px; height: 22px; display: block;
    fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round;
}
.ic.fill { fill: currentColor; stroke: none; }

.art-wrap { position: relative; border-radius: var(--mt-radius); overflow: hidden; background: var(--mt-surface-2); flex-shrink: 0; }
.art-wrap::before { content: ''; position: absolute; inset: 0; background: var(--ac, var(--mt-yellow)); opacity: .16; }
.art { position: relative; display: block; width: 100%; height: 100%; }
/* 真实照片叠在 SVG 插画之上：图挂了会自动移除，露出下面的插画 */
.art-wrap .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
/* 生成的茶饮商品图以精灵图保存，减少 55 张菜单缩略图的网络请求。 */
.art-wrap .photo-sprite { position: absolute; inset: 0; display: block; z-index: 1;
    background-image: url('assets/milk-tea-products.png'); background-repeat: no-repeat;
    background-size: 400% 400%; background-position: var(--sx) var(--sy); }

/* ============================ 顶部：定位 + 搜索 ============================ */
.hero {
        background: var(--mt-yellow-grad);
        padding: calc(12px + var(--safe-t)) 14px 18px;
        padding-left: calc(14px + var(--safe-l));
        padding-right: calc(14px + var(--safe-r));
        position: relative; z-index: 40;
    }
.hero-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.loc { display: flex; align-items: center; gap: 4px; max-width: 56%; font-weight: 700; color: var(--mt-black); }
.loc .ic { width: 17px; height: 17px; flex-shrink: 0; }
.loc-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
.loc .caret { width: 12px; height: 12px; opacity: .6; flex-shrink: 0; }
.hero-row .spacer { flex: 1; }
.icon-btn {
    width: 34px; height: 34px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; color: var(--mt-black);
    background: rgba(255, 255, 255, .34); transition: background .2s;
}
.icon-btn:hover { background: rgba(255, 255, 255, .55); }
.icon-btn .ic { width: 19px; height: 19px; }
.badge-dot { position: relative; }
.badge-dot::after { content: ''; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--mt-red); border: 1.5px solid var(--mt-yellow); }

.search-bar {
    display: flex; align-items: center; gap: 9px; width: 100%;
    background: #fff; border-radius: 999px; padding: 10px 8px 10px 15px;
    box-shadow: 0 2px 8px rgba(90, 60, 0, .1); color: var(--mt-text-3); text-align: left;
}
.search-bar .ic { width: 17px; height: 17px; flex-shrink: 0; }
.search-bar .ph { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.search-bar .cta {
    background: var(--mt-black); color: var(--mt-yellow);
    font-size: 12.5px; font-weight: 700; padding: 7px 15px; border-radius: 999px; flex-shrink: 0;
}

/* ============================ 金刚区 ============================ */
.kingkong { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px 0; padding: 16px 8px 8px; }
.kk-item { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 4px 0 6px; border-radius: 12px; }
.kk-ico {
    width: 48px; height: 48px; border-radius: 16px; display: flex;
    align-items: center; justify-content: center; position: relative;
}
.kk-ico::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--k); opacity: .13; }
.kk-ico .ic { position: relative; width: 28px; height: 28px; z-index: 1; }
.kk-name { font-size: 11.5px; color: var(--mt-text-2); white-space: nowrap; }
.kk-item.on .kk-ico { box-shadow: 0 0 0 2.5px var(--k), 0 4px 10px color-mix(in srgb, var(--k) 30%, transparent); }
.kk-item.on .kk-ico::after { opacity: .2; }
.kk-item.on .kk-name { color: var(--k); font-weight: 700; }

/* ============================ 瓷片区 ============================ */
.tiles { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; padding: 6px 12px 16px; }
.tile {
    background: var(--mt-surface); border-radius: var(--mt-radius);
    padding: 11px 10px; box-shadow: var(--mt-shadow-sm);
    display: flex; flex-direction: column; gap: 3px; overflow: hidden;
    position: relative; text-align: left;
}
.tile .ic { position: absolute; right: -2px; bottom: -3px; width: 34px; height: 34px; opacity: .15; }
.tile-title { font-size: 12.5px; font-weight: 700; }
.tile-sub { font-size: 11px; font-weight: 700; }
.tile.hot .tile-sub { color: var(--mt-red); }

/* ============================ 排序条 ============================ */
.sortbar {
        display: flex; align-items: center; gap: 4px;
        padding: 11px 12px; padding-top: calc(11px + var(--safe-t));
        background: var(--mt-surface); position: sticky; top: 0; z-index: 50;
        border-bottom: 1px solid var(--mt-line);
    }
.sort-item { padding: 6px 11px; border-radius: 999px; font-size: 13px; color: var(--mt-text-2); white-space: nowrap; transition: all .18s; }
.sort-item.on { background: var(--mt-black); color: var(--mt-yellow); font-weight: 700; }

/* ============================ 商家卡片 ============================ */
.shop-list { padding: 10px 12px; display: flex; flex-direction: column; gap: 11px; }
.shop-card {
    background: var(--mt-surface); border-radius: var(--mt-radius-lg);
    padding: 12px; display: flex; gap: 12px; width: 100%; text-align: left;
    box-shadow: var(--mt-shadow-sm); transition: transform .18s;
}
.shop-card:active { transform: scale(.985); }
.shop-card .art-wrap { width: 82px; height: 82px; border-radius: var(--mt-radius); }
.shop-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.shop-name { font-size: 16px; font-weight: 700; letter-spacing: -.2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shop-stats { display: flex; align-items: center; gap: 9px; font-size: 11.5px; color: var(--mt-text-3); flex-wrap: wrap; }
.stars { display: inline-flex; align-items: center; gap: 2px; color: var(--mt-orange); font-weight: 700; }
.stars .ic { width: 12px; height: 12px; }
.stars .num { color: var(--mt-text); }
.shop-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag { font-size: 10.5px; padding: 1.5px 5.5px; border-radius: 4px; line-height: 1.5; color: var(--mt-text-3); background: var(--mt-surface-2); }
.tag.yellow { color: #8A6A00; background: var(--mt-yellow-soft); }
body.dark .tag.yellow { color: var(--mt-yellow); background: #332C00; }
.shop-promo { display: flex; align-items: center; gap: 5px; font-size: 11.5px; }
.shop-promo .lbl { color: var(--mt-red); background: var(--mt-red-soft); border-radius: 4px; padding: 1.5px 5px; flex-shrink: 0; font-weight: 700; }
.shop-promo .txt { color: var(--mt-red); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shop-foot { display: flex; align-items: center; gap: 9px; font-size: 11px; color: var(--mt-text-3); flex-wrap: wrap; }
.shop-foot .deliver { color: var(--mt-text-2); }
.distance-col { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; flex-shrink: 0; font-size: 11px; color: var(--mt-text-3); align-self: stretch; }

.empty { text-align: center; padding: 56px 24px; }
.empty-art { width: 76px; height: 76px; border-radius: 50%; background: var(--mt-surface-2); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
.empty-art .ic { width: 32px; height: 32px; color: var(--mt-text-3); stroke-width: 1.5; }
.empty .title { font-size: 15.5px; color: var(--mt-text-2); margin-bottom: 5px; font-weight: 700; }
.empty .sub { font-size: 12.5px; color: var(--mt-text-3); }

/* ============================ 底部 Tab ============================ */
.tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; height: calc(var(--tab-h) + var(--safe-b));
    padding-bottom: var(--safe-b);
    background: var(--mt-surface); border-top: 1px solid var(--mt-line);
    display: flex; z-index: 70;
}
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; color: var(--mt-text-3); }
.tab .ico { width: 40px; height: 24px; border-radius: 999px; display: flex; align-items: center; justify-content: center; transition: background .18s; }
.tab .ico .ic { width: 22px; height: 22px; }
.tab.on { color: var(--mt-black); font-weight: 700; }
.tab.on .ico { background: var(--mt-yellow); }
body.dark .tab.on { color: var(--mt-yellow); }

/* ============================ 子页头部 ============================ */
.subheader {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 14px; padding-top: calc(12px + var(--safe-t));
        background: var(--mt-surface); position: sticky; top: 0; z-index: 60;
        border-bottom: 1px solid var(--mt-line);
    }
.subheader .back { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--mt-text); }
.subheader .back:hover { background: var(--mt-surface-2); }
.subheader h1 { font-size: 16.5px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subheader.plain { position: static; }

/* ============================ 搜索页 ============================ */
.search-head {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 14px; padding-top: calc(10px + var(--safe-t));
        background: var(--mt-yellow-grad); position: sticky; top: 0; z-index: 60;
    }
.suggest { position: absolute; top: calc(100% + 6px); left: 14px; right: 14px; background: var(--mt-surface); border-radius: 12px; box-shadow: var(--mt-shadow); overflow: hidden; z-index: 70; }
.sug-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 11px 14px; text-align: left; font-size: 13.5px; border-bottom: 1px solid var(--mt-line); }
.sug-item:last-child { border-bottom: none; }
.sug-item .ic { width: 15px; height: 15px; color: var(--mt-text-3); flex-shrink: 0; }
.search-head .icon-btn { background: rgba(255, 255, 255, .4); }
.search-field { flex: 1; display: flex; align-items: center; gap: 7px; background: #fff; border-radius: 999px; padding: 9px 13px; }
.search-field .ic { width: 17px; height: 17px; color: var(--mt-text-3); flex-shrink: 0; }
.search-field input { flex: 1; border: none; outline: none; background: none; font-size: 14px; min-width: 0; }
.search-field .clr { color: var(--mt-text-3); display: flex; }
.search-field .clr .ic { width: 15px; height: 15px; }
.search-go { font-size: 14px; font-weight: 700; color: var(--mt-black); padding: 4px 2px; }

.block { padding: 18px 14px 4px; }
.block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
.block-head h2 { font-size: 14.5px; font-weight: 700; }
.block-head .more { font-size: 12px; color: var(--mt-text-3); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 999px; font-size: 13px; background: var(--mt-surface); color: var(--mt-text-2); box-shadow: var(--mt-shadow-sm); }
.chip.hot { color: var(--mt-red); }
.match-box { padding: 0 12px 12px; }
.match-box .inner { background: var(--mt-yellow-bg); padding: 8px 11px; border-radius: 9px; font-size: 11.5px; display: flex; gap: 7px; }
.match-box .k { color: var(--mt-yellow-deep); font-weight: 700; flex-shrink: 0; }
.match-box .v { color: var(--mt-text-2); overflow: hidden; }
.wrap-card { background: var(--mt-surface); border-radius: var(--mt-radius-lg); box-shadow: var(--mt-shadow-sm); }
.wrap-card .shop-card { box-shadow: none; background: transparent; }

/* ============================ 商家页 ============================ */
.shop-page { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: var(--mt-surface); display: flex; flex-direction: column; z-index: 80; }
.shop-hero { background: var(--mt-yellow-grad); padding: 10px 14px 16px; padding-top: calc(10px + var(--safe-t)); flex-shrink: 0; }
.shop-hero-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.shop-hero-top .back { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--mt-black); background: rgba(255, 255, 255, .34); }
.shop-hero-top .ttl { flex: 1; font-weight: 700; color: var(--mt-black); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shop-brief { display: flex; gap: 12px; }
.shop-brief .art-wrap { width: 66px; height: 66px; border-radius: var(--mt-radius); background: rgba(255, 255, 255, .8); }
.shop-brief .info { flex: 1; min-width: 0; color: var(--mt-black); }
.shop-brief .info h2 { font-size: 16.5px; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.2px; }
.shop-brief .info .meta { font-size: 11.5px; opacity: .74; display: flex; gap: 9px; flex-wrap: wrap; }
.shop-brief .info .promo { font-size: 11.5px; margin-top: 4px; display: flex; gap: 5px; align-items: center; }
.shop-brief .info .promo .k { background: var(--mt-red); color: #fff; border-radius: 4px; padding: 1px 5px; flex-shrink: 0; font-weight: 700; }
.shop-brief .info .promo .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.shop-body { flex: 1; display: flex; overflow: hidden; position: relative; }
.dish-cats { width: 90px; flex-shrink: 0; background: var(--mt-surface-2); overflow-y: auto; }
.dish-cat { width: 100%; padding: 16px 6px; font-size: 13px; color: var(--mt-text-2); text-align: center; position: relative; }
.dish-cat.on { background: var(--mt-surface); color: var(--mt-text); font-weight: 700; }
.dish-cat.on::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 17px; background: var(--mt-yellow-deep); border-radius: 0 3px 3px 0; }
.dish-cat .dot { position: absolute; top: 8px; right: 8px; min-width: 15px; height: 15px; border-radius: 999px; background: var(--mt-red); color: #fff; font-size: 10px; line-height: 15px; padding: 0 4px; font-weight: 700; }

.dish-list { flex: 1; overflow-y: auto; position: relative; padding-bottom: 96px; }
.dish-section-title { padding: 13px 12px 7px; font-size: 12.5px; font-weight: 700; color: var(--mt-text-2); background: var(--mt-surface); }
.dish { display: flex; gap: 11px; padding: 12px; border-bottom: 1px solid var(--mt-line); }
.dish .art-wrap { width: 70px; height: 70px; border-radius: 11px; }
.dish-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dish-name { font-size: 14.5px; font-weight: 600; margin-bottom: 2px; }
.dish-desc { font-size: 11.5px; color: var(--mt-text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dish-sales { font-size: 11px; color: var(--mt-text-3); margin-top: 3px; }
.dish-bottom { display: flex; align-items: flex-end; justify-content: space-between; margin-top: auto; padding-top: 6px; }
.price { color: var(--mt-red); font-weight: 700; font-size: 16.5px; display: flex; align-items: baseline; gap: 1px; }
.price .cur { font-size: 11px; }
.price .orig { color: var(--mt-text-3); font-size: 11px; text-decoration: line-through; font-weight: 400; margin-left: 4px; }

.stepper { display: flex; align-items: center; gap: 7px; }
.step-btn { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.step-btn .ic { width: 14px; height: 14px; stroke-width: 2.4; }
.step-add { background: var(--mt-yellow); color: var(--mt-black); }
.step-minus { border: 1.4px solid var(--mt-yellow-deep); color: var(--mt-yellow-deep); }
body.dark .step-minus { border-color: var(--mt-yellow); color: var(--mt-yellow); }
.step-qty { min-width: 16px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ============================ 底部购物车栏 ============================ */
.cartbar { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; padding: 0 12px 0 14px; gap: 11px; background: var(--mt-black); color: #fff; z-index: 20; }
.cartbar.empty-state { background: var(--mt-surface); color: var(--mt-text-3); border-top: 1px solid var(--mt-line); }
.cart-ico-wrap { position: relative; width: 48px; height: 48px; flex-shrink: 0; margin-top: -20px; }
.cart-ico { width: 48px; height: 48px; border-radius: 50%; background: #33333A; display: flex; align-items: center; justify-content: center; border: 3.5px solid var(--mt-black); color: #9A9AA2; }
.cart-ico .ic { width: 24px; height: 24px; }
.cartbar.empty-state .cart-ico { background: var(--mt-surface-2); border-color: var(--mt-surface); }
.cart-ico.has { background: var(--mt-yellow); color: var(--mt-black); }
.cart-badge { position: absolute; top: -4px; right: -4px; min-width: 19px; height: 19px; border-radius: 999px; background: var(--mt-red); color: #fff; font-size: 11px; line-height: 19px; text-align: center; padding: 0 5px; font-weight: 700; border: 2px solid var(--mt-black); }
.cart-sum { flex: 1; min-width: 0; }
.cart-sum .amt { font-size: 17.5px; font-weight: 700; }
.cart-sum .hint { font-size: 11px; opacity: .72; }
.cartbar.empty-state .cart-sum .amt { color: var(--mt-text-3); }
.checkout-btn { background: #43434A; color: #8E8E96; padding: 10px 22px; border-radius: 999px; font-weight: 700; font-size: 14.5px; flex-shrink: 0; }
.checkout-btn.ready { background: var(--mt-yellow); color: var(--mt-black); }

.cart-drawer { position: absolute; left: 0; right: 0; bottom: 56px; max-height: 55%; background: var(--mt-surface); z-index: 19; display: flex; flex-direction: column; transform: translateY(110%); transition: transform .26s cubic-bezier(.32, .72, 0, 1); box-shadow: 0 -10px 28px rgba(0, 0, 0, .13); }
.cart-drawer.open { transform: translateY(0); }
.cart-drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border-bottom: 1px solid var(--mt-line); font-size: 13px; color: var(--mt-text-2); }
.cart-drawer-head .clr { color: var(--mt-text-3); font-size: 12.5px; display: flex; align-items: center; gap: 4px; }
.cart-drawer-head .clr .ic { width: 14px; height: 14px; }
.cart-drawer-list { overflow-y: auto; padding: 4px 14px 10px; }
.cart-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--mt-line); }
.cart-row:last-child { border-bottom: none; }
.cart-row .nm { flex: 1; font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cart-row .pr { color: var(--mt-red); font-weight: 700; font-size: 14px; }
.cart-mask { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); z-index: 18; opacity: 0; visibility: hidden; transition: opacity .26s, visibility .26s; }
.cart-mask.open { opacity: 1; visibility: visible; }

/* ============================ 结算页 ============================ */
.card { background: var(--mt-surface); border-radius: var(--mt-radius-lg); margin: 10px 12px; box-shadow: var(--mt-shadow-sm); overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; padding: 15px 14px; border-bottom: 1px solid var(--mt-line); width: 100%; text-align: left; }
.row:last-child { border-bottom: none; }
.row .k { color: var(--mt-text-2); font-size: 13.5px; flex-shrink: 0; }
.row .v { flex: 1; text-align: right; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .caret { width: 15px; height: 15px; color: var(--mt-text-3); flex-shrink: 0; }
.row .val-red { color: var(--mt-red); font-weight: 700; }

.addr-line { display: flex; gap: 11px; align-items: flex-start; }
.addr-line .ic { width: 18px; height: 18px; color: var(--mt-yellow-deep); margin-top: 2px; flex-shrink: 0; }
body.dark .addr-line .ic { color: var(--mt-yellow); }
.addr-line .txt { flex: 1; min-width: 0; }
.addr-line .nm { font-weight: 700; font-size: 15.5px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.addr-line .nm .phone { color: var(--mt-text-2); font-weight: 400; font-size: 13px; }
.addr-line .detail { font-size: 12.5px; color: var(--mt-text-2); margin-top: 3px; line-height: 1.5; }

.bill-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 14px; font-size: 13px; color: var(--mt-text-2); }
.bill-row .amt { color: var(--mt-text); font-variant-numeric: tabular-nums; }
.bill-row.cut .amt { color: var(--mt-red); }
.bill-row.total { border-top: 1px solid var(--mt-line); margin-top: 6px; padding-top: 12px; font-size: 14.5px; color: var(--mt-text); font-weight: 700; }
.bill-row.total .amt { color: var(--mt-red); font-size: 17.5px; }

.order-items { padding: 4px 14px 12px; }
.oi { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13.5px; }
.oi .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oi .qt { color: var(--mt-text-3); font-size: 12.5px; }

.submit-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; padding: 11px 14px calc(11px + var(--safe-b)); background: var(--mt-surface); border-top: 1px solid var(--mt-line); display: flex; align-items: center; gap: 12px; z-index: 70; }
.submit-bar .sum { flex: 1; }
.submit-bar .sum .amt { color: var(--mt-red); font-weight: 700; font-size: 19px; }
.submit-bar .sum .hint { font-size: 11px; color: var(--mt-text-3); }
.btn-primary { background: var(--mt-yellow); color: var(--mt-black); font-weight: 700; padding: 12px 30px; border-radius: 999px; font-size: 15px; }
.btn-primary:disabled { background: var(--mt-surface-2); color: var(--mt-text-3); }
.btn-sm { padding: 7px 16px; border-radius: 999px; font-size: 13px; border: 1px solid var(--mt-border); color: var(--mt-text-2); }
.btn-sm.solid { background: var(--mt-yellow); color: var(--mt-black); border-color: transparent; font-weight: 700; }

/* ============================ 订单页 ============================ */
.status-tabs {
        display: flex; gap: 4px; padding: 10px 12px;
        padding-top: calc(10px + var(--safe-t));
        background: var(--mt-surface); position: sticky; top: 0; z-index: 55;
        border-bottom: 1px solid var(--mt-line);
    }
.status-tab { padding: 6px 14px; border-radius: 999px; font-size: 13px; color: var(--mt-text-2); }
.status-tab.on { background: var(--mt-black); color: var(--mt-yellow); font-weight: 700; }

.order-card { background: var(--mt-surface); border-radius: var(--mt-radius-lg); margin: 10px 12px; padding: 15px; box-shadow: var(--mt-shadow-sm); }
.order-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.order-card-head .art-wrap { width: 34px; height: 34px; border-radius: 9px; }
.order-card-head .nm { flex: 1; font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order-card-head .st { font-size: 12.5px; color: var(--mt-yellow-deep); font-weight: 700; }
body.dark .order-card-head .st { color: var(--mt-yellow); }
.order-card-head .st.done { color: var(--mt-text-3); font-weight: 400; }
.order-line { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: 13px; color: var(--mt-text-2); }
.order-line .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order-line .qt { color: var(--mt-text-3); flex-shrink: 0; }
.order-card-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--mt-line); }
.order-total { margin-right: auto; font-size: 13px; color: var(--mt-text-2); }
.order-total em { font-style: normal; color: var(--mt-red); font-weight: 700; font-size: 16px; }

.timeline { padding: 6px 0 2px; }
.tl-item { display: flex; gap: 13px; position: relative; padding-bottom: 19px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before { content: ''; position: absolute; left: 10px; top: 19px; bottom: -2px; width: 2px; background: var(--mt-line); }
.tl-item:last-child::before { display: none; }
.tl-dot { width: 15px; height: 15px; border-radius: 50%; background: var(--mt-line); flex-shrink: 0; margin-top: 2px; z-index: 1; border: 3px solid var(--mt-surface); }
.tl-item.done .tl-dot { background: var(--mt-yellow); }
.tl-item.now .tl-dot { background: var(--mt-yellow); box-shadow: 0 0 0 3px var(--mt-yellow-soft); }
.tl-body { flex: 1; min-width: 0; }
.tl-title { font-size: 13.5px; font-weight: 600; }
.tl-item.now .tl-title { color: var(--mt-yellow-deep); }
body.dark .tl-item.now .tl-title { color: var(--mt-yellow); }
.tl-item:not(.done):not(.now) .tl-title { color: var(--mt-text-3); font-weight: 400; }
.tl-time { font-size: 11.5px; color: var(--mt-text-3); margin-top: 1px; }

.rider { display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: var(--mt-surface); border-radius: var(--mt-radius-lg); margin: 10px 12px; box-shadow: var(--mt-shadow-sm); }
.rider .av { width: 42px; height: 42px; border-radius: 50%; background: var(--mt-yellow); color: var(--mt-black); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.rider .av .ic { width: 23px; height: 23px; }
.rider .nm { font-weight: 700; font-size: 14px; }
.rider .sub { font-size: 11.5px; color: var(--mt-text-3); }

/* ============================ 我的 ============================ */
.profile-hero { background: var(--mt-yellow-grad); padding: 22px 16px 48px; }
.profile-hero .u { display: flex; align-items: center; gap: 14px; }
.profile-hero .u .av { width: 60px; height: 60px; border-radius: 50%; background: rgba(255, 255, 255, .85); color: var(--mt-black); display: flex; align-items: center; justify-content: center; }
.profile-hero .u .av .ic { width: 30px; height: 30px; }
.profile-hero .u .nm { font-size: 18px; font-weight: 700; color: var(--mt-black); }
.profile-hero .u .sub { font-size: 12px; color: rgba(17, 17, 17, .6); margin-top: 2px; }

.assets { display: grid; grid-template-columns: repeat(3, 1fr); margin: -36px 12px 0; background: var(--mt-surface); border-radius: var(--mt-radius-lg); box-shadow: var(--mt-shadow); padding: 16px 0; }
.asset { text-align: center; }
.asset .n { font-size: 18px; font-weight: 700; }
.asset .n em { font-style: normal; font-size: 11px; margin-left: 1px; }
.asset .l { font-size: 11.5px; color: var(--mt-text-3); margin-top: 2px; }

.menu-list { margin-top: 12px; }
.menu-row { display: flex; align-items: center; gap: 12px; padding: 15.5px 14px; border-bottom: 1px solid var(--mt-line); width: 100%; text-align: left; }
.menu-row:last-child { border-bottom: none; }
.menu-row .mi { width: 22px; display: flex; justify-content: center; color: var(--mt-text-2); flex-shrink: 0; }
.menu-row .mi .ic { width: 19px; height: 19px; }
.menu-row .mt { flex: 1; font-size: 14px; }
.menu-row .mv { font-size: 12.5px; color: var(--mt-text-3); }
.menu-row .caret { width: 15px; height: 15px; color: var(--mt-text-3); }

.switch { width: 44px; height: 26px; border-radius: 999px; background: var(--mt-line); position: relative; transition: background .2s; flex-shrink: 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
.switch.on { background: var(--mt-yellow-deep); }
.switch.on::after { transform: translateX(18px); }

/* ============================ 地址 ============================ */
.addr-card { background: var(--mt-surface); border-radius: var(--mt-radius-lg); margin: 10px 12px; padding: 15px; box-shadow: var(--mt-shadow-sm); }
.addr-card .h { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
.addr-card .h .nm { font-weight: 700; font-size: 15px; }
.addr-card .h .phone { color: var(--mt-text-2); font-size: 13px; }
.addr-card .h .tag { color: var(--mt-yellow-deep); background: var(--mt-yellow-soft); }
body.dark .addr-card .h .tag { color: var(--mt-yellow); background: #332C00; }
.addr-card .h .tag.red { color: var(--mt-red); background: var(--mt-red-soft); }
.addr-card .d { font-size: 13px; color: var(--mt-text-2); line-height: 1.5; }
.addr-card .f { display: flex; align-items: center; gap: 15px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--mt-line); font-size: 12.5px; color: var(--mt-text-3); }
.addr-card .f .sp { flex: 1; }
.addr-card .f .del { color: var(--mt-red); }

.field { padding: 13px 14px; border-bottom: 1px solid var(--mt-line); display: flex; align-items: center; gap: 12px; }
.field:last-child { border-bottom: none; }
.field label { width: 62px; color: var(--mt-text-2); font-size: 13.5px; flex-shrink: 0; }
.field input, .field select { flex: 1; border: none; outline: none; background: none; font-size: 14px; }
.field input::placeholder { color: var(--mt-text-3); }

/* ============================ Toast / Dialog / Sheet ============================ */
.toast-box { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: rgba(17, 17, 19, .92); color: #fff; padding: 10px 19px; border-radius: 999px; font-size: 13px; max-width: 78vw; animation: toastIn .22s ease both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.mask { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn .18s ease both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.dialog { background: var(--mt-surface); border-radius: var(--mt-radius-lg); width: 100%; max-width: 300px; padding: 24px 20px 0; text-align: center; animation: popIn .2s cubic-bezier(.3, 1.3, .6, 1) both; }
@keyframes popIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
.dialog .dt { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.dialog .dd { font-size: 13.5px; color: var(--mt-text-2); line-height: 1.55; margin-bottom: 21px; }
.dialog-actions { display: flex; border-top: 1px solid var(--mt-line); margin: 0 -20px; }
.dialog-actions button { flex: 1; padding: 14px; font-size: 15px; }
.dialog-actions button + button { border-left: 1px solid var(--mt-line); }
.dialog-actions .ok { color: var(--mt-yellow-deep); font-weight: 700; }
body.dark .dialog-actions .ok { color: var(--mt-yellow); }
.dialog-actions .cancel { color: var(--mt-text-2); }

.sheet-mask { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 210; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .18s ease both; }
.sheet { background: var(--mt-surface); width: 100%; max-width: 480px; border-radius: var(--mt-radius-lg) var(--mt-radius-lg) 0 0; max-height: 76vh; display: flex; flex-direction: column; padding-bottom: var(--safe-b); animation: sheetUp .26s cubic-bezier(.32, .72, 0, 1) both; }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
.sheet-head { padding: 17px; font-size: 15.5px; font-weight: 700; text-align: center; border-bottom: 1px solid var(--mt-line); position: relative; }
.sheet-head .close { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--mt-text-3); display: flex; }
.sheet-body { overflow-y: auto; padding: 6px 0; }

.coupon { display: flex; align-items: stretch; gap: 12px; margin: 10px 14px; border-radius: 11px; overflow: hidden; border: 1px solid var(--mt-line); width: calc(100% - 28px); text-align: left; }
.coupon .l { width: 92px; background: var(--mt-yellow-grad); color: var(--mt-black); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 0; flex-shrink: 0; }
.coupon .l .amt { font-size: 22px; font-weight: 800; line-height: 1; }
.coupon .l .amt em { font-style: normal; font-size: 12px; }
.coupon .l .th { font-size: 10.5px; margin-top: 3px; opacity: .75; }
.coupon .r { flex: 1; padding: 12px; display: flex; flex-direction: column; justify-content: center; }
.coupon .r .t { font-size: 13.5px; font-weight: 600; }
.coupon .r .e { font-size: 11px; color: var(--mt-text-3); margin-top: 3px; }
.coupon.used { opacity: .45; }
.coupon.picked { border-color: var(--mt-yellow-deep); box-shadow: 0 0 0 1.5px var(--mt-yellow-deep); }

/* ============================ 收藏 / 规格弹层 / 评价 ============================ */
.fav-btn { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; color: var(--mt-text-3); flex-shrink: 0; }
.fav-btn .ic { width: 19px; height: 19px; }
.fav-btn.on { color: var(--mt-red); }
.fav-btn.on .ic { fill: var(--mt-red); }

.shop-tabs { display: flex; background: var(--mt-surface); border-bottom: 1px solid var(--mt-line); flex-shrink: 0; }
.shop-tab { flex: 1; padding: 12px 0; font-size: 14px; color: var(--mt-text-2); text-align: center; position: relative; }
.shop-tab.on { color: var(--mt-black); font-weight: 700; }
.shop-tab.on::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 22px; height: 3px; border-radius: 3px; background: var(--mt-yellow-deep); }
.shop-tab .cnt { font-size: 11px; color: var(--mt-text-3); margin-left: 3px; }

.spec-sheet .sheet-body { padding: 4px 16px 16px; }
.spec-group { margin-bottom: 16px; }
.spec-group .gname { font-size: 12.5px; color: var(--mt-text-3); margin-bottom: 8px; }
.spec-opts { display: flex; flex-wrap: wrap; gap: 8px; }
.spec-opt { padding: 8px 14px; border-radius: 9px; font-size: 13px; background: var(--mt-surface-2); color: var(--mt-text-2); border: 1px solid transparent; }
.spec-opt .delta { font-size: 11px; color: var(--mt-text-3); margin-left: 3px; }
.spec-opt.on { background: var(--mt-yellow-soft); border-color: var(--mt-yellow-deep); color: var(--mt-black); font-weight: 600; }
body.dark .spec-opt.on { background: #3D3600; border-color: var(--mt-yellow); color: var(--mt-yellow); }
.spec-qty-group { margin-top: 10px; }
.spec-qty-row { display: flex; align-items: center; gap: 16px; padding: 4px 0 2px; }
.spec-qty-row .q { min-width: 30px; text-align: center; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
.spec-q {
    width: 32px; height: 32px; border-radius: 50%; border: none; font-size: 18px; font-weight: 700;
    background: var(--mt-yellow); color: var(--mt-black); line-height: 1;
    display: flex; align-items: center; justify-content: center;
}
.spec-q.off { background: var(--mt-surface-2); color: var(--mt-text-3); }
.spec-foot { display: flex; align-items: center; gap: 12px; padding: 12px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--mt-line); }
.spec-foot .price { flex: 1; }

.review-item { padding: 14px; border-bottom: 1px solid var(--mt-line); }
.review-item:last-child { border-bottom: none; }
.review-head { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
.review-av { width: 32px; height: 32px; border-radius: 50%; background: var(--mt-surface-2); color: var(--mt-text-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.review-av .ic { width: 17px; height: 17px; }
.review-user { font-size: 13px; font-weight: 600; }
.review-date { font-size: 11px; color: var(--mt-text-3); margin-top: 1px; }
.review-stars { display: flex; gap: 1px; margin-left: auto; }
.review-stars .ic { width: 13px; height: 13px; color: var(--mt-orange); }
.review-stars .ic.off { color: var(--mt-line); }
.review-text { font-size: 13px; color: var(--mt-text-2); line-height: 1.55; }
.review-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }

.star-row { display: flex; gap: 6px; justify-content: center; padding: 6px 0 14px; }
.star-row button { display: flex; }
.star-row .ic { width: 30px; height: 30px; color: var(--mt-line); }
.star-row .ic.on { color: var(--mt-orange); }
.tag-pick { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }

.msg-item { display: flex; gap: 12px; padding: 15px 14px; border-bottom: 1px solid var(--mt-line); }
.msg-item .mi { width: 38px; height: 38px; border-radius: 11px; background: var(--mt-yellow-bg); color: var(--mt-yellow-deep); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
body.dark .msg-item .mi { background: #332C00; color: var(--mt-yellow); }
.msg-item .mt { flex: 1; min-width: 0; }
.msg-item .mtitle { font-size: 14px; font-weight: 600; }
.msg-item .mdesc { font-size: 12.5px; color: var(--mt-text-2); margin-top: 2px; line-height: 1.5; }
.msg-item .mtime { font-size: 11px; color: var(--mt-text-3); flex-shrink: 0; }

.balance-row { display: flex; align-items: center; gap: 10px; padding: 15px 14px; border-bottom: 1px solid var(--mt-line); }
.balance-row .k { color: var(--mt-text-2); font-size: 13.5px; flex-shrink: 0; }
.balance-row .v { flex: 1; text-align: right; font-size: 13px; color: var(--mt-text-3); }
.balance-row .v em { font-style: normal; color: var(--mt-red); font-weight: 700; }

/* 高德真实地图：瓦片网格 + 覆盖层（商家/收货点/骑手） */
.amap-wrap { position: relative; height: 170px; overflow: hidden; background: var(--map-bg); }
.amap-grid { position: absolute; top: 0; left: 0; display: grid; grid-template-columns: repeat(3, 256px); grid-auto-rows: 256px; width: 768px; }
.amap-grid .tile { width: 256px; height: 256px; display: block; }
.amap-overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-pin-label { font-size: 11px; fill: var(--mt-text); font-weight: 700; paint-order: stroke; stroke: rgba(255,255,255,.92); stroke-width: 3px; }
.amap-fallback { position: absolute; inset: 0; }
.amap-fallback .map-card { margin: 0; box-shadow: none; border-radius: 0; height: 100%; }
.amap-wrap.tiles-failed .amap-grid { display: none; }
.amap-fallback { position: absolute; inset: 0; }
.amap-fallback .map-card { margin: 0; box-shadow: none; border-radius: 0; height: 100%; }
.amap-wrap.tiles-failed .amap-grid { display: none; }
.amap-credit { position: absolute; right: 6px; bottom: 4px; font-size: 9px; color: var(--mt-text-3); background: rgba(255,255,255,.7); padding: 0 4px; border-radius: 3px; }
body.dark .amap-credit { background: rgba(0,0,0,.55); color: var(--mt-text-2); }

/* ============================ 视觉精修：首页层次与卡片质感 ============================ */
body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(circle at 8% -8%, rgba(255, 209, 0, .2), transparent 28%),

    const kIcon = id => KICO[id]

        : icon((CATEGORIES.find(c => c.id === id) || {}).ic || 'grid');

    function shade(hex, amt) {
        const n = parseInt(hex.slice(1), 16);
        let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
        const t = amt < 0 ? 0 : 255;
        const k = Math.abs(amt);
        r = Math.round((t - r) * k + r);
        g = Math.round((t - g) * k + g);
        b = Math.round((t - b) * k + b);
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }
    function mkPal(main) {
        return { main: main, dark: shade(main, -0.26), deep: shade(main, -0.46), light: shade(main, 0.62), tint: shade(main, 0.86) };
    }

            '<div class="tag-pick">' + REVIEW_TAGS.map(t =>
                '<button type="button" class="chip" data-review-tag="' + esc(t) + '">' + esc(t) + '</button>').join('') +
            '</div>' +
            '<div style="padding:0 16px 16px">' +
                '<textarea id="reviewText" rows="3" maxlength="120" placeholder="说说菜品口味、配送体验…" ' +
                'style="width:100%;border:1px solid var(--mt-border);border-radius:11px;padding:11px;font:inherit;resize:none;background:var(--mt-surface-2);color:var(--mt-text);outline:none"></textarea>' +
            '</div>';

        const layer = document.createElement('div');
        layer.className = 'sheet-mask';
        layer.innerHTML =
            '<div class="sheet" role="dialog" aria-modal="true">' +
                '<div class="sheet-head">评价订单' +
                    '<button type="button" class="close" data-sheet="close" aria-label="关闭">' + icon('close') + '</button></div>' +
                '<div class="sheet-body">' + body + '</div>' +
                '<div style="padding:0 16px calc(16px + var(--safe-b))">' +
                    '<button type="button" class="btn-primary" style="width:100%" data-review-submit data-id="' + order.id + '">发布评价</button>' +

        layer.addEventListener('click', e => {
            if (e.target.closest('[data-sheet="close"]') || e.target === layer) { layer.remove(); syncLock(); return; }

            if (star) {
                state.reviewDraft.rating = Number(star.dataset.reviewStar);
                layer.querySelectorAll('.star-row .ic').forEach((s, i) => {
                    s.classList.toggle('on', i < state.reviewDraft.rating);
                });

    /* ======================================================================
     * 4. 状态与持久化
     * ==================================================================== */
    const state = {
        cart: { shopId: null, lines: [] },   // 行项目模型：{ key, dishId, picks, qty, unit }
        addresses: [], orders: [],
        ownedCoupons: ['c1', 'c2'],          // 已领取的红包
        favorites: [],                       // 收藏的商家
        balance: 128, useBalance: true,
        couponId: null, addressId: null, couponOptOut: false,
        timeSlot: TIME_SLOTS[0], remark: '',
        searchHistory: [], searchKeyword: '',
        category: 'all', sort: 'recommend',
        orderFilter: 'all', shopTab: 'menu',
        couponTab: 'all',
        member: { on: false, expire: '' },
        claimedGroups: [],
        points: 0,

    };

    function loadState() {
        const raw = readJSON('kd.cart', null);
        if (raw && typeof raw === 'object' && Array.isArray(raw.lines)) {
            const lines = [];
            raw.lines.forEach(l => {
                const dishId = Number(l.dishId), qty = Math.floor(Number(l.qty));
                const entry = DISH_INDEX.get(dishId);
                if (!entry || qty <= 0) return;
                const picks = Array.isArray(l.picks) ? l.picks.filter(p => typeof p === 'string') : [];
                lines.push({
                    key: lineKey(dishId, picks), dishId: dishId, picks: picks,
                    qty: Math.min(qty, MAX_QTY), unit: specUnitPrice(entry.dish, picks)
                });
            });
            const sid = SHOP_BY_ID.has(raw.shopId) ? raw.shopId : null;
            state.cart = { shopId: lines.length ? sid : null, lines: lines };
        }
        const addrs = readJSON('kd.addresses', null);
        state.addresses = (Array.isArray(addrs) && addrs.length) ? addrs : DEFAULT_ADDRESSES.slice();
        if (!state.addresses.some(a => a.isDefault)) state.addresses[0].isDefault = true;
        const orders = readJSON('kd.orders', null);
        state.orders = (Array.isArray(orders) && orders.length) ? orders : SEED_ORDERS.slice();
        const hist = readJSON('kd.searchHistory', null);
        state.searchHistory = Array.isArray(hist) ? hist.slice(0, 10) : [];
        const favs = readJSON('kd.favs', null);
        state.favorites = Array.isArray(favs) ? favs.filter(id => SHOP_BY_ID.has(id)) : [];
        const owned = readJSON('kd.coupons', null);
        state.ownedCoupons = Array.isArray(owned) && owned.length
            ? owned.filter(id => COUPON_BY_ID.has(id)) : ['c1', 'c2'];
        const balRaw = readJSON('kd.balance', null);
        const bal = balRaw == null ? NaN : Number(balRaw);
        state.balance = isNaN(bal) ? 128 : bal;
        const mem = readJSON('kd.member', null);
        state.member = (mem && typeof mem === 'object') ? mem : { on: false, expire: '' };
        // 会员状态完全由本地演示数据驱动，也必须在每次启动时校验有效期。
        // YYYY-MM-DD 使用字典序比较即可，避免本地时区解析带来的偏差。
        if (state.member.on && (!/^\d{4}-\d{2}-\d{2}$/.test(state.member.expire || '') || state.member.expire < todayStr())) {
            state.member = { on: false, expire: '' };
            store('kd.member', JSON.stringify(state.member));
        }
        const grp = readJSON('kd.groups', null);
        state.claimedGroups = Array.isArray(grp) ? grp.filter(id => GROUP_BY_ID.has(id)) : [];
        const pts = readJSON('kd.points', null);
        state.points = (pts == null || isNaN(Number(pts))) ? 0 : Number(pts);
        const dr = readJSON('kd.draws', null);
        const today = todayStr();
        if (dr && dr.d === today && typeof dr.f === 'number') {
            state.freeDraws = dr.f; state.lastDrawDate = dr.d;
        } else { state.freeDraws = 1; state.lastDrawDate = today; }
        state.addressId = (state.addresses.find(a => a.isDefault) || state.addresses[0]).id;
    }
    const saveCart = () => store('kd.cart', JSON.stringify(state.cart));
    const saveAddresses = () => store('kd.addresses', JSON.stringify(state.addresses));
    const saveOrders = () => store('kd.orders', JSON.stringify(state.orders));
    const saveHistory = () => store('kd.searchHistory', JSON.stringify(state.searchHistory));
    const saveFavs = () => store('kd.favs', JSON.stringify(state.favorites));
    const saveCoupons = () => store('kd.coupons', JSON.stringify(state.ownedCoupons));
    const saveBalance = () => store('kd.balance', JSON.stringify(state.balance));
    const saveMember = () => store('kd.member', JSON.stringify(state.member));
    const saveGroups = () => store('kd.groups', JSON.stringify(state.claimedGroups));
    const savePoints = () => store('kd.points', JSON.stringify(state.points));
    const saveDraws = () => store('kd.draws', JSON.stringify({ f: state.freeDraws, d: state.lastDrawDate }));

    /* ======================================================================
     * 5. 购物车 & 费用
     * ==================================================================== */
    const cartShop = () => (state.cart.shopId ? SHOP_BY_ID.get(state.cart.shopId) : null);
    const cartLines = () => state.cart.lines.slice();
    const cartCount = () => state.cart.lines.reduce((s, l) => s + l.qty, 0);
    const cartSubtotal = () => state.cart.lines.reduce((s, l) => s + l.unit * l.qty, 0);

    function discountFor(shop, subtotal) {
        if (!shop) return 0;
        let best = 0;
        shop.discounts.forEach(d => { if (subtotal >= d.threshold && d.cut > best) best = d.cut; });
        return best;
    }
    /* 下一档满减还差多少 */
    function nextDiscountGap(shop, subtotal) {
        if (!shop) return null;
        const next = shop.discounts.filter(d => d.threshold > subtotal)
            .sort((a, b) => a.threshold - b.threshold)[0];
        return next ? { need: next.threshold - subtotal, cut: next.cut } : null;
    }
    function bill(shop, lines, couponId, memberFreeShip) {
        const subtotal = lines.reduce((s, l) => s + (l.unit != null ? l.unit : l.dish.price) * l.qty, 0);
        const qty = lines.reduce((s, l) => s + l.qty, 0);
        const packing = shop ? shop.packingFee * qty : 0;
        const delivery = shop ? shop.deliveryFee : 0;
        const discount = discountFor(shop, subtotal);
        const coupon = couponId ? COUPON_BY_ID.get(couponId) : null;
        const couponOk = coupon && subtotal >= coupon.threshold &&
            (!coupon.shopId || (shop && coupon.shopId === shop.id));
        const couponCut = (couponOk && !coupon.ship) ? coupon.amount : 0;
        const couponShip = (couponOk && coupon.ship) ? delivery : 0;
        const memberShip = memberFreeShip ? delivery : 0;
        const total = Math.max(subtotal + packing + delivery - discount - couponCut - Math.max(couponShip, memberShip), 0);
        return { subtotal: subtotal, qty: qty, packing: packing, delivery: delivery, discount: discount,
                 couponCut: couponCut, shipCut: Math.max(couponShip, memberShip), total: total };
    }

    function addDish(id, picks, nArg) {
        const entry = DISH_INDEX.get(Number(id));
        if (!entry) return;
        const shop = entry.shop;
        // 带规格的菜品：第一次点先弹规格面板（Meituan 交互）
        if (!picks && specsOf(id).length) { openSpecSheet(Number(id)); return; }

        if (state.cart.shopId && state.cart.shopId !== shop.id && cartCount() > 0) {
            const other = SHOP_BY_ID.get(state.cart.shopId);
            confirmDialog({ title: '更换商家', message: '购物车中已有「' + other.name + '」的商品，切换商家需要先清空购物车。', okText: '清空并添加' })
                .then(ok => { if (!ok) return; state.cart = { shopId: shop.id, lines: [] }; state.couponId = null; addDish(id, picks, nArg); });
            return;
        }
        picks = picks || [];
        state.cart.shopId = shop.id;
        const key = lineKey(id, picks);
        const found = state.cart.lines.find(l => l.key === key);
        const n = Math.max(1, Math.min(Math.floor(Number(nArg)) || 1, MAX_QTY));
        if (found) {
            const room = MAX_QTY - found.qty;
            if (room <= 0) { toast('单品最多可点 ' + MAX_QTY + ' 份'); return; }
            found.qty += Math.min(n, room);
            if (n > room) toast('已达单品上限 ' + MAX_QTY + ' 份');
        } else {
            state.cart.lines.push({
                key: key, dishId: Number(id), picks: picks,
                qty: n, unit: specUnitPrice(entry.dish, picks)
            });
        }
        saveCart();
        refreshShopUI();
    }
    function minusLine(key) {
        const i = state.cart.lines.findIndex(l => l.key === key);
        if (i < 0) return;
        const l = state.cart.lines[i];
        l.qty -= 1;
        if (l.qty <= 0) state.cart.lines.splice(i, 1);
        if (!cartCount()) state.cart.shopId = null;
        saveCart();
        refreshShopUI();
    }
    /* 菜品行上的「−」：该菜品可能有多条规格行，减最后加入的那条 */
    function minusDish(id) {
        const ids = state.cart.lines.map(l => l.dishId);
        const idx = ids.lastIndexOf(Number(id));
        if (idx < 0) return;
        minusLine(state.cart.lines[idx].key);
    }
    function clearCart() { state.cart = { shopId: null, lines: [] }; state.couponId = null; state.couponOptOut = false; saveCart(); refreshShopUI(); }

    /* ---------- 规格选择面板 ---------- */
    function openSpecSheet(dishId) {
        const entry = DISH_INDEX.get(dishId);
        if (!entry) return;
        const groups = specsOf(dishId);
        if (!groups.length) { addDish(dishId, []); return; }
        const picks = groups.map(g => g.opts[0][0]);
        const unit = () => specUnitPrice(entry.dish, picks);
        let qty = 1;

        function bodyHTML() {
            return groups.map((g, gi) =>
                '<div class="spec-group"><div class="gname">' + esc(g.name) + '</div><div class="spec-opts">' +
                g.opts.map(o =>
                    '<button type="button" class="spec-opt' + (picks[gi] === o[0] ? ' on' : '') + '"' +
                    ' data-gi="' + gi + '" data-v="' + esc(o[0]) + '">' + esc(o[0]) +
                    (o[1] ? '<span class="delta">+' + money(o[1]) + '</span>' : '') + '</button>').join('') +
                '</div></div>').join('') +
                '<div class="spec-qty-group"><div class="gname">份数</div>' +
                    '<div class="spec-qty-row">' +
                        '<button type="button" class="spec-q' + (qty <= 1 ? ' off' : '') + '" data-spec-qminus aria-label="减少份数">−</button>' +
                        '<span class="q">' + qty + '</span>' +
                        '<button type="button" class="spec-q' + (qty >= MAX_QTY ? ' off' : '') + '" data-spec-qplus aria-label="增加份数">+</button>' +
                    '</div></div>';
        }

        const layer = document.createElement('div');
        layer.className = 'sheet-mask spec-sheet';
        layer.innerHTML =
            '<div class="sheet" role="dialog" aria-modal="true">' +
                '<div class="sheet-head">' + esc(entry.dish.name) +
                    '<button type="button" class="close" data-sheet="close" aria-label="关闭">' + icon('close') + '</button></div>' +
                '<div class="sheet-body">' + bodyHTML() + '</div>' +
                '<div class="spec-foot">' +
                    '<span class="price">' + priceHTML(unit()) + '</span>' +
                    '<button type="button" class="btn-primary" data-spec-add style="padding:11px 26px">加入购物车</button>' +
                '</div>' +
            '</div>';

        layer.addEventListener('click', e => {
            if (e.target.closest('[data-sheet="close"]') || e.target === layer) { layer.remove(); syncLock(); return; }
            if (e.target.closest('[data-spec-qminus]') || e.target.closest('[data-spec-qplus]')) {
                const plus = !!e.target.closest('[data-spec-qplus]');
                qty = Math.max(1, Math.min(MAX_QTY, qty + (plus ? 1 : -1)));
                layer.querySelector('.sheet-body').innerHTML = bodyHTML();
                layer.querySelector('.spec-foot .price').innerHTML = priceHTML(unit() * qty);
                return;
            }
            const opt = e.target.closest('.spec-opt');
            if (opt) {
                picks[Number(opt.dataset.gi)] = opt.dataset.v;
                layer.querySelector('.sheet-body').innerHTML = bodyHTML();
                layer.querySelector('.spec-foot .price').innerHTML = priceHTML(unit());
                return;
            }
            if (e.target.closest('[data-spec-add]')) {
                layer.remove(); syncLock();
                addDish(dishId, picks, qty);
                toast('已加入购物车' + (qty > 1 ? ' × ' + qty : ''));
            }
        });
        $('#layerRoot').appendChild(layer);
        syncLock();
    }

    /* ======================================================================

    const HOT_WORDS = ['麻辣烫', '寿司', '汉堡', '烤肉', '提拉米苏', '刺身', '薯条', '葡萄'];
    function searchResults(keyword) {
        const kw = keyword.trim().toLowerCase();
        if (!kw) return null;
        return SHOPS.map(shop => {
            const shopHit = shop.name.toLowerCase().includes(kw) || shop.desc.toLowerCase().includes(kw);
            const dishes = shop.menu.filter(d =>
                d.name.toLowerCase().includes(kw) || d.desc.toLowerCase().includes(kw) || d.cat.toLowerCase().includes(kw));
            if (!shopHit && !dishes.length) return null;
            return { shop: shop, dishes: dishes };
        }).filter(Boolean);
    }
    function renderSearch() {
        const kw = state.searchKeyword || '';
        const results = searchResults(kw);
        const head = '<div class="search-head">' +
            '<button type="button" class="icon-btn" data-go="home" aria-label="返回">' + icon('back') + '</button>' +
            '<div class="search-field">' + icon('search') +

                '<input id="kw" type="search" placeholder="搜索商家或菜品" autocomplete="off" value="' + esc(kw) + '">' +
                (kw ?                 '<button type="button" class="clr" data-action="clear-kw" aria-label="清空">' + icon('close') + '</button>' : '') +
            '</div>' +
            '<button type="button" class="search-go" data-action="do-search">搜索</button>' +
            '<div class="suggest" id="suggest" hidden></div>' +
        '</div>';
        if (results === null) {
            return '<div class="page">' + head +
                '<div class="block"><div class="block-head"><h2>热门搜索</h2></div><div class="chips">' +
                    HOT_WORDS.map(w => '<button type="button" class="chip hot" data-action="use-word" data-word="' + esc(w) + '">' + esc(w) + '</button>').join('') +
                '</div></div>' +
                (state.searchHistory.length
                    ? '<div class="block"><div class="block-head"><h2>搜索历史</h2>' +
                        '<button type="button" class="more" data-action="clear-history">清空</button></div><div class="chips">' +
                        state.searchHistory.map(w => '<button type="button" class="chip" data-action="use-word" data-word="' + esc(w) + '">' + esc(w) + '</button>').join('') +
                      '</div></div>'
                    : '') +
                '<div class="block"><div class="block-head"><h2>猜你想吃</h2></div></div>' +
                '<div class="shop-list">' + SHOPS.slice(0, 3).map(shopCardHTML).join('') + '</div>' +
            '</div>';
        }
        if (!results.length) {
            return '<div class="page">' + head +

            '</div>';

        return '<div class="page">' + head +
            '<div class="block"><div class="block-head"><h2>找到 ' + results.length + ' 家相关商家</h2></div></div>' +
            '<div class="shop-list">' + results.map(r =>

        const subtotal = cartSubtotal();

        const lack = shop ? Math.max(shop.minPrice - subtotal, 0) : 0;
        const gap = nextDiscountGap(shop, subtotal);
        const hint = !n ? '购物车是空的'
            : (subtotal < shop.minPrice ? '差 ' + money(lack) + ' 起送'
                : (gap ? '再买 ' + money(gap.need) + ' 可减 ' + money(gap.cut)
                    : '已满 ' + money(shop.minPrice) + ' 起送 · 已达最高满减'));

    function refreshShopUI() {
        if (!document.querySelector('.shop-page')) return;
        const shop = cartShop() || SHOP_BY_ID.get(Number(parseHash().args[0]));
        if (!shop) return;
        document.querySelectorAll('[data-dish-row]').forEach(row => {
            const id = Number(row.dataset.dishRow);
            const qty = state.cart.lines.filter(l => l.dishId === id).reduce((s, l) => s + l.qty, 0);
            const stepper = row.querySelector('.stepper');
            const exist = stepper.querySelector('[data-qty]');
            if (qty > 0) {
                if (exist) exist.textContent = qty;
                else stepper.insertAdjacentHTML('afterbegin',
                    '<button type="button" class="step-btn step-minus" data-action="minus-dish" data-id="' + id + '" aria-label="减少">' + icon('minus') + '</button>' +
                    '<span class="step-qty" data-qty="' + id + '" aria-live="polite">' + qty + '</span>');
            } else if (exist) {
                exist.previousElementSibling.remove();
                exist.remove();
            }
        });
        document.querySelectorAll('[data-cat-dot]').forEach(dot => {
            const total = state.cart.lines.filter(l => {
                const dd = DISH_INDEX.get(l.dishId);
                return dd && dd.dish.cat === dot.dataset.catDot;
            }).reduce((s, l) => s + l.qty, 0);
            dot.hidden = total === 0;
            dot.textContent = total;
        });
        const bar = document.getElementById('cartBar');
        if (bar) bar.outerHTML = cartBarHTML(shop);
        renderDrawer();
    }

        if (!list) return;
        list.innerHTML = lines.length
            ? lines.map(l => {

    function toggleDrawer(force) {
        const drawer = document.getElementById('cartDrawer');
        const mask = document.getElementById('cartMask');
        if (!drawer) return;
        const open = typeof force === 'boolean' ? force : !drawer.classList.contains('open');
        drawer.classList.toggle('open', open);
        if (mask) mask.classList.toggle('open', open);
    }
    function afterRenderShop() {
        const list = document.getElementById('dishList');
        if (!list) return;
        const navBtns = Array.prototype.slice.call(document.querySelectorAll('[data-cat-nav]'));
        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const section = list.querySelector('[data-cat-section="' + btn.dataset.catNav + '"]');
                if (section) list.scrollTop = section.offsetTop;
            });
        });
        list.addEventListener('scroll', () => {
            const sections = Array.prototype.slice.call(list.querySelectorAll('[data-cat-section]'));
            if (!sections.length) return;
            const top = list.scrollTop + 10;
            let current = sections[0];
            sections.forEach(s => { if (s.offsetTop <= top) current = s; });
            navBtns.forEach(b => b.classList.toggle('on', b.dataset.catNav === current.dataset.catSection));
        });
        renderDrawer();
    }

    /* ======================================================================
     * 10. 结算
     * ==================================================================== */
    function renderCheckout() {
        const shop = cartShop();
        const lines = cartLines();
        if (!shop || !lines.length) {
            return '<div class="page"><div class="subheader">' +
                '<button type="button" class="back" data-go="home" aria-label="返回">' + icon('back') + '</button><h1>确认订单</h1></div>' +
                emptyState('cart', '购物车是空的', '先去挑点好吃的吧') +
                '<div style="padding:0 24px"><button type="button" class="btn-primary" style="width:100%" data-go="home">去逛逛</button></div>' +
            '</div>';
        }
        const addr = state.addresses.find(a => a.id === state.addressId) || currentAddress();
        /* 红包优选：按抵扣金额降序，最优券自动置顶选中；商家券仅限本店可用 */
        const b0 = bill(shop, lines, null, state.member.on);
        const couponValue = c => (c.ship ? shop.deliveryFee : c.amount);
        const applicable = state.ownedCoupons.map(id => COUPON_BY_ID.get(id)).filter(c =>
            c && (!c.shopId || c.shopId === shop.id) && b0.subtotal >= c.threshold);
        if (state.couponId) {
            const held = COUPON_BY_ID.get(state.couponId);
            if (!held || (held.shopId && held.shopId !== shop.id) || b0.subtotal < held.threshold) state.couponId = null;
        }
        if (!state.couponId && !state.couponOptOut) {
            const best = applicable.slice().sort((x, y) => couponValue(y) - couponValue(x))[0];
            if (best) state.couponId = best.id;
        }
        const b = bill(shop, lines, state.couponId, state.member.on);
        const coupon = state.couponId ? COUPON_BY_ID.get(state.couponId) : null;
        const bestCoupon = applicable.slice().sort((x, y) => couponValue(y) - couponValue(x))[0] || null;
        const isBest = !!coupon && !!bestCoupon && coupon.id === bestCoupon.id;
        const usable = applicable.length;
        const balanceCut = state.useBalance ? Math.min(state.balance, b.total) : 0;
        const payable = b.total - balanceCut;
        const nextGap = nextDiscountGap(shop, b.subtotal);
        return '<div class="page" style="padding-bottom:96px">' +
            '<div class="subheader">' +
                '<button type="button" class="back" data-go="shop/' + shop.id + '" aria-label="返回">' + icon('back') + '</button>' +
                '<h1>确认订单</h1>' +
            '</div>' +
            '<div class="card">' +
                '<button type="button" class="row" data-action="choose-address">' +
                    '<span class="addr-line">' + icon('pin') +
                        '<span class="txt">' +
                            '<span class="nm">' + esc(addr.name) + '<span class="phone">' + esc(addr.phone) + '</span></span>' +
                            '<span class="detail">' + esc(addr.detail) + '</span>' +
                        '</span></span>' +
                    icon('chev-r', 'caret') +
                '</button>' +
                '<button type="button" class="row" data-action="choose-time">' +
                    '<span class="k">送达时间</span>' +
                    '<span class="v">' + esc(state.timeSlot) + '</span>' +
                    icon('chev-r', 'caret') +
                '</button>' +

    /* 真实地图瓦片：高德（免 key），按订单地址换算瓦片坐标 */
    const CHENGDU_SPOTS = [
        { kw: '天府大道', lng: 104.0652, lat: 30.5590 },
        { kw: '天府软件园', lng: 104.0680, lat: 30.5450 },
        { kw: '环球中心', lng: 104.0610, lat: 30.5730 },
        { kw: '春熙路', lng: 104.0810, lat: 30.6570 },
        { kw: '宽窄巷子', lng: 104.0530, lat: 30.6640 },
        { kw: '锦江', lng: 104.0800, lat: 30.6300 },
        { kw: '高新区', lng: 104.0630, lat: 30.5400 },
        { kw: '武侯', lng: 104.0430, lat: 30.6420 },
        { kw: '锦江区', lng: 104.0800, lat: 30.6600 }
    ];
    const CITY_CENTER = { lng: 104.0657, lat: 30.6598 };   // 天府广场
    function geocode(addr) {
        const a = String(addr || '');
        for (const s of CHENGDU_SPOTS) if (a.indexOf(s.kw) !== -1) return s;
        return CITY_CENTER;
    }
    function lngLatToTile(lng, lat, z) {
        const n = Math.pow(2, z);
        const x = (lng + 180) / 360 * n;
        const latRad = lat * Math.PI / 180;
        const y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
        return { x: x, y: y, fx: x, fy: y };
    }
    /* 高德瓦片地图：3×2 张 256px 瓦片，目标地址落在容器中心；商家用真实品牌坐标标注 */
    function amapHTML(lng, lat, distanceKm, shopId, showRider) {
        const Z = 13, COLS = 3, ROWS = 2;
        const t = lngLatToTile(lng, lat, Z);
        const cx = Math.floor(t.fx), cy = Math.floor(t.fy);
        const offX = 1, offY = 0;
        let tiles = '';
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const x = cx + c - offX, y = cy + r - offY;
                const sub = ((x % 4) + 4) % 4 + 1;
                tiles += '<img class="tile" src="https://webrd0' + sub + '.is.autonavi.com/appmaptile' +
                    '?lang=zh_cn&size=1&scale=1&style=7&x=' + x + '&y=' + y + '&z=' + Z + '"' +
                    ' alt="" loading="lazy" decoding="async">';
            }
        }
        // 目标地址在瓦片画布上的像素位置
        const px = (t.fx - (cx - offX)) * 256;
        const py = (t.fy - (cy - offY)) * 256;
        const tx = 228 - px, ty = 85 - py;
        // 商家按真实品牌坐标换算像素偏移，超出画布时沿同方向收边
        const shop = SHOP_BY_ID.get(shopId);
        const g = shopLngLat(shopId);
        const gs = lngLatToTile(g[0], g[1], Z);
        let sx = 228 + (gs.fx - t.fx) * 256;
        let sy = 85 + (gs.fy - t.fy) * 256;
        sx = Math.max(30, Math.min(426, sx));
        sy = Math.max(26, Math.min(148, sy));
        const brand = shop ? shop.art[1] : '#B4472A';
        const brandName = shop ? shop.name : '商家';
        return '<div class="amap-wrap">' +
            '<div class="amap-fallback">' + mapHTML(null, 0.45, showRider) + '</div>' +
            '<div class="amap-grid" style="transform:translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px)">' + tiles + '</div>' +
            '<svg class="amap-overlay" viewBox="0 0 456 170">' +
                '<path d="M' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ' L228 85" stroke="var(--mt-yellow-deep)" stroke-width="3" stroke-dasharray=".5 8" stroke-linecap="round" fill="none"/>' +
                (showRider
                    ? '<g transform="translate(' + ((sx + 228) / 2).toFixed(1) + ',' + ((sy + 85) / 2).toFixed(1) + ')">' +
                        '<circle class="map-rider-pulse" r="13" fill="var(--mt-yellow-deep)"/>' +
                        '<circle r="13" fill="var(--mt-yellow)" stroke="#fff" stroke-width="2.5"/>' +
                        '<g transform="translate(-7.5,-7.5)"><svg width="15" height="15" viewBox="0 0 24 24"><use href="#i-bike" style="color:var(--mt-black)"/></svg></g>' +
                      '</g>'
                    : '') +
                '<g transform="translate(' + sx.toFixed(1) + ',' + sy.toFixed(1) + ')">' +
                    '<circle r="10" fill="' + brand + '" stroke="#fff" stroke-width="2.5"/>' +
                    '<circle r="3.4" fill="#fff"/>' +
                '</g>' +
                '<g transform="translate(228,85)">' +
                    '<circle r="11" fill="var(--mt-yellow)" stroke="var(--mt-black)" stroke-width="2.5"/>' +
                    '<path d="M-3.4 1.2 1.6 5.4M-3.6 5.4 -1 -3.4 4.4 -1.2" stroke="var(--mt-black)" stroke-width="1.8" fill="none" stroke-linecap="round"/>' +
                '</g>' +
                '<text x="' + (sx + 14).toFixed(1) + '" y="' + (sy + 4).toFixed(1) + '" class="map-pin-label">' + esc(brandName) + '</text>' +
                '<text x="242" y="89" class="map-pin-label">收货地址</text>' +
            '</svg>' +
            '<span class="amap-credit">© 高德地图</span>' +
        '</div>';
    }

    /* 配送路线示意图（SVG 兜底：地图瓦片加载失败时显示） */
    function mapHTML(shop, progress, showRider) {
        const prog = Math.min(Math.max(progress == null ? 0.45 : progress, 0.1), 0.94);
        // 路线：M48 124 → 上 → 右 → 上 → 右到收货点
        const seg = [
            [48, 124], [48, 78], [106, 78], [106, 36], [292, 36]
        ];
        const lens = [46, 58, 42, 186], total = lens.reduce((s, v) => s + v, 0);
        let target = total * prog, pos = seg[0];
        for (let i = 0; i < lens.length; i++) {
            if (target <= lens[i]) {
                const t = target / lens[i];
                pos = [seg[i][0] + (seg[i + 1][0] - seg[i][0]) * t, seg[i][1] + (seg[i + 1][1] - seg[i][1]) * t];
                break;
            }
            target -= lens[i];
        }
        return '<div class="map-card">' +
            '<svg viewBox="0 0 340 170" role="img" aria-label="配送路线示意图">' +
                '<rect width="340" height="170" fill="var(--map-bg)"/>' +
                '<rect class="map-block" x="10" y="10" width="76" height="52" rx="7"/>' +
                '<rect class="map-block" x="126" y="10" width="96" height="52" rx="7"/>' +
                '<rect class="map-block" x="252" y="10" width="78" height="52" rx="7"/>' +
                '<rect class="map-block" x="10" y="94" width="76" height="66" rx="7"/>' +
                '<rect class="map-block" x="126" y="94" width="96" height="66" rx="7"/>' +
                '<rect class="map-block" x="252" y="94" width="78" height="66" rx="7"/>' +
                '<path class="map-road" d="M0 78 H340 M0 36 H340 M106 0 V170 M232 0 V170"/>' +
                '<path class="map-street" d="M0 124 H340 M48 0 V170"/>' +
                '<path class="map-route" d="M48 124 L48 78 L106 78 L106 36 L292 36"/>' +
                '<g transform="translate(48,124)">' +
                    '<circle r="10" fill="var(--mt-surface)" stroke="var(--mt-black)" stroke-width="2.5"/>' +
                    '<circle r="3.6" fill="var(--mt-black)"/>' +
                '</g>' +
                '<text class="map-label" x="62" y="128">商家</text>' +
                '<g transform="translate(292,36)">' +
                    '<circle r="11" fill="var(--mt-yellow)" stroke="var(--mt-black)" stroke-width="2.5"/>' +
                    '<path d="M-3.4 1.2 1.6 5.4M-3.6 5.4 -1 -3.4 4.4 -1.2" stroke="var(--mt-black)" stroke-width="1.8" fill="none" stroke-linecap="round"/>' +
                '</g>' +
                '<text class="map-label" x="292" y="18" text-anchor="end">收货地址</text>' +
                (showRider
                    ? '<g transform="translate(' + pos[0].toFixed(1) + ',' + pos[1].toFixed(1) + ')">' +
                        '<circle class="map-rider-pulse" r="12" fill="var(--mt-yellow-deep)"/>' +
                        '<circle r="12" fill="var(--mt-yellow)" stroke="#fff" stroke-width="2.5"/>' +
                        '<g transform="translate(-7,-7)">' +
                            '<svg width="14" height="14" viewBox="0 0 24 24">' +
                                '<use href="#i-bike" style="color:var(--mt-black)"/>' +
                            '</svg>' +
                        '</g>' +
                      '</g>'
                    : '') +
            '</svg>' +
        '</div>';
    }

    function afterRenderLottery() {
        const spin = state._spin;
        if (!spin) return;
        state._spin = null;
        const cells = Array.from(document.querySelectorAll('.lc-cell'));
        let cur = -1, step = 0;
        const light = i => { cells.forEach(c => c.classList.remove('lit')); if (i >= 0 && cells[i]) cells[i].classList.add('lit'); };
        const totalSteps = 8 * 3 + spin.target;
        const iv = setInterval(() => {
            cur = (cur + 1) % 8;
            light(cur);
            step++;
            if (step >= totalSteps) {
                clearInterval(iv);
                light(spin.target);
                grantLottery(spin.target);
            }
        }, 75);
    }
    function grantLottery(i) {
        const p = LOTTERY_PRIZES[i];
        let msg, title = p.t;
        if (p.couponId) {
            if (state.ownedCoupons.indexOf(p.couponId) === -1) state.ownedCoupons.push(p.couponId);
            saveCoupons(); msg = '已将「' + p.t + '」放入你的红包';
        } else if (p.vip) {
            if (!state.member.on) {
                const d = new Date(); d.setDate(d.getDate() + 7);
                const pad = n => String(n).padStart(2, '0');
                state.member = { on: true, expire: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) };
                saveMember(); msg = '已为你开通 7 天会员体验';
            } else { state.points += 10; savePoints(); msg = '已是会员，赠送积分 +10'; }
        } else if (p.group) {
            if (claimGroup(p.group)) { const g = GROUP_BY_ID.get(p.group); msg = '已领取团购券：' + (g ? g.title : '品牌套餐'); }
            else msg = '该团购券已领取过啦';
        } else if (p.points) {
            state.points += p.points; savePoints(); msg = '恭喜获得积分 +' + p.points;
        } else if (p.again) {
            state.freeDraws += 1; saveDraws(); msg = '好运加持，免费再抽一次！';
        } else { msg = '谢谢参与，下次好运~'; }
        saveDraws();
        openSheet(title, '<div style="text-align:center;padding:8px 4px;line-height:1.7">' + esc(msg) + '</div>',
            (ev, close) => { close(); renderApp(); });
    }
