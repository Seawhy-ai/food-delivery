<style>
    :root {
        --brand: #ff6b6b;
        --brand-hover: #ff5252;
        --bg: #f4f4f6;
        --surface: #ffffff;
        --surface-2: #f8f8fa;
        --border: #ececef;
        --text: #2f3033;
        --text-2: #6b6d75;
        --text-3: #9a9ca4;
        --shadow: 0 1px 2px rgba(20, 20, 30, .06), 0 4px 14px rgba(20, 20, 30, .06);
        --shadow-lg: 0 8px 30px rgba(20, 20, 30, .16);
    }
    body.dark {
        --bg: #141518;
        --surface: #1e2024;
        --surface-2: #26282d;
        --border: #34373d;
        --text: #f2f3f5;
        --text-2: #b4b7be;
        --text-3: #82868f;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
        --shadow-lg: 0 8px 30px rgba(0, 0, 0, .55);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        transition: background .3s, color .3s;
        -webkit-font-smoothing: antialiased;
    }
    body.modal-open { overflow: hidden; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0;
        margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    button:focus-visible, .restaurant-card:focus-visible, input:focus-visible {
        outline: 2px solid var(--brand); outline-offset: 2px;
    }

    /* ---------- header ---------- */
    header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky; top: 0; z-index: 100;
        box-shadow: var(--shadow);
    }
    .header-content {
        display: flex; align-items: center; gap: 16px;
        padding-top: 14px; padding-bottom: 14px; flex-wrap: wrap;
    }
    .logo { font-size: 22px; font-weight: 700; color: var(--brand); white-space: nowrap; }
    .search-box { display: flex; gap: 8px; flex: 1 1 280px; min-width: 200px; }
    .search-box input {
        flex: 1; min-width: 0; padding: 9px 12px;
        border: 1px solid var(--border); border-radius: 8px;
        background: var(--surface-2); color: var(--text);
        transition: border-color .2s, background .2s;
    }
    .search-box input::placeholder { color: var(--text-3); }
    .search-box input:focus { border-color: var(--brand); background: var(--surface); }
    .controls { display: flex; gap: 10px; margin-left: auto; }

    .btn-primary, .btn-secondary, .btn-ghost {
        padding: 9px 16px; border-radius: 8px; font-size: 14px;
        transition: background .2s, color .2s, transform .2s, border-color .2s;
    }
    .btn-primary { background: var(--brand); color: #fff; font-weight: 600; }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--brand); color: var(--brand); }
    .btn-ghost { color: var(--text-2); padding: 9px 12px; border-radius: 8px; }
    .btn-ghost:hover { color: var(--brand); background: var(--surface-2); }
    .btn-primary:active, .btn-secondary:active, .btn-view:active { transform: scale(.97); }

    /* ---------- layout ---------- */
    main {
        display: grid; grid-template-columns: 200px 1fr;
        gap: 24px; margin: 24px auto;
    }
    .sidebar {
        background: var(--surface); border-radius: 12px;
        padding: 18px; height: fit-content;
        box-shadow: var(--shadow); position: sticky; top: 90px;
    }
    .sidebar h2 {
        font-size: 12px; font-weight: 600; letter-spacing: .06em;
        text-transform: uppercase; color: var(--text-3); margin-bottom: 10px;
    }
    .filter-item {
        display: block; width: 100%; text-align: left;
        padding: 9px 12px; font-size: 14px; border-radius: 8px;
        color: var(--text-2); transition: background .2s, color .2s;
    }
    .filter-item:hover { background: var(--surface-2); color: var(--text); }
    .filter-item.active { background: rgba(255, 107, 107, .12); color: var(--brand); font-weight: 600; }

    .result-summary { font-size: 13px; color: var(--text-3); margin-bottom: 14px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }

    /* ---------- restaurant card ---------- */
    .restaurant-card {
        background: var(--surface); border-radius: 12px; overflow: hidden;
        box-shadow: var(--shadow); cursor: pointer;
        transition: transform .2s, box-shadow .2s;
        display: flex; flex-direction: column;
    }
    .restaurant-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .restaurant-image {
        height: 150px; display: flex; align-items: center; justify-content: center;
        font-size: 52px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        user-select: none;
    }
    .restaurant-info { padding: 16px; display: flex; flex-direction: column; flex: 1; gap: 8px; }
    .restaurant-name { font-size: 16px; font-weight: 700; }
    .restaurant-meta {
        display: flex; flex-wrap: wrap; gap: 10px;
        font-size: 12px; color: var(--text-3);
    }
    .restaurant-meta .rating { color: var(--brand); font-weight: 600; }
    .restaurant-desc {
        font-size: 13px; color: var(--text-2);
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .match-hint {
        font-size: 12px; color: var(--brand);
        background: rgba(255, 107, 107, .1);
        padding: 6px 10px; border-radius: 6px;
    }
    .btn-view {
        margin-top: auto; width: 100%; padding: 9px;
        background: var(--brand); color: #fff; border-radius: 8px;
        font-size: 14px; font-weight: 600;
    }
    .btn-view:hover { background: var(--brand-hover); }

    .empty-state {
        grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-3);
    }
    .empty-state .icon { font-size: 44px; margin-bottom: 12px; }

    /* ---------- modal ---------- */
    .modal {
        position: fixed; inset: 0; background: rgba(15, 15, 20, .55);
        z-index: 1000; display: flex; align-items: center; justify-content: center;
        padding: 20px;
        opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s;
    }
    .modal.show { opacity: 1; visibility: visible; }
    .modal-content {
        background: var(--surface); border-radius: 14px; width: 100%; max-width: 620px;
        max-height: 85vh; overflow-y: auto; padding: 28px; position: relative;
        box-shadow: var(--shadow-lg);
        transform: translateY(12px) scale(.98); transition: transform .2s;
    }
    .modal.show .modal-content { transform: none; }
    .modal-close {
        position: absolute; top: 14px; right: 14px;
        width: 34px; height: 34px; border-radius: 50%;
        font-size: 18px; line-height: 1; color: var(--text-3);
        display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: var(--surface-2); color: var(--text); }
    .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 18px; padding-right: 40px; }
    .modal-subtitle { font-size: 13px; color: var(--text-3); margin: -12px 0 18px; }

    /* ---------- menu ---------- */
    .menu-items { display: flex; flex-direction: column; gap: 12px; }
    .menu-item {
        display: flex; align-items: center; gap: 14px;
        padding: 14px; border-radius: 10px;
        background: var(--surface-2); border: 1px solid var(--border);
        transition: border-color .2s;
    }
    .menu-item.selected { border-color: var(--brand); }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-weight: 600; font-size: 14px; }
    .item-price { color: var(--brand); font-weight: 700; font-size: 15px; margin-top: 2px; }
    .item-desc { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .item-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .qty-btn {
        width: 30px; height: 30px; border-radius: 8px; font-size: 16px;
        background: var(--brand); color: #fff; display: flex;
        align-items: center; justify-content: center;
    }
    .qty-btn:hover { background: var(--brand-hover); }
    .qty-btn[disabled] { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); cursor: not-allowed; }
    .qty-display { width: 30px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ---------- cart ---------- */
    .cart-section { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--border); }
    .cart-section h3 { font-size: 15px; margin-bottom: 12px; }
    .cart-group { margin-bottom: 16px; }
    .cart-group-title {
        font-size: 12px; font-weight: 600; color: var(--text-3);
        display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
    }
    .cart-item {
        display: flex; align-items: center; gap: 12px;
        padding: 9px 0; border-bottom: 1px dashed var(--border);

    }
    .cart-item:last-child { border-bottom: none; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name { font-weight: 500; }
    .cart-item-unit { font-size: 12px; color: var(--text-3); }
    .cart-item-price { color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; }
    .cart-item-remove { color: var(--text-3); font-size: 13px; padding: 4px 8px; border-radius: 6px; }
    .cart-item-remove:hover { color: var(--brand); background: var(--surface-2); }

    .cart-total {
        display: flex; justify-content: space-between; align-items: baseline;
        font-size: 16px; font-weight: 700; margin-top: 14px; padding-top: 14px;
        border-top: 2px solid var(--brand);
    }
    .cart-total .amount { color: var(--brand); font-size: 20px; font-variant-numeric: tabular-nums; }

    .checkout-actions { display: flex; gap: 10px; margin-top: 18px; }
    .checkout-actions button { flex: 1; padding: 12px; font-size: 15px; }
    .cart-toolbar { display: flex; justify-content: flex-end; margin-top: 8px; }

    .empty-cart { text-align: center; padding: 36px 20px; color: var(--text-3); }
    .empty-cart .icon { font-size: 42px; margin-bottom: 10px; }

    /* ---------- order success ---------- */
    .order-success { text-align: center; padding: 8px 0 4px; }
    .order-success .icon { font-size: 52px; margin-bottom: 14px; }
    .order-success .order-no {
        font-size: 18px; font-weight: 700; margin-bottom: 6px;

    }
    .order-success .meta { color: var(--text-3); font-size: 13px; margin-bottom: 18px; }
    .order-receipt {
        text-align: left; background: var(--surface-2); border: 1px solid var(--border);
        border-radius: 10px; padding: 16px; margin-bottom: 20px;
    }
    .order-receipt-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; color: var(--text-2); }
    .order-receipt-total {
        display: flex; justify-content: space-between; font-size: 15px; font-weight: 700;
        margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    }
    .order-receipt-total .amount { color: var(--brand); }

    footer {
        background: var(--surface); border-top: 1px solid var(--border);
        padding: 20px 0; margin-top: 40px; text-align: center;
        color: var(--text-3); font-size: 12px;
    }

    /* ---------- responsive ---------- */
    @media (max-width: 860px) {
        main { grid-template-columns: 1fr; gap: 16px; }
        .sidebar {

            align-items: center; gap: 8px; padding: 12px;
        }
        .sidebar h2 { width: 100%; margin-bottom: 0; }
        .filter-item { width: auto; padding: 7px 12px; border: 1px solid var(--border); }
    }
    @media (max-width: 600px) {
        .container { padding: 0 14px; }
        .header-content { padding-top: 10px; padding-bottom: 10px; gap: 10px; }
        .logo { font-size: 19px; }
        .search-box { order: 3; flex-basis: 100%; }
        .controls { margin-left: 0; gap: 8px; }
        .controls .btn-primary { padding: 9px 12px; font-size: 13px; }
        main { margin: 16px auto; }
        .grid { grid-template-columns: 1fr; gap: 14px; }
        .restaurant-image { height: 130px; }
        .modal { padding: 0; align-items: flex-end; }
        .modal-content {
            max-width: none; max-height: 92vh;
            border-radius: 16px 16px 0 0; padding: 22px 16px;
        }
        .checkout-actions { flex-direction: column-reverse; }
    }
</style>

            { id: 5, name: '加州卷 6P', price: 32, desc: '蟹肉、牛油果、黄瓜' },
            { id: 6, name: '握寿司套餐', price: 48, desc: '10 贯寿司+味噌汤' }
        ]},
        { id: 3, name: '汉堡快餐', rating: 4.6, distance: 0.9, sales: 4100, emoji: '🍔', desc: '新鲜汉堡，现点现做', menu: [
            { id: 7, name: '豪华牛肉汉堡', price: 28, desc: '100% 牛肉饼+新鲜蔬菜' },
            { id: 8, name: '炸鸡桶 3 块', price: 22, desc: '香脆炸鸡+薯条+饮料' },
            { id: 9, name: '鸡肉汉堡套餐', price: 25, desc: '汉堡+薯条+可乐' }
        ]},
        { id: 4, name: '面馆一绝', rating: 4.7, distance: 3.1, sales: 1800, emoji: '🍜', desc: '传统手工面，汤头秘制', menu: [
            { id: 10, name: '牛肉面', price: 18, desc: '嫩牛肉+特制汤底' },
            { id: 11, name: '番茄鸡蛋面', price: 15, desc: '清汤面+番茄蛋花' },
            { id: 12, name: '麻辣拌面套餐', price: 22, desc: '拌面+配菜+饮料' }
        ]},
        { id: 5, name: '烤肉部落', rating: 4.8, distance: 2.5, sales: 2900, emoji: '🍖', desc: '精选肉类，火焰烤制', menu: [
            { id: 13, name: '韩式烤肉套餐', price: 128, desc: '5 种肉类+小菜+米饭' },
            { id: 14, name: '羊肉串 10 串', price: 35, desc: '新鲜羊肉，现烤现吃' },
            { id: 15, name: '烤鸡腿套餐', price: 32, desc: '2 条烤鸡腿+薯条+饮料' }
        ]},
        { id: 6, name: '甜品工房', rating: 4.9, distance: 1.2, sales: 3600, emoji: '🍰', desc: '精致甜品，每日现烤', menu: [
            { id: 16, name: '提拉米苏', price: 15, desc: '意大利经典甜品' },
            { id: 17, name: '芒果千层蛋糕', price: 28, desc: '8 层芒果奶油蛋糕' },
            { id: 18, name: '咖啡甜品套餐', price: 38, desc: '甜品+咖啡+饮料' }
        ]}
    ];

    /* 菜品索引：itemId -> { item, restaurant } */
    const ITEM_INDEX = new Map();
    RESTAURANTS.forEach(function (r) {
        r.menu.forEach(function (item) {
            ITEM_INDEX.set(item.id, { item: item, restaurant: r });
        });
    });

    const CART_KEY = 'foodapp.cart';
    const THEME_KEY = 'foodapp.dark';

    /* ============================================================
     *  状态
     * ========================================================== */
    const state = {
        keyword: '',
        filter: 'all',
        currentRestaurant: null,
        cart: {},            // { [itemId]: qty }
        lastOrder: null
    };

    /* ============================================================
     *  工具
     * ========================================================== */
    const $ = function (id) { return document.getElementById(id); };

    const ESCAPE_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    function esc(v) { return String(v).replace(/[&<>"']/g, function (c) { return ESCAPE_MAP[c]; }); }

    function money(n) { return '¥' + Number(n).toFixed(2); }

    function store(key, value) {
        try {
            if (value === undefined) return window.localStorage.getItem(key);
            window.localStorage.setItem(key, value);
        } catch (e) { /* 隐私模式 / file:// 环境下静默降级 */ }
        return null;
    }

    /* ============================================================
     *  购物车
     * ========================================================== */
    function loadCart() {
        let raw = null;
        try { raw = JSON.parse(store(CART_KEY) || '{}'); } catch (e) { raw = {}; }
        if (!raw || typeof raw !== 'object') raw = {};

        const clean = {};
        Object.keys(raw).forEach(function (key) {
            const id = Number(key);
            const qty = Math.floor(Number(raw[key]));
            // 丢弃已下架菜品与非法数量，避免脏数据把 UI 带崩
            if (ITEM_INDEX.has(id) && qty > 0) clean[id] = qty;
        });
        state.cart = clean;
    }

    function saveCart() { store(CART_KEY, JSON.stringify(state.cart)); }

    function cartCount() {
        return Object.keys(state.cart).reduce(function (sum, id) { return sum + state.cart[id]; }, 0);
    }

    function cartTotal() {
        return Object.keys(state.cart).reduce(function (sum, id) {
            return sum + ITEM_INDEX.get(Number(id)).item.price * state.cart[id];
        }, 0);
    }

    function cartEntries() {
        return Object.keys(state.cart).map(function (id) {
            const entry = ITEM_INDEX.get(Number(id));
            return { item: entry.item, restaurant: entry.restaurant, qty: state.cart[id] };
        });
    }

    function addItem(id) {
        state.cart[id] = (state.cart[id] || 0) + 1;
        saveCart();
        syncCartUI();
    }

    function removeItem(id) {
        if (!state.cart[id]) return;
        state.cart[id] -= 1;
        if (state.cart[id] <= 0) delete state.cart[id];
        saveCart();
        syncCartUI();
    }

    function dropItem(id) {
        delete state.cart[id];
        saveCart();
        syncCartUI();
    }

    function clearCart() {
        state.cart = {};
        saveCart();
        syncCartUI();
    }

    /* ============================================================
     *  渲染：餐厅列表（搜索 + 筛选统一走这里，可叠加）
     * ========================================================== */
    function visibleRestaurants() {
        const kw = state.keyword.trim().toLowerCase();
        let list = RESTAURANTS.slice();

        if (kw) {
            list = list.filter(function (r) {
                return r.name.toLowerCase().indexOf(kw) !== -1 ||
                       r.desc.toLowerCase().indexOf(kw) !== -1 ||
                       r.menu.some(function (m) {
                           return m.name.toLowerCase().indexOf(kw) !== -1 ||
                                  m.desc.toLowerCase().indexOf(kw) !== -1;
                       });
            });
        }

        if (state.filter === 'rating')   list.sort(function (a, b) { return b.rating - a.rating; });
        if (state.filter === 'distance') list.sort(function (a, b) { return a.distance - b.distance; });
        if (state.filter === 'sales')    list.sort(function (a, b) { return b.sales - a.sales; });

        return list;
    }

    function matchedDishes(r, kw) {
        if (!kw) return [];
        return r.menu.filter(function (m) {
            return m.name.toLowerCase().indexOf(kw) !== -1 ||
                   m.desc.toLowerCase().indexOf(kw) !== -1;
        });
    }

    function cardHTML(r, kw) {
        const matched = matchedDishes(r, kw);
        return '' +
            '<article class="restaurant-card" data-restaurant="' + r.id + '" tabindex="0" role="button" ' +
                'aria-label="查看 ' + esc(r.name) + '">' +
                '<div class="restaurant-image" aria-hidden="true">' + r.emoji + '</div>' +
                '<div class="restaurant-info">' +
                    '<h3 class="restaurant-name">' + esc(r.name) + '</h3>' +
                    '<div class="restaurant-meta">' +
                        '<span class="rating">⭐ ' + r.rating.toFixed(1) + '</span>' +
                        '<span>📍 ' + r.distance + 'km</span>' +
                        '<span>🔥 ' + r.sales + '</span>' +
                    '</div>' +
                    '<p class="restaurant-desc">' + esc(r.desc) + '</p>' +
                    (matched.length
                        ? '<p class="match-hint">匹配菜品：' + esc(matched.map(function (m) { return m.name; }).join('、')) + '</p>'
                        : '') +
                    '<button type="button" class="btn-view" tabindex="-1">进入餐厅</button>' +
                '</div>' +
            '</article>';
    }

    function renderGrid() {
        const kw = state.keyword.trim().toLowerCase();
        const list = visibleRestaurants();
        const grid = $('restaurantGrid');

        if (!list.length) {
            grid.innerHTML = '<div class="empty-state"><div class="icon" aria-hidden="true">🔍</div>' +
                '<p>没有找到匹配的餐厅或菜品</p></div>';
            $('resultSummary').textContent = '';
            return;
        }

        grid.innerHTML = list.map(function (r) { return cardHTML(r, kw); }).join('');

        const parts = ['共 ' + list.length + ' 家餐厅'];
        if (kw) parts.push('关键词「' + state.keyword.trim() + '」');
        const filterLabels = { rating: '按评分排序', distance: '按距离排序', sales: '按销量排序' };
        if (filterLabels[state.filter]) parts.push(filterLabels[state.filter]);
        $('resultSummary').textContent = parts.join(' · ');
    }

    /* ============================================================
     *  渲染：餐厅详情
     * ========================================================== */
    function menuItemHTML(m) {
        const qty = state.cart[m.id] || 0;
        return '' +
            '<div class="menu-item' + (qty > 0 ? ' selected' : '') + '" data-row="' + m.id + '">' +
                '<div class="item-info">' +
                    '<div class="item-name">' + esc(m.name) + '</div>' +
                    '<div class="item-price">' + money(m.price) + '</div>' +
                    '<div class="item-desc">' + esc(m.desc) + '</div>' +
                '</div>' +
                '<div class="item-controls">' +
                    '<button type="button" class="qty-btn" data-action="remove" data-id="' + m.id + '" ' +
                        'aria-label="减少 ' + esc(m.name) + '"' + (qty === 0 ? ' disabled' : '') + '>−</button>' +
                    '<span class="qty-display" data-qty="' + m.id + '" aria-live="polite">' + qty + '</span>' +
                    '<button type="button" class="qty-btn" data-action="add" data-id="' + m.id + '" ' +
                        'aria-label="增加 ' + esc(m.name) + '">+</button>' +
                '</div>' +
            '</div>';
    }

    function openRestaurant(id) {
        const r = RESTAURANTS.filter(function (x) { return x.id === id; })[0];
        if (!r) return;

        state.currentRestaurant = r;
        $('modalRestaurantName').textContent = r.name;
        $('modalRestaurantMeta').textContent =
            '⭐ ' + r.rating.toFixed(1) + ' · 📍 ' + r.distance + 'km · 🔥 ' + r.sales + ' 单 · ' + r.desc;
        $('menuContainer').innerHTML = r.menu.map(menuItemHTML).join('');

        syncMenuRows();
        renderRestaurantCart();
        openModal('restaurantModal');
        document.querySelector('#restaurantModal .modal-content').scrollTop = 0;
    }

    /* 只更新数量与选中态，避免整块重绘导致焦点/滚动位置丢失 */
    function syncMenuRows() {
        document.querySelectorAll('[data-row]').forEach(function (row) {
            const id = Number(row.dataset.row);
            const qty = state.cart[id] || 0;
            row.classList.toggle('selected', qty > 0);
            const display = row.querySelector('[data-qty]');
            if (display) display.textContent = qty;
            const minus = row.querySelector('[data-action="remove"]');
            if (minus) minus.disabled = qty === 0;
        });
    }

    function renderRestaurantCart() {
        const r = state.currentRestaurant;
        if (!r) return;

        const rows = r.menu.filter(function (m) { return state.cart[m.id]; });
        const preview = $('restaurantCartPreview');

        if (!rows.length) {
            preview.innerHTML = '<div class="empty-cart"><p>还没有选择菜品</p></div>';
            $('restaurantCartTotal').textContent = money(0);
            return;
        }

        let subtotal = 0;
        preview.innerHTML = rows.map(function (m) {
            const amount = m.price * state.cart[m.id];
            subtotal += amount;
            return '' +
                '<div class="cart-item">' +
                    '<div class="cart-item-info">' +
                        '<div class="cart-item-name">' + esc(m.name) + '</div>' +
                        '<div class="cart-item-unit">' + money(m.price) + ' × ' + state.cart[m.id] + '</div>' +
                    '</div>' +
                    '<div class="cart-item-price">' + money(amount) + '</div>' +
                '</div>';
        }).join('');
        $('restaurantCartTotal').textContent = money(subtotal);
    }

    /* ============================================================
     *  渲染：购物车弹窗（按餐厅分组）
     * ========================================================== */
    function renderCartModal() {
        const entries = cartEntries();
        const view = $('fullCartView');

        if (!entries.length) {
            view.innerHTML = '' +
                '<div class="empty-cart">' +
                    '<div class="icon" aria-hidden="true">🛒</div>' +
                    '<p>购物车还是空的</p>' +
                '</div>' +
                '<div class="checkout-actions">' +
                    '<button type="button" class="btn-primary" data-action="close-cart">去逛逛</button>' +
                '</div>';
            return;
        }

        const groups = [];
        const groupIndex = new Map();
        entries.forEach(function (entry) {
            if (!groupIndex.has(entry.restaurant.id)) {
                groupIndex.set(entry.restaurant.id, groups.length);
                groups.push({ restaurant: entry.restaurant, rows: [] });
            }
            groups[groupIndex.get(entry.restaurant.id)].rows.push(entry);
        });

        const groupsHTML = groups.map(function (group) {
            const rows = group.rows.map(function (entry) {
                return '' +
                    '<div class="cart-item">' +
                        '<div class="cart-item-info">' +
                            '<div class="cart-item-name">' + esc(entry.item.name) + '</div>' +
                            '<div class="cart-item-unit">' + money(entry.item.price) + ' × ' + entry.qty + '</div>' +
                        '</div>' +
                        '<div class="cart-item-price">' + money(entry.item.price * entry.qty) + '</div>' +
                        '<button type="button" class="cart-item-remove" data-action="drop" ' +
                            'data-id="' + entry.item.id + '" aria-label="移除 ' + esc(entry.item.name) + '">移除</button>' +
                    '</div>';
            }).join('');

            return '' +
                '<div class="cart-group">' +
                    '<div class="cart-group-title">' + group.restaurant.emoji + ' ' + esc(group.restaurant.name) + '</div>' +
                    rows +
                '</div>';
        }).join('');

        view.innerHTML = '' +
            groupsHTML +
            '<div class="cart-total"><span>合计</span><span class="amount">' + money(cartTotal()) + '</span></div>' +
            '<div class="cart-toolbar">' +
                '<button type="button" class="btn-ghost" data-action="clear-cart">清空购物车</button>' +
            '</div>' +
            '<div class="checkout-actions">' +
                '<button type="button" class="btn-secondary" data-action="close-cart">继续购物</button>' +
                '<button type="button" class="btn-primary" data-action="checkout">去结算</button>' +
            '</div>';
    }

    /* ============================================================
     *  同步所有购物车相关 UI
     * ========================================================== */
    function syncCartUI() {
        $('cartCount').textContent = cartCount();
        syncMenuRows();
        renderRestaurantCart();
        if ($('cartModal').classList.contains('show')) renderCartModal();
    }

    /* ============================================================
     *  弹窗
     * ========================================================== */
    function openModal(id) {
        $(id).classList.add('show');
        syncScrollLock();
    }
    function closeModal(id) {
        $(id).classList.remove('show');
        syncScrollLock();
    }
    function closeAllModals() {
        ['restaurantModal', 'cartModal', 'orderModal'].forEach(function (id) {
            $(id).classList.remove('show');
        });
        syncScrollLock();
    }
    function syncScrollLock() {
        const anyOpen = document.querySelector('.modal.show') !== null;
        document.body.classList.toggle('modal-open', anyOpen);
    }

    /* ============================================================
     *  结算
     * ========================================================== */
    function checkout() {
        const entries = cartEntries();
        if (!entries.length) return;

        const total = cartTotal();
        const orderNumber = 'FD' + Date.now().toString().slice(-10);

        state.lastOrder = { number: orderNumber, total: total, entries: entries };

        $('orderNumber').textContent = orderNumber;
        $('orderReceipt').innerHTML =
            state.lastOrder.entries.map(function (entry) {
                return '<div class="order-receipt-row">' +
                    '<span>' + esc(entry.item.name) + ' × ' + entry.qty + '</span>' +
                    '<span>' + money(entry.item.price * entry.qty) + '</span>' +
                '</div>';
            }).join('') +
            '<div class="order-receipt-total"><span>实付</span><span class="amount">' + money(total) + '</span></div>';

        closeModal('restaurantModal');
        closeModal('cartModal');
        clearCart();

        openModal('orderModal');
    }

    /* ============================================================
     *  主题（启动时立即生效，不依赖 DOMContentLoaded 时序）
     * ========================================================== */
    function applyTheme(dark) {
        document.body.classList.toggle('dark', dark);
        const toggle = $('themeToggle');
        if (toggle) toggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
        store(THEME_KEY, dark ? '1' : '0');
    }

    function initTheme() {
        const saved = store(THEME_KEY);
        let dark;
        if (saved === '0' || saved === '1') {
            dark = saved === '1';
        } else {
            dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        }
        applyTheme(dark);
    }

    /* ============================================================
     *  事件（统一委托，无内联 onclick，无字符串拼接注入面）
     * ========================================================== */
    const ACTIONS = {
        'search': function () { doSearch(); },
        'filter': function (el) {
            state.filter = el.dataset.filter;
            document.querySelectorAll('[data-action="filter"]').forEach(function (b) {
                b.classList.toggle('active', b === el);
            });
            renderGrid();
        },
        'toggle-theme': function () {
            applyTheme(!document.body.classList.contains('dark'));
        },
        'open-cart': function () { renderCartModal(); openModal('cartModal'); },
        'close-cart': function () { closeModal('cartModal'); },
        'close-restaurant': function () { closeModal('restaurantModal'); },
        'add': function (el) { addItem(Number(el.dataset.id)); },
        'remove': function (el) { removeItem(Number(el.dataset.id)); },
        'drop': function (el) { dropItem(Number(el.dataset.id)); },
        'clear-cart': function () {
            if (window.confirm('确定清空购物车吗？')) clearCart();
        },
        'checkout': function () { checkout(); },
        'close-order': function () { closeModal('orderModal'); },
        'back-home': function () {
            closeModal('orderModal');
            state.keyword = '';
            $('searchInput').value = '';
            renderGrid();
        }
    };

    function doSearch() {
        state.keyword = $('searchInput').value;
        renderGrid();
    }

    document.addEventListener('click', function (e) {
        const actionEl = e.target.closest('[data-action]');
        if (actionEl) {
            const handler = ACTIONS[actionEl.dataset.action];
            if (handler) { handler(actionEl); return; }
        }

        // 卡片内按钮已单独处理，避免重复触发
        if (e.target.closest('button')) return;
        const card = e.target.closest('[data-restaurant]');
        if (card) openRestaurant(Number(card.dataset.restaurant));
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { closeAllModals(); return; }

        if (e.key === 'Enter' && document.activeElement === $('searchInput')) {
            e.preventDefault();
            doSearch();
            return;
        }

        // 卡片键盘可达
        const card = e.target.closest ? e.target.closest('[data-restaurant]') : null;
        if (card && e.target === card && (e.key === 'Enter' || e.key === ' ')) {
            e.preventDefault();
            openRestaurant(Number(card.dataset.restaurant));
        }
    });

    // 输入即搜（200ms 防抖）
    let searchTimer = null;
    $('searchInput').addEventListener('input', function (e) {
        const value = e.target.value;
        window.clearTimeout(searchTimer);
        searchTimer = window.setTimeout(function () {
            state.keyword = value;
            renderGrid();
        }, 200);
    });

    // 点击遮罩关闭（仅当点击的是遮罩本身）
    ['restaurantModal', 'cartModal', 'orderModal'].forEach(function (id) {
        $(id).addEventListener('mousedown', function (e) {
            if (e.target === this) closeModal(id);
        });
    });

    /* ============================================================
     *  启动
     * ========================================================== */
    initTheme();
    loadCart();
    $('year').textContent = new Date().getFullYear();
    syncCartUI();
    renderGrid();
})();
</script>
</body>
</html>
