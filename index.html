<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFD100">
<meta name="description" content="袋鼠外卖 · 美团风格外卖点餐演示（单文件版）">
<title>袋鼠外卖 - 美食外卖，送啥都快</title>
<style>
/* ==========================================================================
   设计令牌 —— 对齐美团品牌视觉
   主色 美团黄 #FFD100 / 近黑 #111111 / 强调红 #E60012 / 浅黄 #FFF3B0
   ========================================================================== */
:root {
    --mt-yellow: #FFD100;
    --mt-yellow-deep: #FFC300;
    --mt-yellow-soft: #FFF3B0;
    --mt-yellow-bg: #FFFBE6;
    --mt-yellow-grad: linear-gradient(135deg, #FFE259 0%, #FFD100 55%, #FFC300 100%);

    --mt-black: #111111;
    --mt-red: #E60012;
    --mt-red-soft: #FFEDED;
    --mt-orange: #FF6B00;
    --mt-blue: #2B7FFF;

    --mt-bg: #F4F4F4;
    --mt-surface: #FFFFFF;
    --mt-surface-2: #F7F7F7;
    --mt-border: #EEEEEE;
    --mt-line: #F2F2F2;

    --mt-text: #1A1A1A;
    --mt-text-2: #6B6B70;
    --mt-text-3: #A0A0A6;

    --mt-shadow-sm: 0 1px 3px rgba(0, 0, 0, .06);
    --mt-shadow: 0 2px 10px rgba(0, 0, 0, .07);
    --mt-radius: 12px;
    --mt-radius-lg: 16px;

    --tab-h: 52px;
    --safe-b: env(safe-area-inset-bottom, 0px);
}
body.dark {
    --mt-bg: #121212;
    --mt-surface: #1C1C1E;
    --mt-surface-2: #262628;
    --mt-border: #2C2C2E;
    --mt-line: #262628;

    --mt-text: #F2F2F2;
    --mt-text-2: #A5A5AB;
    --mt-text-3: #75757B;

    --mt-yellow-bg: #2B2600;
    --mt-red-soft: #3A1A1C;

    --mt-shadow-sm: 0 1px 3px rgba(0, 0, 0, .5);
    --mt-shadow: 0 2px 10px rgba(0, 0, 0, .45);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, sans-serif;
    background: var(--mt-bg);
    color: var(--mt-text);
    font-size: 14px;
    line-height: 1.45;
    transition: background .25s, color .25s;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
}
body.locked { overflow: hidden; }

button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mt-yellow-deep); outline-offset: 2px; }
body.dark :focus-visible { outline-color: var(--mt-yellow); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--mt-bg); position: relative; box-shadow: 0 0 40px rgba(0, 0, 0, .06); }
body.dark .app { box-shadow: 0 0 40px rgba(0, 0, 0, .5); }

.page { padding-bottom: calc(var(--tab-h) + var(--safe-b) + 12px); min-height: 100vh; }

/* ============================ 顶部：定位 + 搜索 ============================ */
/* 顶部黄色渐变区随页面滚走，排序条吸附在顶端（避免两者都 sticky 时互相覆盖） */
.hero { background: var(--mt-yellow-grad); padding: 12px 14px 20px; position: relative; z-index: 40; }
.hero-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.loc { display: flex; align-items: center; gap: 4px; max-width: 52%; font-weight: 700; color: var(--mt-black); }
.loc .pin { font-size: 15px; flex-shrink: 0; }
.loc-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
.loc .caret { font-size: 10px; opacity: .55; flex-shrink: 0; }
.hero-row .spacer { flex: 1; }
.icon-btn { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; color: var(--mt-black); transition: background .2s; }
.icon-btn:hover { background: rgba(0, 0, 0, .08); }
.badge-dot { position: relative; }
.badge-dot::after { content: ''; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--mt-red); border: 1.5px solid var(--mt-yellow); }

.search-bar { display: flex; align-items: center; gap: 8px; width: 100%; background: #fff; border-radius: 999px; padding: 9px 14px; box-shadow: 0 2px 6px rgba(0, 0, 0, .08); color: var(--mt-text-3); text-align: left; }
.search-bar .ico { font-size: 15px; }
.search-bar .ph { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.search-bar .cta { background: var(--mt-black); color: var(--mt-yellow); font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 999px; flex-shrink: 0; }

/* ============================ 金刚区 ============================ */
.kingkong { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px 0; padding: 14px 6px 6px; }
.kk-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0; border-radius: 10px; transition: background .2s; }
.kk-item:hover { background: var(--mt-surface-2); }
.kk-ico { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 23px; background: var(--mt-yellow-bg); box-shadow: var(--mt-shadow-sm); }
.kk-name { font-size: 11.5px; color: var(--mt-text-2); white-space: nowrap; }
.kk-item.on .kk-ico { box-shadow: 0 0 0 2px var(--mt-yellow-deep), var(--mt-shadow-sm); }
.kk-item.on .kk-name { color: var(--mt-yellow-deep); font-weight: 700; }

/* ============================ 瓷片区 ============================ */
.tiles { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 4px 12px 14px; }
.tile { background: var(--mt-surface); border-radius: var(--mt-radius); padding: 10px 8px; box-shadow: var(--mt-shadow-sm); display: flex; flex-direction: column; gap: 2px; overflow: hidden; position: relative; text-align: left; }
.tile.hot { background: linear-gradient(135deg, #FFF0F0, #FFE0E0); }
body.dark .tile.hot { background: linear-gradient(135deg, #33191B, #2A1416); }
.tile-title { font-size: 12.5px; font-weight: 700; color: var(--mt-text); }
.tile-sub { font-size: 11px; color: var(--mt-red); font-weight: 600; }
.tile-emoji { position: absolute; right: -4px; bottom: -6px; font-size: 30px; opacity: .28; }

/* ============================ 排序条 ============================ */
.sortbar { display: flex; align-items: center; gap: 4px; background: var(--mt-surface); padding: 10px 12px; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--mt-line); }
.sort-item { padding: 5px 10px; border-radius: 999px; font-size: 13px; color: var(--mt-text-2); white-space: nowrap; transition: all .18s; }
.sort-item.on { background: var(--mt-yellow-soft); color: var(--mt-black); font-weight: 700; }
body.dark .sort-item.on { background: #3D3600; color: var(--mt-yellow); }

/* ============================ 商家卡片 ============================ */
.shop-list { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.shop-card { background: var(--mt-surface); border-radius: var(--mt-radius); padding: 12px; display: flex; gap: 12px; width: 100%; text-align: left; box-shadow: var(--mt-shadow-sm); transition: transform .18s; }
.shop-card:active { transform: scale(.985); }
.shop-thumb { width: 74px; height: 74px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 36px; background: linear-gradient(135deg, #FFF6CC, #FFE98A); }
body.dark .shop-thumb { background: linear-gradient(135deg, #3A3400, #2A2600); }
.shop-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.shop-name { font-size: 15.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shop-stats { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--mt-text-3); flex-wrap: wrap; }
.stars { color: var(--mt-orange); font-weight: 700; }
.stars .num { color: var(--mt-text); }
.shop-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag { font-size: 10.5px; padding: 1px 5px; border-radius: 3px; line-height: 1.5; border: 1px solid currentColor; color: var(--mt-text-3); }
.tag.red { color: var(--mt-red); background: var(--mt-red-soft); border-color: transparent; }
.tag.yellow { color: #8A6A00; background: var(--mt-yellow-soft); border-color: transparent; }
body.dark .tag.yellow { color: var(--mt-yellow); background: #3A3200; }
.shop-promo { display: flex; align-items: flex-start; gap: 5px; font-size: 11.5px; }
.shop-promo .lbl { color: var(--mt-red); background: var(--mt-red-soft); border-radius: 3px; padding: 1px 4px; flex-shrink: 0; font-weight: 600; }
.shop-promo .txt { color: var(--mt-red); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shop-foot { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--mt-text-3); margin-top: 1px; flex-wrap: wrap; }
.shop-foot .deliver { color: var(--mt-text-2); }
.distance-col { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; flex-shrink: 0; font-size: 11px; color: var(--mt-text-3); }

.empty { text-align: center; padding: 60px 24px; color: var(--mt-text-3); }
.empty .ico { font-size: 46px; margin-bottom: 12px; opacity: .8; }
.empty .title { font-size: 15px; color: var(--mt-text-2); margin-bottom: 4px; font-weight: 600; }
.empty .sub { font-size: 12.5px; }

/* ============================ 底部 Tab ============================ */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: calc(var(--tab-h) + var(--safe-b)); padding-bottom: var(--safe-b); background: var(--mt-surface); border-top: 1px solid var(--mt-line); display: flex; z-index: 70; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10.5px; color: var(--mt-text-3); transition: color .18s; }
.tab .ico { font-size: 20px; line-height: 1; filter: grayscale(1); opacity: .55; transition: all .18s; }
.tab.on { color: var(--mt-black); font-weight: 700; }
.tab.on .ico { filter: none; opacity: 1; }
body.dark .tab.on { color: var(--mt-yellow); }

/* ============================ 子页头部 ============================ */
.subheader { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--mt-surface); position: sticky; top: 0; z-index: 60; border-bottom: 1px solid var(--mt-line); }
.subheader .back { font-size: 19px; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.subheader .back:hover { background: var(--mt-surface-2); }
.subheader h1 { font-size: 16.5px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 页面内还有第二条吸附条（如订单页的状态筛选）时，让标题随页面滚走 */
.subheader.plain { position: static; }

/* ============================ 搜索页 ============================ */
.search-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--mt-yellow-grad); position: sticky; top: 0; z-index: 60; }
.search-field { flex: 1; display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 999px; padding: 8px 12px; }
.search-field input { flex: 1; border: none; outline: none; background: none; font-size: 14px; min-width: 0; }
.search-field .clr { color: var(--mt-text-3); font-size: 15px; }
.search-go { font-size: 14px; font-weight: 700; color: var(--mt-black); padding: 4px 2px; }

.block { padding: 16px 14px 4px; }
.block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.block-head h2 { font-size: 14px; font-weight: 700; }
.block-head .more { font-size: 12px; color: var(--mt-text-3); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 13px; border-radius: 999px; font-size: 13px; background: var(--mt-surface); color: var(--mt-text-2); box-shadow: var(--mt-shadow-sm); }
.chip.hot { color: var(--mt-red); }
.match-box { padding: 0 12px 12px; }
.match-box .inner { background: var(--mt-yellow-bg); padding: 8px 10px; border-radius: 8px; font-size: 11.5px; display: flex; gap: 6px; }
.match-box .k { color: var(--mt-yellow-deep); font-weight: 700; flex-shrink: 0; }
.match-box .v { color: var(--mt-text-2); overflow: hidden; }
.wrap-card { background: var(--mt-surface); border-radius: 12px; box-shadow: var(--mt-shadow-sm); }
.wrap-card .shop-card { box-shadow: none; background: transparent; }

/* ============================ 商家页 ============================ */
.shop-page { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: var(--mt-surface); display: flex; flex-direction: column; z-index: 80; }
.shop-hero { background: var(--mt-yellow-grad); padding: 10px 14px 16px; flex-shrink: 0; }
.shop-hero-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.shop-hero-top .back { font-size: 19px; color: var(--mt-black); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.shop-hero-top .back:hover { background: rgba(0, 0, 0, .08); }
.shop-hero-top .ttl { flex: 1; font-weight: 700; color: var(--mt-black); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shop-brief { display: flex; gap: 12px; }
.shop-brief .thumb { width: 64px; height: 64px; border-radius: 12px; background: rgba(255, 255, 255, .75); display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; }
.shop-brief .info { flex: 1; min-width: 0; color: var(--mt-black); }
.shop-brief .info h2 { font-size: 16px; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shop-brief .info .meta { font-size: 11.5px; opacity: .72; display: flex; gap: 9px; flex-wrap: wrap; }
.shop-brief .info .promo { font-size: 11.5px; margin-top: 4px; display: flex; gap: 5px; align-items: flex-start; }
.shop-brief .info .promo .k { background: var(--mt-red); color: #fff; border-radius: 3px; padding: 0 4px; flex-shrink: 0; font-weight: 600; }
.shop-brief .info .promo .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.shop-body { flex: 1; display: flex; overflow: hidden; position: relative; }
.dish-cats { width: 88px; flex-shrink: 0; background: var(--mt-surface-2); overflow-y: auto; }
.dish-cat { width: 100%; padding: 15px 6px; font-size: 13px; color: var(--mt-text-2); text-align: center; position: relative; transition: background .18s; }
.dish-cat.on { background: var(--mt-surface); color: var(--mt-text); font-weight: 700; }
.dish-cat.on::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 16px; background: var(--mt-yellow); border-radius: 0 3px 3px 0; }
.dish-cat .dot { position: absolute; top: 8px; right: 8px; min-width: 15px; height: 15px; border-radius: 999px; background: var(--mt-red); color: #fff; font-size: 10px; line-height: 15px; padding: 0 4px; font-weight: 700; }

.dish-list { flex: 1; overflow-y: auto; position: relative; padding-bottom: 90px; }
.dish-section-title { padding: 12px 12px 6px; font-size: 12.5px; font-weight: 700; color: var(--mt-text-2); background: var(--mt-surface); }
.dish { display: flex; gap: 10px; padding: 12px; border-bottom: 1px solid var(--mt-line); }
.dish-thumb { width: 66px; height: 66px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; background: linear-gradient(135deg, #FFF7D6, #FFEBA0); }
body.dark .dish-thumb { background: linear-gradient(135deg, #332D00, #262100); }
.dish-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dish-name { font-size: 14.5px; font-weight: 600; margin-bottom: 2px; }
.dish-desc { font-size: 11.5px; color: var(--mt-text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dish-sales { font-size: 11px; color: var(--mt-text-3); margin-top: 3px; }
.dish-bottom { display: flex; align-items: flex-end; justify-content: space-between; margin-top: auto; padding-top: 6px; }
.price { color: var(--mt-red); font-weight: 700; font-size: 16px; display: flex; align-items: baseline; gap: 1px; }
.price .cur { font-size: 11px; }
.price .orig { color: var(--mt-text-3); font-size: 11px; text-decoration: line-through; font-weight: 400; margin-left: 4px; }

.stepper { display: flex; align-items: center; gap: 7px; }
.step-btn { width: 23px; height: 23px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
.step-add { background: var(--mt-yellow); color: var(--mt-black); }
.step-minus { border: 1px solid var(--mt-yellow-deep); color: var(--mt-yellow-deep); }
body.dark .step-minus { border-color: var(--mt-yellow); color: var(--mt-yellow); }
.step-qty { min-width: 16px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ============================ 底部购物车栏 ============================ */
.cartbar { position: absolute; left: 0; right: 0; bottom: 0; height: 54px; display: flex; align-items: center; padding: 0 12px 0 14px; gap: 10px; background: var(--mt-black); color: #fff; z-index: 20; }
.cartbar.empty-state { background: var(--mt-surface); color: var(--mt-text-3); border-top: 1px solid var(--mt-line); }
.cart-ico-wrap { position: relative; width: 46px; height: 46px; flex-shrink: 0; margin-top: -18px; }
.cart-ico { width: 46px; height: 46px; border-radius: 50%; background: #2C2C2E; display: flex; align-items: center; justify-content: center; font-size: 23px; border: 3px solid var(--mt-black); }
.cartbar.empty-state .cart-ico { background: var(--mt-surface-2); border-color: var(--mt-surface); }
.cart-ico.has { background: var(--mt-yellow); }
.cart-badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; border-radius: 999px; background: var(--mt-red); color: #fff; font-size: 11px; line-height: 18px; text-align: center; padding: 0 5px; font-weight: 700; border: 2px solid var(--mt-black); }
.cart-sum { flex: 1; min-width: 0; }
.cart-sum .amt { font-size: 17px; font-weight: 700; }
.cart-sum .hint { font-size: 11px; opacity: .7; }
.cartbar.empty-state .cart-sum .amt { color: var(--mt-text-3); }
.checkout-btn { background: #4A4A4D; color: #9A9A9E; padding: 9px 22px; border-radius: 999px; font-weight: 700; font-size: 14.5px; flex-shrink: 0; }
.checkout-btn.ready { background: var(--mt-yellow); color: var(--mt-black); }

.cart-drawer { position: absolute; left: 0; right: 0; bottom: 54px; max-height: 55%; background: var(--mt-surface); z-index: 19; display: flex; flex-direction: column; transform: translateY(110%); transition: transform .26s cubic-bezier(.32, .72, 0, 1); box-shadow: 0 -8px 24px rgba(0, 0, 0, .12); }
.cart-drawer.open { transform: translateY(0); }
.cart-drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--mt-line); font-size: 13px; color: var(--mt-text-2); }
.cart-drawer-head .clr { color: var(--mt-text-3); font-size: 12.5px; }
.cart-drawer-list { overflow-y: auto; padding: 4px 14px 10px; }
.cart-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--mt-line); }
.cart-row:last-child { border-bottom: none; }
.cart-row .nm { flex: 1; font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cart-row .pr { color: var(--mt-red); font-weight: 700; font-size: 14px; }
.cart-mask { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); z-index: 18; opacity: 0; visibility: hidden; transition: opacity .26s, visibility .26s; }
.cart-mask.open { opacity: 1; visibility: visible; }

/* ============================ 结算页 ============================ */
.card { background: var(--mt-surface); border-radius: var(--mt-radius); margin: 10px 12px; box-shadow: var(--mt-shadow-sm); overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; padding: 14px; border-bottom: 1px solid var(--mt-line); width: 100%; text-align: left; }
.row:last-child { border-bottom: none; }
.row .k { color: var(--mt-text-2); font-size: 13.5px; flex-shrink: 0; }
.row .v { flex: 1; text-align: right; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .caret { color: var(--mt-text-3); font-size: 12px; flex-shrink: 0; }
.row .val-red { color: var(--mt-red); font-weight: 700; }

.addr-line { display: flex; gap: 10px; align-items: flex-start; }
.addr-line .pin { font-size: 17px; }
.addr-line .txt { flex: 1; min-width: 0; }
.addr-line .nm { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.addr-line .nm .phone { color: var(--mt-text-2); font-weight: 400; font-size: 13px; }
.addr-line .detail { font-size: 12.5px; color: var(--mt-text-2); margin-top: 3px; line-height: 1.5; }

.bill-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 14px; font-size: 13px; color: var(--mt-text-2); }
.bill-row .amt { color: var(--mt-text); font-variant-numeric: tabular-nums; }
.bill-row.cut .amt { color: var(--mt-red); }

    function store(key, value) {
        try {
            if (value === undefined) return localStorage.getItem(key);
            if (value === null) { localStorage.removeItem(key); return null; }
            localStorage.setItem(key, value);
        } catch (e) { /* 隐私模式 / file:// 下静默降级 */ }
        return null;
    }
    function readJSON(key, fallback) {
        try {
            const v = JSON.parse(store(key));
            return v == null ? fallback : v;
        } catch (e) { return fallback; }
    }

                    '</div>' +
                '</div>';
            const close = result => { layer.remove(); syncLock(); resolve(result); };
            layer.addEventListener('click', e => {
                const btn = e.target.closest('[data-dlg]');
                if (!btn) { if (e.target === layer) close(false); return; }
                close(btn.dataset.dlg === 'ok');
            });
            $('#layerRoot').appendChild(layer);
            syncLock();
        });
    }

            }

        });
        $('#layerRoot').appendChild(layer);
        syncLock();

    function loadState() {
        const rawCart = readJSON('kd.cart', null);
        if (rawCart && typeof rawCart === 'object') {
            const items = {};
            Object.keys(rawCart.items || {}).forEach(k => {
                const id = Number(k);
                const qty = Math.floor(Number(rawCart.items[k]));
                if (DISH_INDEX.has(id) && qty > 0) items[id] = qty;
            });
            state.cart = { shopId: Object.keys(items).length ? rawCart.shopId : null, items: items };
        }

        const addrs = readJSON('kd.addresses', null);
        state.addresses = (Array.isArray(addrs) && addrs.length) ? addrs : DEFAULT_ADDRESSES.slice();
        if (!state.addresses.some(a => a.isDefault)) state.addresses[0].isDefault = true;

        const orders = readJSON('kd.orders', null);
        state.orders = (Array.isArray(orders) && orders.length) ? orders : SEED_ORDERS.slice();

        const hist = readJSON('kd.searchHistory', null);
        state.searchHistory = Array.isArray(hist) ? hist.slice(0, 10) : [];

        state.addressId = (state.addresses.find(a => a.isDefault) || state.addresses[0]).id;
    }
    const saveCart = () => store('kd.cart', JSON.stringify(state.cart));
    const saveAddresses = () => store('kd.addresses', JSON.stringify(state.addresses));

     * ==================================================================== */
    const cartShop = () => (state.cart.shopId ? SHOP_BY_ID.get(state.cart.shopId) : null);

    function cartLines() {
        return Object.keys(state.cart.items).map(id => {
            const entry = DISH_INDEX.get(Number(id));
            return { dish: entry.dish, qty: state.cart.items[id] };
        });
    }
    const cartCount = () => Object.keys(state.cart.items).reduce((s, id) => s + state.cart.items[id], 0);
    const cartSubtotal = () => cartLines().reduce((s, l) => s + l.dish.price * l.qty, 0);

    function discountFor(shop, subtotal) {
        if (!shop) return 0;
        let best = 0;
        shop.discounts.forEach(d => { if (subtotal >= d.threshold && d.cut > best) best = d.cut; });
        return best;
    }

    function bill(shop, lines, couponId) {
        const subtotal = lines.reduce((s, l) => s + l.dish.price * l.qty, 0);
        const qty = lines.reduce((s, l) => s + l.qty, 0);
        const packing = shop ? shop.packingFee * qty : 0;
        const delivery = shop ? shop.deliveryFee : 0;
        const discount = discountFor(shop, subtotal);
        const coupon = couponId ? COUPON_BY_ID.get(couponId) : null;
        const couponCut = (coupon && subtotal >= coupon.threshold) ? coupon.amount : 0;
        const total = Math.max(subtotal + packing + delivery - discount - couponCut, 0);
        return { subtotal: subtotal, qty: qty, packing: packing, delivery: delivery,
                 discount: discount, couponCut: couponCut, total: total };
    }

    function addDish(id) {
        const entry = DISH_INDEX.get(id);
        if (!entry) return;
        const shop = entry.shop;

        if (state.cart.shopId && state.cart.shopId !== shop.id && cartCount() > 0) {
            const other = SHOP_BY_ID.get(state.cart.shopId);
            confirmDialog({
                title: '更换商家',
                message: '购物车中已有「' + other.name + '」的商品，切换商家需要先清空购物车。',
                okText: '清空并添加'
            }).then(ok => {
                if (!ok) return;
                state.cart = { shopId: shop.id, items: {} };
                addDish(id);
            });
            return;
        }

        state.cart.shopId = shop.id;
        state.cart.items[id] = (state.cart.items[id] || 0) + 1;
        saveCart();
        refreshShopUI();
    }

    function minusDish(id) {
        if (!state.cart.items[id]) return;
        state.cart.items[id] -= 1;
        if (state.cart.items[id] <= 0) delete state.cart.items[id];
        if (!cartCount()) state.cart.shopId = null;
        saveCart();

    }

                '<input id="kw" type="search" placeholder="搜索商家或菜品" autocomplete="off" value="' + esc(kw) + '">' +
                (kw ? '<button type="button" class="clr" data-action="clear-kw" aria-label="清空">✕</button>' : '') +
            '</div>' +
            '<button type="button" class="search-go" data-action="do-search">搜索</button>' +
        '</div>';

        if (results === null) {
            return '<div class="page">' + head +
                '<div class="block"><div class="block-head"><h2>热门搜索</h2></div><div class="chips">' +
                    HOT_WORDS.map(w => '<button type="button" class="chip hot" data-action="use-word" data-word="' + esc(w) + '">' + esc(w) + '</button>').join('') +
                '</div></div>' +
                (state.searchHistory.length
                    ? '<div class="block"><div class="block-head"><h2>搜索历史</h2>' +
                        '<button type="button" class="more" data-action="clear-history">清空</button></div><div class="chips">' +
                        state.searchHistory.map(w => '<button type="button" class="chip" data-action="use-word" data-word="' + esc(w) + '">' + esc(w) + '</button>').join('') +
                      '</div></div>'
                    : '') +
                '<div class="block"><div class="block-head"><h2>猜你想吃</h2></div></div>' +
                '<div class="shop-list">' + SHOPS.slice(0, 3).map(shopCardHTML).join('') + '</div>' +
            '</div>';
        }

        if (!results.length) {
            return '<div class="page">' + head +
                '<div class="empty"><div class="ico" aria-hidden="true">🔍</div>' +
                    '<div class="title">没有找到「' + esc(kw) + '」</div>' +
                    '<div class="sub">换个关键词，或试试热门搜索</div></div>' +
                '<div class="block"><div class="chips">' +
                    HOT_WORDS.map(w => '<button type="button" class="chip hot" data-action="use-word" data-word="' + esc(w) + '">' + esc(w) + '</button>').join('') +
                '</div></div>' +
            '</div>';
        }

        return '<div class="page">' + head +
            '<div class="block"><div class="block-head"><h2>找到 ' + results.length + ' 家相关商家</h2></div></div>' +
            '<div class="shop-list">' + results.map(r =>
                '<div class="wrap-card">' + shopCardHTML(r.shop) +
                    (r.dishes.length
                        ? '<div class="match-box"><div class="inner"><span class="k">匹配菜品</span>' +

                        : '') +

            '</div>' +
        '</div>';
    }

    /* ======================================================================
     * 8. 商家页
     * ==================================================================== */

        const qty = state.cart.items[dish.id] || 0;
        return '<div class="dish" data-dish-row="' + dish.id + '">' +
            '<span class="dish-thumb" aria-hidden="true">' + dish.emoji + '</span>' +
            '<span class="dish-body">' +
                '<span class="dish-name">' + esc(dish.name) + '</span>' +
                '<span class="dish-desc">' + esc(dish.desc) + '</span>' +
                '<span class="dish-sales">月售 ' + dish.sales + '</span>' +
                '<span class="dish-bottom">' +
                    '<span class="price">' + priceHTML(dish.price) +
                        (dish.orig ? '<span class="orig">' + money(dish.orig) + '</span>' : '') + '</span>' +
                    '<span class="stepper">' +
                        (qty > 0
                            ? '<button type="button" class="step-btn step-minus" data-action="minus-dish" data-id="' + dish.id + '" aria-label="减少 ' + esc(dish.name) + '">−</button>' +
                              '<span class="step-qty" data-qty="' + dish.id + '" aria-live="polite">' + qty + '</span>'
                            : '') +
                        '<button type="button" class="step-btn step-add" data-action="add-dish" data-id="' + dish.id + '" aria-label="增加 ' + esc(dish.name) + '">+</button>' +
                    '</span>' +
                '</span>' +
            '</span>' +
        '</div>';
    }

    function cartBarHTML(shop) {
        const n = cartCount();
        const subtotal = cartSubtotal();
        const enough = shop ? subtotal >= shop.minPrice : false;
        const lack = shop ? Math.max(shop.minPrice - subtotal, 0) : 0;
        let hint = '购物车是空的';
        if (n) hint = enough ? '已满 ' + money(shop.minPrice) + ' 起送' : '差 ' + money(lack) + ' 起送';

        return '<div class="cartbar' + (n ? '' : ' empty-state') + '" id="cartBar">' +
            '<button type="button" class="cart-ico-wrap" data-action="toggle-drawer" aria-label="展开购物车">' +
                '<span class="cart-ico' + (n ? ' has' : '') + '" aria-hidden="true">🛒</span>' +
                (n ? '<span class="cart-badge" data-cart-badge>' + n + '</span>' : '') +
            '</button>' +
            '<div class="cart-sum">' +
                '<div class="amt">' + money(subtotal) + '</div>' +
                '<div class="hint">' + hint + '</div>' +
            '</div>' +
            '<button type="button" class="checkout-btn' + (enough ? ' ready' : '') + '" data-action="go-checkout"' +
                (enough ? '' : ' disabled') + '>' + (enough ? '去结算' : money(shop.minPrice) + ' 起送') + '</button>' +
        '</div>';
    }

    function renderShop(id) {
        const shop = SHOP_BY_ID.get(Number(id));
        if (!shop) {
            return '<div class="page"><div class="empty"><div class="ico" aria-hidden="true">😕</div>' +
                '<div class="title">商家不存在</div></div>' + tabbarHTML('home') + '</div>';
        }

        const cats = [];
        shop.menu.forEach(d => { if (cats.indexOf(d.cat) === -1) cats.push(d.cat); });
        const promo = shop.discounts.map(d => '满' + d.threshold + '减' + d.cut).join('，');

        return '<div class="shop-page">' +
            '<div class="shop-hero">' +
                '<div class="shop-hero-top">' +
                    '<button type="button" class="back" data-go="home" aria-label="返回">←</button>' +
                    '<span class="ttl">' + esc(shop.name) + '</span>' +
                    '<button type="button" class="icon-btn" data-action="toggle-theme" aria-label="切换深色模式" style="color:#111">🌓</button>' +
                '</div>' +
                '<div class="shop-brief">' +
                    '<span class="thumb" aria-hidden="true">' + shop.emoji + '</span>' +
                    '<span class="info">' +
                        '<h2>' + esc(shop.name) + '</h2>' +
                        '<span class="meta"><span>★ ' + shop.rating.toFixed(1) + '</span>' +
                            '<span>月售 ' + shop.monthSales + '</span>' +
                            '<span>' + shop.minutes + ' 分钟</span>' +
                            '<span>' + shop.distance + 'km</span></span>' +
                        '<span class="promo"><span class="k">满减</span><span class="v">' + esc(promo) + '</span></span>' +
                        '<span class="promo"><span class="k">配送</span><span class="v">起送 ' + money(shop.minPrice) +
                            ' · 配送费 ' + money(shop.deliveryFee) + ' · 打包 ' + money(shop.packingFee) + '/件</span></span>' +
                    '</span>' +
                '</div>' +
            '</div>' +

            '<div class="shop-body">' +
                '<nav class="dish-cats" aria-label="菜品分类">' +
                    cats.map((cat, i) =>
                        '<button type="button" class="dish-cat' + (i === 0 ? ' on' : '') + '" data-cat-nav="' + esc(cat) + '">' +
                            esc(cat) + '<span class="dot" data-cat-dot="' + esc(cat) + '" hidden></span>' +
                        '</button>').join('') +
                '</nav>' +
                '<div class="dish-list" id="dishList">' +
                    cats.map(cat =>
                        '<section data-cat-section="' + esc(cat) + '">' +
                            '<h3 class="dish-section-title">' + esc(cat) + '</h3>' +
                            shop.menu.filter(d => d.cat === cat).map(dishRowHTML).join('') +
                        '</section>').join('') +
                '</div>' +
            '</div>' +

            '<div class="cart-mask" id="cartMask" data-action="close-drawer"></div>' +
            '<div class="cart-drawer" id="cartDrawer">' +
                '<div class="cart-drawer-head">' +
                    '<span data-drawer-title>已选商品</span>' +
                    '<button type="button" class="clr" data-action="clear-cart">🗑 清空</button>' +
                '</div>' +
                '<div class="cart-drawer-list" data-drawer-list></div>' +
            '</div>' +
            cartBarHTML(shop) +
        '</div>';
    }

    /* 局部刷新：只更新数量/底栏/抽屉，整页不重绘，保住滚动位置 */
    function refreshShopUI() {
        if (!document.querySelector('.shop-page')) return;
        const shop = cartShop() || SHOP_BY_ID.get(Number(parseHash().args[0]));
        if (!shop) return;

        document.querySelectorAll('[data-dish-row]').forEach(row => {
            const id = Number(row.dataset.dishRow);
            const qty = state.cart.items[id] || 0;
            const stepper = row.querySelector('.stepper');
            const exist = stepper.querySelector('[data-qty]');
            if (qty > 0) {
                if (exist) exist.textContent = qty;
                else stepper.insertAdjacentHTML('afterbegin',
                    '<button type="button" class="step-btn step-minus" data-action="minus-dish" data-id="' + id + '" aria-label="减少">−</button>' +
                    '<span class="step-qty" data-qty="' + id + '" aria-live="polite">' + qty + '</span>');
            } else if (exist) {
                exist.previousElementSibling.remove();
                exist.remove();
            }
        });

        document.querySelectorAll('[data-cat-dot]').forEach(dot => {
            const total = shop.menu.filter(d => d.cat === dot.dataset.catDot)
                .reduce((s, d) => s + (state.cart.items[d.id] || 0), 0);
            dot.hidden = total === 0;
            dot.textContent = total;
        });

        const bar = document.getElementById('cartBar');
        if (bar) bar.outerHTML = cartBarHTML(shop);
        renderDrawer();
    }

    function renderDrawer() {
        const drawer = document.getElementById('cartDrawer');
        if (!drawer) return;
        const lines = cartLines();
        const title = drawer.querySelector('[data-drawer-title]');
        const list = drawer.querySelector('[data-drawer-list]');
        if (title) title.textContent = lines.length ? '已选 ' + cartCount() + ' 件' : '购物车是空的';
        if (!list) return;
        list.innerHTML = lines.length
            ? lines.map(l =>
                '<div class="cart-row">' +
                    '<button type="button" class="step-btn step-minus" data-action="minus-dish" data-id="' + l.dish.id + '" aria-label="减少">−</button>' +
                    '<span class="nm">' + esc(l.dish.name) + '</span>' +
                    '<span class="pr">' + money(l.dish.price * l.qty) + '</span>' +
                    '<button type="button" class="step-btn step-add" data-action="add-dish" data-id="' + l.dish.id + '" aria-label="增加">+</button>' +
                '</div>').join('')
            : '<div style="padding:28px;text-align:center;color:var(--mt-text-3)">还没有选择菜品</div>';
    }

    function toggleDrawer(force) {
        const drawer = document.getElementById('cartDrawer');
        const mask = document.getElementById('cartMask');
        if (!drawer) return;
        const open = typeof force === 'boolean' ? force : !drawer.classList.contains('open');
        drawer.classList.toggle('open', open);
        if (mask) mask.classList.toggle('open', open);
    }

    function afterRenderShop() {
        const list = document.getElementById('dishList');
        if (!list) return;
        const navBtns = Array.prototype.slice.call(document.querySelectorAll('[data-cat-nav]'));

        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const section = list.querySelector('[data-cat-section="' + btn.dataset.catNav + '"]');
                if (section) list.scrollTop = section.offsetTop;
            });
        });

        list.addEventListener('scroll', () => {
            const sections = Array.prototype.slice.call(list.querySelectorAll('[data-cat-section]'));
            if (!sections.length) return;
            const top = list.scrollTop + 10;
            let current = sections[0];
            sections.forEach(s => { if (s.offsetTop <= top) current = s; });
            navBtns.forEach(b => b.classList.toggle('on', b.dataset.catNav === current.dataset.catSection));
        });

        renderDrawer();
    }

    /* ======================================================================
     * 9. 结算页
     * ==================================================================== */

        const lines = cartLines();

            return '<div class="page"><div class="subheader">' +
                    '<button type="button" class="back" data-go="home" aria-label="返回">←</button><h1>确认订单</h1></div>' +
                '<div class="empty"><div class="ico" aria-hidden="true">🛒</div>' +
                    '<div class="title">购物车是空的</div><div class="sub">先去挑点好吃的吧</div></div>' +
                '<div style="padding:0 24px"><button type="button" class="btn-primary" style="width:100%" data-go="home">去逛逛</button></div>' +
            '</div>';
        }

        const addr = state.addresses.find(a => a.id === state.addressId) || currentAddress();
        const b = bill(shop, lines, state.couponId);
        const coupon = state.couponId ? COUPON_BY_ID.get(state.couponId) : null;

        return '<div class="page" style="padding-bottom:90px">' +
            '<div class="subheader">' +
                '<button type="button" class="back" data-go="shop/' + shop.id + '" aria-label="返回">←</button>' +

            '</div>' +

            '<div class="card">' +
                '<button type="button" class="row" data-action="choose-address">' +
                    '<span style="font-size:17px" aria-hidden="true">📍</span>' +
                    '<span class="addr-line" style="flex:1"><span class="txt">' +
                        '<span class="nm">' + esc(addr.name) + '<span class="phone">' + esc(addr.phone) + '</span></span>' +
                        '<span class="detail">' + esc(addr.detail) + '</span>' +
                    '</span></span>' +
                    '<span class="caret" aria-hidden="true">›</span>' +
                '</button>' +
                '<button type="button" class="row" data-action="choose-time">' +
                    '<span class="k">送达时间</span>' +
                    '<span class="v">' + esc(state.timeSlot) + '</span>' +
                    '<span class="caret" aria-hidden="true">›</span>' +
                '</button>' +
                '<div class="row">' +
                    '<span class="k">商家</span>' +
                    '<span class="v">' + shop.emoji + ' ' + esc(shop.name) + '</span>' +
                '</div>' +
            '</div>' +

            '<div class="card">' +
                '<div class="order-items">' +
                    lines.map(l =>
                        '<div class="oi"><span class="nm">' + l.dish.emoji + ' ' + esc(l.dish.name) + '</span>' +
                        '<span class="qt">×' + l.qty + '</span>' +
                        '<span>' + money(l.dish.price * l.qty) + '</span></div>').join('') +
                '</div>' +
                '<button type="button" class="row" data-action="choose-coupon">' +
                    '<span class="k">红包</span>' +
                    '<span class="v">' + (coupon
                        ? '<span class="val-red">' + esc(coupon.title) + ' −' + money(coupon.amount) + '</span>'
                        : (usable ? usable + ' 个可用' : '暂无可用')) + '</span>' +
                    '<span class="caret" aria-hidden="true">›</span>' +
                '</button>' +
                '<div class="field">' +
                    '<label for="remark">备注</label>' +
                    '<input id="remark" type="text" placeholder="口味、忌口、餐具需求…" maxlength="40" ' +
                        'value="' + esc(state.remark) + '" data-remark>' +
                '</div>' +
            '</div>' +

            '<div class="card" style="padding:8px 0 12px">' +
                '<div class="bill-row"><span>商品小计</span><span class="amt">' + money(b.subtotal) + '</span></div>' +
                '<div class="bill-row"><span>打包费（' + b.qty + ' 件）</span><span class="amt">' + money(b.packing) + '</span></div>' +
                '<div class="bill-row"><span>配送费</span><span class="amt">' + money(b.delivery) + '</span></div>' +
                (b.discount ? '<div class="bill-row cut"><span>满减优惠</span><span class="amt">−' + money(b.discount) + '</span></div>' : '') +
                (b.couponCut ? '<div class="bill-row cut"><span>红包抵扣</span><span class="amt">−' + money(b.couponCut) + '</span></div>' : '') +
                '<div class="bill-row total"><span>实付</span><span class="amt">' + money(b.total) + '</span></div>' +

                '满减规则：' + esc(shop.discounts.map(d => '满' + d.threshold + '减' + d.cut).join('，')) +
                '，按最高档位计算，可与红包叠加。<br>' +
                '本页为演示环境，提交后仅生成一条本地模拟订单，不产生真实交易。' +

                    '<div class="amt">' + money(b.total) + '</div>' +

                '</div>' +
                '<button type="button" class="btn-primary" data-action="submit-order">提交订单</button>' +
            '</div>' +
        '</div>';
    }

    function renderSuccess(orderId) {

            '<div class="subheader"><h1>下单成功</h1></div>' +
            '<div class="card" style="text-align:center;padding:32px 20px">' +

                    '<div class="order-line"><span>实付</span><span style="color:var(--mt-red);font-weight:700">' + money(order.total) + '</span></div>' +
                '</div>' +

    /* ======================================================================
     * 10. 订单页
     * ==================================================================== */
    const ORDER_FILTERS = [
        { id: 'all',    name: '全部' },
        { id: 'active', name: '进行中' },
        { id: 'done',   name: '已完成' }
    ];

    function filteredOrders() {
        if (state.orderFilter === 'active') return state.orders.filter(o => o.status < 3);
        if (state.orderFilter === 'done') return state.orders.filter(o => o.status >= 3);
        return state.orders.slice();
    }

    function orderCardHTML(order) {
        const shop = SHOP_BY_ID.get(order.shopId);
        const done = order.status >= 3;
        const qty = order.items.reduce((s, i) => s + i.qty, 0);
        const first = order.items[0];
        return '<div class="order-card">' +
            '<div class="order-card-head">' +
                '<span class="thumb" aria-hidden="true">' + shop.emoji + '</span>' +
                '<span class="nm">' + esc(shop.name) + '</span>' +
                '<span class="st' + (done ? ' done' : '') + '">' + ORDER_FLOW[order.status] + '</span>' +
            '</div>' +
            '<div class="order-line"><span class="nm">' + esc(first.name) +
                (order.items.length > 1 ? ' 等 ' + order.items.length + ' 种商品' : '') + '</span>' +
                '<span class="qt">共 ' + qty + ' 件</span></div>' +
            '<div class="order-line"><span class="nm">下单时间 ' + esc(order.createdAt) + '</span>' +
                '<span class="qt">' + esc(order.id) + '</span></div>' +
            '<div class="order-card-foot">' +
                '<span class="order-total">实付 <em>' + money(order.total) + '</em></span>' +
                '<button type="button" class="btn-sm" data-go="order/' + order.id + '">订单详情</button>' +
                (done
                    ? '<button type="button" class="btn-sm solid" data-action="reorder" data-id="' + order.id + '">再来一单</button>'
                    : '<button type="button" class="btn-sm solid" data-action="urge" data-id="' + order.id + '">催一催</button>') +
            '</div>' +
        '</div>';
    }

    function renderOrders() {
        const list = filteredOrders();
        return '<div class="page">' +
            '<div class="subheader plain"><h1>我的订单</h1></div>' +
            '<div class="status-tabs">' +
                ORDER_FILTERS.map(f => '<button type="button" class="status-tab' + (state.orderFilter === f.id ? ' on' : '') + '"' +
                    ' data-action="filter-orders" data-filter="' + f.id + '">' + f.name + '</button>').join('') +
            '</div>' +
            (list.length
                ? list.map(orderCardHTML).join('')
                : '<div class="empty"><div class="ico" aria-hidden="true">📋</div>' +
                  '<div class="title">还没有订单</div><div class="sub">去首页点一份吧</div></div>') +
            tabbarHTML('orders') +
        '</div>';
    }

    function renderOrderDetail(orderId) {
        const order = state.orders.find(o => o.id === orderId);
        if (!order) {
            return '<div class="page"><div class="subheader">' +
                '<button type="button" class="back" data-go="orders" aria-label="返回">←</button><h1>订单详情</h1></div>' +
                '<div class="empty"><div class="ico" aria-hidden="true">😕</div><div class="title">订单不存在</div></div></div>';
        }
        const shop = SHOP_BY_ID.get(order.shopId);

        const timeline = ORDER_FLOW.map((name, i) => {
            const cls = i < order.status ? 'done' : (i === order.status ? 'now' : '');
            return '<div class="tl-item ' + cls + '">' +

    /* ======================================================================
     * 12. 主题
     * ==================================================================== */
    const isDark = () => document.body.classList.contains('dark');
    function applyTheme(dark) {
        document.body.classList.toggle('dark', dark);
        store('kd.dark', dark ? '1' : '0');
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#1C1C1E' : '#FFD100');
    }
    function initTheme() {
        const saved = store('kd.dark');
        if (saved === '0' || saved === '1') { applyTheme(saved === '1'); return; }
        applyTheme(!!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
    }

    /* ======================================================================
     * 13. 渲染分发
     * ==================================================================== */
    function renderApp() {
        const route = parseHash();
        let html;

        switch (route.path) {
            case 'search':   html = renderSearch(); break;
            case 'shop':     html = renderShop(route.args[0]); break;
            case 'checkout': html = renderCheckout(); break;
            case 'success':  html = renderSuccess(route.args[0]); break;
            case 'orders':   html = renderOrders(); break;
            case 'order':    html = renderOrderDetail(route.args[0]); break;
            case 'profile':  html = renderProfile(); break;
            case 'address':  html = renderAddress(); break;
            default:         html = renderHome();
        }

        document.getElementById('app').innerHTML = html;
        window.scrollTo(0, 0);

        if (route.path === 'shop') afterRenderShop();
        if (route.path === 'checkout') {
            const remark = document.querySelector('[data-remark]');
            if (remark) {
                remark.addEventListener('input', e => { state.remark = e.target.value; });
            }
        }
        if (route.path === 'search') {
            const input = document.getElementById('kw');
            if (input) {
                input.focus();
                input.setSelectionRange(input.value.length, input.value.length);
            }
        }
    }

    /* ======================================================================
     * 14. 业务动作
     * ==================================================================== */
    function submitOrder() {
        const shop = cartShop();
        const lines = cartLines();
        if (!shop || !lines.length) { toast('购物车是空的'); return; }

        const b = bill(shop, lines, state.couponId);
        const addr = state.addresses.find(a => a.id === state.addressId) || currentAddress();
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const eta = pad((now.getHours() + Math.floor((now.getMinutes() + shop.minutes) / 60)) % 24) +
                    ':' + pad((now.getMinutes() + shop.minutes) % 60);

        const order = {
            id: 'FD' + String(Date.now()).slice(-10),
            shopId: shop.id,
            status: 1,
            createdAt: now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) +
                       ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()),
            eta: eta,
            distance: (Math.random() * 3 + 0.8).toFixed(1),
            address: addr ? addr.detail : '',
            remark: state.remark,
            items: lines.map(l => ({ id: l.dish.id, name: l.dish.name, price: l.dish.price, qty: l.qty })),
            subtotal: b.subtotal, packing: b.packing, delivery: b.delivery,
            discount: b.discount, couponCut: b.couponCut, total: b.total, reviewed: false
        };

        state.orders.unshift(order);
        saveOrders();

        state.cart = { shopId: null, items: {} };
        state.couponId = null;
        state.remark = '';
        state.timeSlot = TIME_SLOTS[0];
        saveCart();

        go('success/' + order.id);
    }

    function reorder(orderId) {
        const order = state.orders.find(o => o.id === orderId);
        if (!order) return;
        const shop = SHOP_BY_ID.get(order.shopId);
        const items = {};
        let skipped = 0;
        order.items.forEach(i => {
            if (DISH_INDEX.has(i.id)) items[i.id] = i.qty;
            else skipped++;
        });
        if (!Object.keys(items).length) { toast('该商家菜品已全部下架'); return; }

        state.cart = { shopId: shop.id, items: items };
        state.couponId = null;
        saveCart();
        toast(skipped ? skipped + ' 件商品已下架，其余已加入购物车' : '已加入购物车');
        go('shop/' + shop.id);
    }

    function doSearch() {
        const input = document.getElementById('kw');
        const kw = input ? input.value.trim() : '';
        state.searchKeyword = kw;
        if (kw) {
            state.searchHistory = [kw].concat(state.searchHistory.filter(w => w !== kw)).slice(0, 10);
            saveHistory();
        }
        renderApp();
    }

                (s === state.timeSlot ? '<span style="color:var(--mt-yellow-deep);font-weight:700">✓</span>' : '') +
            '</button>').join('');
        openSheet('选择送达时间', body, (ev, close) => {
            const btn = ev.target.closest('[data-pick-time]');
            if (!btn) return;
            state.timeSlot = btn.dataset.pickTime;
            close();
            renderApp();

    function showCouponSheet(selectedId) {
        const subtotal = cartSubtotal();
        const body = COUPONS.map(c => {
            const usable = subtotal === 0 || subtotal >= c.threshold;
            return '<button type="button" class="coupon' + (c.id === selectedId ? ' picked' : '') + (usable ? '' : ' used') + '"' +
                ' data-pick-coupon="' + c.id + '"' + (usable ? '' : ' disabled') + '>' +
                '<span class="l"><span class="amt"><em>¥</em>' + c.amount + '</span>' +
                    '<span class="th">' + (c.threshold ? '满 ' + c.threshold + ' 可用' : '无门槛') + '</span></span>' +
                '<span class="r"><span class="t">' + esc(c.title) + '</span>' +
                    '<span class="e">' + esc(c.scope) + ' · ' + esc(c.expire) + ' 到期</span></span>' +
            '</button>';
        }).join('') +
        (selectedId ? '<div style="padding:6px 14px 18px">' +
            '<button type="button" class="btn-sm" style="width:100%;padding:12px" data-pick-coupon="__none">不使用红包</button></div>' : '');

        openSheet(subtotal ? '红包（商品小计 ' + money(subtotal) + '）' : '我的红包', body, (ev, close) => {
            const btn = ev.target.closest('[data-pick-coupon]');
            if (!btn) return;
            const id = btn.dataset.pickCoupon;
            close();
            state.couponId = (id === '__none') ? null : id;
            if (parseHash().path === 'checkout') renderApp();
            else toast(id === '__none' ? '已取消选择' : '已选择红包');
        });
    }

    /* ======================================================================
     * 15. 事件
     * ==================================================================== */
    /* 每次点击时构造动作表，el 作为闭包参数绑定；
       否则异步回调（如确认弹窗）执行时，共享变量已被后续点击覆盖 */
    function makeActions(el) {
        return {
        'toggle-theme': () => { applyTheme(!isDark()); renderApp(); },
        'pick-category': () => { state.category = el.dataset.cat; renderApp(); },
        'pick-sort': () => { state.sort = el.dataset.sort; renderApp(); },
        'open-notice': () => toast('暂无新消息'),
        'open-coupons': () => showCouponSheet(null),

        'add-dish': () => addDish(Number(el.dataset.id)),
        'minus-dish': () => minusDish(Number(el.dataset.id)),
        'toggle-drawer': () => toggleDrawer(),
        'close-drawer': () => toggleDrawer(false),
        'clear-cart': () => {
            if (!cartCount()) { toast('购物车已经是空的'); return; }
            confirmDialog({ title: '清空购物车', message: '确定要清空购物车吗？', okText: '清空' })
                .then(ok => { if (ok) { clearCart(); toast('已清空'); } });
        },
        'go-checkout': () => {
            const shop = cartShop();
            if (!shop) { toast('购物车是空的'); return; }
            if (cartSubtotal() < shop.minPrice) {
                toast('还差 ' + money(shop.minPrice - cartSubtotal()) + ' 起送');
                return;
            }
            toggleDrawer(false);
            go('checkout');
        },

        'choose-address': () => showAddressSheet(),
        'choose-time': () => showTimeSheet(),
        'choose-coupon': () => showCouponSheet(state.couponId),
        'submit-order': () => submitOrder(),

        'filter-orders': () => { state.orderFilter = el.dataset.filter; renderApp(); },
        'reorder': () => reorder(el.dataset.id),
        'urge': () => toast('已提醒商家，请耐心等待'),

        'set-default': () => {
            state.addresses.forEach(a => { a.isDefault = a.id === el.dataset.id; });
            saveAddresses();
            toast('已设为默认地址');
            renderApp();
        },
        'del-address': () => {
            confirmDialog({ title: '删除地址', message: '确定删除这条收货地址吗？', okText: '删除' }).then(ok => {
                if (!ok) return;
                state.addresses = state.addresses.filter(a => a.id !== el.dataset.id);
                if (state.addresses.length && !state.addresses.some(a => a.isDefault)) state.addresses[0].isDefault = true;
                saveAddresses();
                toast('已删除');
                renderApp();
            });
        },
        'add-address': () => {
            const name = (document.getElementById('a-name') || {}).value || '';
            const phone = (document.getElementById('a-phone') || {}).value || '';
            const detail = (document.getElementById('a-detail') || {}).value || '';
            const tag = (document.getElementById('a-tag') || {}).value || '家';
            if (!name.trim()) { toast('请填写联系人'); return; }
            if (!/^1\d{10}$/.test(phone.trim())) { toast('手机号格式不正确'); return; }
            if (detail.trim().length < 5) { toast('详细地址太短了'); return; }
            state.addresses.push({
                id: 'a' + Date.now(), name: name.trim(),
                phone: phone.trim().slice(0, 3) + '****' + phone.trim().slice(-4),
                tag: tag, detail: detail.trim(), isDefault: false
            });
            saveAddresses();
            toast('地址已保存');
            renderApp();
        },

        'use-word': () => {
            state.searchKeyword = el.dataset.word;
            state.searchHistory = [el.dataset.word].concat(state.searchHistory.filter(w => w !== el.dataset.word)).slice(0, 10);
            saveHistory();
            renderApp();
        },
        'clear-kw': () => { state.searchKeyword = ''; renderApp(); },
        'do-search': () => doSearch(),
        'clear-history': () => { state.searchHistory = []; saveHistory(); renderApp(); },

        'reset-demo': () => {
            confirmDialog({ title: '重置演示数据', message: '将清空购物车、订单、地址与偏好，恢复初始状态。', okText: '重置' }).then(ok => {
                if (!ok) return;
                ['kd.cart', 'kd.orders', 'kd.addresses', 'kd.searchHistory'].forEach(k => store(k, null));
                state.cart = { shopId: null, items: {} };
                state.orders = SEED_ORDERS.slice();
                state.addresses = DEFAULT_ADDRESSES.slice();
                state.searchHistory = [];
                state.searchKeyword = '';
                state.couponId = null;
                state.addressId = 'a1';
                toast('已重置');
                go('home');
                renderApp();
            });
        }
        };
    }

    document.addEventListener('click', e => {
        const goto = e.target.closest('[data-go]');
        if (goto) {
            const target = goto.dataset.go;
            const cur = parseHash();
            const curPath = cur.path + (cur.args[0] ? '/' + cur.args[0] : '');
            if (curPath === target) renderApp(); else go(target);
            return;
        }

        const actionEl = e.target.closest('[data-action]');
        if (!actionEl) return;
        const handler = makeActions(actionEl)[actionEl.dataset.action];
        if (handler) handler();
    });

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            const layer = document.querySelector('.sheet-mask, .mask');
            if (layer) { layer.remove(); syncLock(); return; }
            toggleDrawer(false);
            if (parseHash().path === 'search') { state.searchKeyword = ''; go('home'); }
            return;
        }
        if (e.key === 'Enter') {
            if (e.target.id === 'kw') { e.preventDefault(); doSearch(); return; }
            if (e.target.dataset && 'remark' in e.target.dataset) e.target.blur();
        }
    });

    /* ======================================================================
     * 16. 启动
     * ==================================================================== */
    initTheme();
    loadState();

    window.addEventListener('hashchange', renderApp);
    if (!location.hash) location.hash = '#/home';
    renderApp();

    // 供自动化测试使用的最小接口
    window.__app = {
        state: state,
        go: go,
        renderApp: renderApp,
        bill: bill,
        cartCount: cartCount,
        cartSubtotal: cartSubtotal,
        shops: SHOPS,
        coupons: COUPONS,
        shopById: id => SHOP_BY_ID.get(Number(id)),
        parseHash: parseHash
    };
})();
