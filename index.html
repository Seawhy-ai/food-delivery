<title>袋鼠外卖 - 美食外卖，送啥都快</title>
<style>
/* ==========================================================================
   设计令牌 —— 美团品牌视觉
   美团黄 #FFD100 / 近黑 #111111 / 强调红 #E60012 / 浅黄 #FFF3B0
   ========================================================================== */
:root {

    --mt-yellow-deep: #FFC300;

    --mt-red: #E60012;
    --mt-red-soft: #FFEDED;
    --mt-orange: #FF6B00;

    --mt-bg: #F5F5F7;
    --mt-surface: #FFFFFF;
    --mt-surface-2: #F7F7F9;
    --mt-border: #EDEDF0;
    --mt-line: #F1F1F4;

    --mt-text: #151519;
    --mt-text-2: #6B6B72;
    --mt-text-3: #9E9EA6;

    --mt-shadow-sm: 0 1px 2px rgba(16, 16, 20, .05);
    --mt-shadow: 0 1px 2px rgba(16, 16, 20, .04), 0 10px 26px -14px rgba(16, 16, 20, .18);
    --mt-radius: 14px;
    --mt-radius-lg: 18px;

    --tab-h: 54px;
    --safe-b: env(safe-area-inset-bottom, 0px);
}
body.dark {
    --mt-bg: #101012;
    --mt-surface: #1B1B1E;
    --mt-surface-2: #242428;
    --mt-border: #2A2A2F;
    --mt-line: #242428;

    --mt-text: #F1F1F4;
    --mt-text-2: #A6A6AE;
    --mt-text-3: #74747C;

    --mt-yellow-bg: #2B2600;
    --mt-red-soft: #3A1A1C;

    --mt-shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
    --mt-shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 12px 28px -14px rgba(0, 0, 0, .6);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* ---- 双击放大修复 ------------------------------------------------------
   touch-action: manipulation 保留平移与捏合缩放，只禁掉「双击缩放」。
   不用 user-scalable=no，避免破坏无障碍的捏合缩放能力。               */
html, body, .app, button, [data-action], [data-go], .tab, .shop-card, .kk-item,
.menu-row, .row, .tile, .dish-cat, .step-btn, .cart-ico-wrap, .search-bar {

}
/* 双击不再选中交互元素上的文字 */
button, .kk-item, .shop-card, .tab, .step-btn, .cart-ico-wrap, .menu-row,
.row, .tile, .dish-cat, .tabbar, .cartbar, .subheader, .hero, .search-bar,
.status-tab, .sort-item, .chips, .badge-dot {
    -webkit-user-select: none; user-select: none;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, sans-serif;

}

:focus-visible { outline: 2px solid var(--mt-yellow-deep); outline-offset: 2px; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--mt-bg); position: relative; }

}

.badge-dot::after { content: ''; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--mt-red); border: 1.5px solid var(--mt-yellow); }

/* ============================ 金刚区 ============================ */

/* ============================ 商家卡片 ============================ */
.shop-list { padding: 10px 12px; display: flex; flex-direction: column; gap: 11px; }
.shop-card {

/* ============================ 底部 Tab ============================ */
.tabbar {

.shop-page { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: var(--mt-surface); display: flex; flex-direction: column; z-index: 80; }

<script>
(function () {

    /* ======================================================================
     * 1. 图标 & 插画系统（全 SVG，无 emoji）
     * ==================================================================== */
    const icon = (name, cls) =>
        '<svg class="ic' + (cls ? ' ' + cls : '') + '" aria-hidden="true" focusable="false"><use href="#i-' + name + '"></use></svg>';

    function shade(hex, amt) {
        const n = parseInt(hex.slice(1), 16);
        let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
        const t = amt < 0 ? 0 : 255;
        const k = Math.abs(amt);
        r = Math.round((t - r) * k + r);
        g = Math.round((t - g) * k + g);
        b = Math.round((t - b) * k + b);
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }
    function mkPal(main) {
        return { main: main, dark: shade(main, -0.26), deep: shade(main, -0.46), light: shade(main, 0.62), tint: shade(main, 0.86) };
    }

    const shadowOf = (p, rx, cy) =>
        '<ellipse cx="60" cy="' + (cy || 100) + '" rx="' + (rx || 34) + '" ry="6" fill="' + p.deep + '" opacity=".13"/>';
    const steamOf = (p, y) =>
        '<path d="M46 ' + (y || 32) + 'c0-5.4 4.6-6.4 4.6-11.6M60 ' + ((y || 32) - 4) + 'c0-5.4 4.6-6.4 4.6-11.6M74 ' + (y || 32) + 'c0-5.4 4.6-6.4 4.6-11.6" stroke="' + p.light + '" stroke-width="3.3" stroke-linecap="round" fill="none" opacity=".95"/>';

    const ART = {
        pot(p, f) {
            return shadowOf(p, 36) +
                '<path d="M28 62h64v14a20 20 0 0 1-20 20H48a20 20 0 0 1-20-20z" fill="' + p.dark + '"/>' +
                '<rect x="19" y="52" width="82" height="13" rx="6.5" fill="' + p.main + '"/>' +

                '<ellipse cx="60" cy="54" rx="29" ry="7" fill="' + f.light + '" opacity=".5"/>' +
                '<circle cx="47" cy="52" r="5" fill="' + f.deep + '" opacity=".55"/>' +
                '<circle cx="69" cy="57" r="4.4" fill="' + f.deep + '" opacity=".45"/>' +
                '<circle cx="59" cy="50" r="3.4" fill="' + f.deep + '" opacity=".5"/>' +
                steamOf(p) +
                '<rect x="11" y="55" width="9" height="5" rx="2.5" fill="' + p.main + '"/>' +
                '<rect x="100" y="55" width="9" height="5" rx="2.5" fill="' + p.main + '"/>';
        },
        noodles(p, f) {
            return shadowOf(p, 36) +
                '<path d="M22 58h76a38 38 0 0 1-76 0z" fill="' + p.dark + '"/>' +
                '<ellipse cx="60" cy="58" rx="38" ry="11" fill="' + p.main + '"/>' +

                '<path d="M36 56q8-6.5 16 0t16 0q8 6.5 16 0" stroke="' + f.dark + '" stroke-width="3" stroke-linecap="round" fill="none" opacity=".72"/>' +
                '<path d="M40 61q8-6 16 0t16 0" stroke="' + f.light + '" stroke-width="3" stroke-linecap="round" fill="none" opacity=".9"/>' +
                '<circle cx="49" cy="54" r="3.4" fill="' + f.deep + '" opacity=".45"/>' +
                '<circle cx="71" cy="56" r="3" fill="' + f.deep + '" opacity=".4"/>' +

        ricebowl(p, f) {
            return shadowOf(p, 34) +

                '<circle cx="72" cy="53" r="3.6" fill="' + f.dark + '"/>' +

        soupbowl(p, f) {

        burger(p, f) {

        },
        fries(p, f) {
            return shadowOf(p, 32) +
                '<rect x="41" y="32" width="7" height="32" rx="3.5" fill="' + f.main + '" transform="rotate(-13 44 48)"/>' +

                '<rect x="62" y="31" width="7" height="33" rx="3.5" fill="' + f.main + '" transform="rotate(9 65 47)"/>' +

    function store(key, value) {
        try {
            if (value === undefined) return localStorage.getItem(key);
            if (value === null) { localStorage.removeItem(key); return null; }
            localStorage.setItem(key, value);
        } catch (e) { /* 隐私模式 / file:// 下静默降级 */ }
        return null;
    }
    function readJSON(key, fallback) {
        try { const v = JSON.parse(store(key)); return v == null ? fallback : v; }
        catch (e) { return fallback; }
    }

    function confirmDialog(opts) {
        return new Promise(resolve => {
            const layer = document.createElement('div');
            layer.className = 'mask';
            layer.innerHTML =
                '<div class="dialog" role="dialog" aria-modal="true">' +
                    '<div class="dt">' + esc(opts.title || '提示') + '</div>' +
                    '<div class="dd">' + esc(opts.message || '') + '</div>' +
                    '<div class="dialog-actions">' +
                        '<button type="button" class="cancel" data-dlg="cancel">' + esc(opts.cancelText || '取消') + '</button>' +
                        '<button type="button" class="ok" data-dlg="ok">' + esc(opts.okText || '确定') + '</button>' +
                    '</div>' +
                '</div>';
            const close = result => { layer.remove(); syncLock(); resolve(result); };
            layer.addEventListener('click', e => {
                const btn = e.target.closest('[data-dlg]');
                if (!btn) { if (e.target === layer) close(false); return; }
                close(btn.dataset.dlg === 'ok');
            });
            $('#layerRoot').appendChild(layer);
            syncLock();
        });
    }

                '</div>' +
                '<div class="sheet-body">' + bodyHTML + '</div>' +
            '</div>';
        layer.addEventListener('click', e => {
            if (e.target.closest('[data-sheet="close"]') || e.target === layer) { layer.remove(); syncLock(); return; }
            if (onClick) onClick(e, () => { layer.remove(); syncLock(); });
        });
        $('#layerRoot').appendChild(layer);
        syncLock();
        return layer;
    }

                    '<button type="button" class="close" data-sheet="close" aria-label="关闭">' + icon('close') + '</button></div>' +
                '<div class="sheet-body">' + body + '</div>' +
                '<div style="padding:0 16px calc(16px + var(--safe-b))">' +
                    '<button type="button" class="btn-primary" style="width:100%" data-review-submit data-id="' + order.id + '">发布评价</button>' +
                '</div>' +
            '</div>';
        layer.addEventListener('click', e => {
            if (e.target.closest('[data-sheet="close"]') || e.target === layer) { layer.remove(); syncLock(); return; }
            // 注意：评价面板的控件不用 data-action，避免被全局委托重复执行
            const star = e.target.closest('[data-review-star]');
            if (star) {
                state.reviewDraft.rating = Number(star.dataset.reviewStar);
                layer.querySelectorAll('.star-row .ic').forEach((s, i) => {
                    s.classList.toggle('on', i < state.reviewDraft.rating);
                });
                return;
            }
            const tag = e.target.closest('[data-review-tag]');
            if (tag) {
                const t = tag.dataset.reviewTag;
                const i = state.reviewDraft.tags.indexOf(t);
                if (i === -1) state.reviewDraft.tags.push(t); else state.reviewDraft.tags.splice(i, 1);
                tag.classList.toggle('on', i === -1);
                return;
            }
            const submit = e.target.closest('[data-review-submit]');
            if (submit) {
                const id = submit.dataset.id;
                const o = state.orders.find(x => x.id === id);
                if (!o) return;
                if (!state.reviewDraft.rating) { toast('先打个分吧'); return; }
                const text = (document.getElementById('reviewText') || {}).value || '';
                o.review = { rating: state.reviewDraft.rating, tags: state.reviewDraft.tags.slice(), text: text.trim() };
                o.reviewed = true;
                saveOrders();
                layer.remove(); syncLock();
                toast('感谢你的评价');
                go('order/' + id);
            }
        });
        $('#layerRoot').appendChild(layer);
        syncLock();
    }

    /* 照片加载失败时移除 <img>，露出下层 SVG 插画（error 事件不冒泡，需捕获阶段） */
    document.addEventListener('error', e => {
        if (e.target && e.target.tagName === 'IMG' && e.target.classList.contains('photo')) {
            e.target.remove();
        }
    }, true);
    const emptyState = (ic, title, sub) =>
        '<div class="empty"><div class="empty-art">' + icon(ic) + '</div>' +

    /* ======================================================================
     * 4. 状态与持久化
     * ==================================================================== */
    const state = {
        cart: { shopId: null, lines: [] },   // 行项目模型：{ key, dishId, picks, qty, unit }
        addresses: [], orders: [],
        ownedCoupons: ['c1', 'c2'],          // 已领取的红包
        favorites: [],                       // 收藏的商家
        balance: 128, useBalance: true,
        couponId: null, addressId: null,
        timeSlot: TIME_SLOTS[0], remark: '',
        searchHistory: [], searchKeyword: '',
        category: 'all', sort: 'recommend',
        orderFilter: 'all', shopTab: 'menu',
        reviewDraft: { rating: 0, tags: [] }
    };

    function loadState() {
        const raw = readJSON('kd.cart', null);
        if (raw && typeof raw === 'object' && Array.isArray(raw.lines)) {
            const lines = [];
            raw.lines.forEach(l => {
                const dishId = Number(l.dishId), qty = Math.floor(Number(l.qty));
                const entry = DISH_INDEX.get(dishId);
                if (!entry || qty <= 0) return;
                const picks = Array.isArray(l.picks) ? l.picks.filter(p => typeof p === 'string') : [];
                lines.push({
                    key: lineKey(dishId, picks), dishId: dishId, picks: picks,
                    qty: qty, unit: specUnitPrice(entry.dish, picks)
                });
            });
            const sid = SHOP_BY_ID.has(raw.shopId) ? raw.shopId : null;
            state.cart = { shopId: lines.length ? sid : null, lines: lines };
        }
        const addrs = readJSON('kd.addresses', null);
        state.addresses = (Array.isArray(addrs) && addrs.length) ? addrs : DEFAULT_ADDRESSES.slice();
        if (!state.addresses.some(a => a.isDefault)) state.addresses[0].isDefault = true;
        const orders = readJSON('kd.orders', null);
        state.orders = (Array.isArray(orders) && orders.length) ? orders : SEED_ORDERS.slice();
        const hist = readJSON('kd.searchHistory', null);
        state.searchHistory = Array.isArray(hist) ? hist.slice(0, 10) : [];
        const favs = readJSON('kd.favs', null);
        state.favorites = Array.isArray(favs) ? favs.filter(id => SHOP_BY_ID.has(id)) : [];
        const owned = readJSON('kd.coupons', null);
        state.ownedCoupons = Array.isArray(owned) && owned.length
            ? owned.filter(id => COUPON_BY_ID.has(id)) : ['c1', 'c2'];
        const balRaw = readJSON('kd.balance', null);
        const bal = balRaw == null ? NaN : Number(balRaw);
        state.balance = isNaN(bal) ? 128 : bal;
        state.addressId = (state.addresses.find(a => a.isDefault) || state.addresses[0]).id;
    }
    const saveCart = () => store('kd.cart', JSON.stringify(state.cart));
    const saveAddresses = () => store('kd.addresses', JSON.stringify(state.addresses));
    const saveOrders = () => store('kd.orders', JSON.stringify(state.orders));
    const saveHistory = () => store('kd.searchHistory', JSON.stringify(state.searchHistory));
    const saveFavs = () => store('kd.favs', JSON.stringify(state.favorites));
    const saveCoupons = () => store('kd.coupons', JSON.stringify(state.ownedCoupons));
    const saveBalance = () => store('kd.balance', JSON.stringify(state.balance));

    /* ======================================================================
     * 5. 购物车 & 费用
     * ==================================================================== */
    const cartShop = () => (state.cart.shopId ? SHOP_BY_ID.get(state.cart.shopId) : null);
    const cartLines = () => state.cart.lines.slice();
    const cartCount = () => state.cart.lines.reduce((s, l) => s + l.qty, 0);
    const cartSubtotal = () => state.cart.lines.reduce((s, l) => s + l.unit * l.qty, 0);

    function discountFor(shop, subtotal) {
        if (!shop) return 0;
        let best = 0;
        shop.discounts.forEach(d => { if (subtotal >= d.threshold && d.cut > best) best = d.cut; });
        return best;
    }
    /* 下一档满减还差多少 */
    function nextDiscountGap(shop, subtotal) {
        if (!shop) return null;
        const next = shop.discounts.filter(d => d.threshold > subtotal)
            .sort((a, b) => a.threshold - b.threshold)[0];
        return next ? { need: next.threshold - subtotal, cut: next.cut } : null;
    }
    function bill(shop, lines, couponId) {
        const subtotal = lines.reduce((s, l) => s + (l.unit != null ? l.unit : l.dish.price) * l.qty, 0);
        const qty = lines.reduce((s, l) => s + l.qty, 0);
        const packing = shop ? shop.packingFee * qty : 0;
        const delivery = shop ? shop.deliveryFee : 0;
        const discount = discountFor(shop, subtotal);
        const coupon = couponId ? COUPON_BY_ID.get(couponId) : null;
        const couponCut = (coupon && subtotal >= coupon.threshold) ? coupon.amount : 0;
        const total = Math.max(subtotal + packing + delivery - discount - couponCut, 0);
        return { subtotal: subtotal, qty: qty, packing: packing, delivery: delivery, discount: discount, couponCut: couponCut, total: total };
    }

    function addDish(id, picks) {
        const entry = DISH_INDEX.get(Number(id));
        if (!entry) return;
        const shop = entry.shop;
        // 带规格的菜品：第一次点先弹规格面板（Meituan 交互）
        if (!picks && specsOf(id).length) { openSpecSheet(Number(id)); return; }

        if (state.cart.shopId && state.cart.shopId !== shop.id && cartCount() > 0) {
            const other = SHOP_BY_ID.get(state.cart.shopId);
            confirmDialog({ title: '更换商家', message: '购物车中已有「' + other.name + '」的商品，切换商家需要先清空购物车。', okText: '清空并添加' })
                .then(ok => { if (!ok) return; state.cart = { shopId: shop.id, lines: [] }; addDish(id, picks); });
            return;
        }
        picks = picks || [];
        state.cart.shopId = shop.id;
        const key = lineKey(id, picks);
        const found = state.cart.lines.find(l => l.key === key);
        if (found) found.qty += 1;
        else state.cart.lines.push({
            key: key, dishId: Number(id), picks: picks,
            qty: 1, unit: specUnitPrice(entry.dish, picks)
        });
        saveCart();
        refreshShopUI();
    }
    function minusLine(key) {
        const i = state.cart.lines.findIndex(l => l.key === key);
        if (i < 0) return;
        const l = state.cart.lines[i];
        l.qty -= 1;
        if (l.qty <= 0) state.cart.lines.splice(i, 1);
        if (!cartCount()) state.cart.shopId = null;
        saveCart();
        refreshShopUI();
    }
    /* 菜品行上的「−」：该菜品可能有多条规格行，减最后加入的那条 */
    function minusDish(id) {
        const ids = state.cart.lines.map(l => l.dishId);
        const idx = ids.lastIndexOf(Number(id));
        if (idx < 0) return;
        minusLine(state.cart.lines[idx].key);
    }
    function clearCart() { state.cart = { shopId: null, lines: [] }; state.couponId = null; saveCart(); refreshShopUI(); }

    /* ---------- 规格选择面板 ---------- */
    function openSpecSheet(dishId) {
        const entry = DISH_INDEX.get(dishId);
        if (!entry) return;
        const groups = specsOf(dishId);
        if (!groups.length) { addDish(dishId, []); return; }
        const picks = groups.map(g => g.opts[0][0]);
        const unit = () => specUnitPrice(entry.dish, picks);

        function bodyHTML() {
            return groups.map((g, gi) =>
                '<div class="spec-group"><div class="gname">' + esc(g.name) + '</div><div class="spec-opts">' +
                g.opts.map(o =>
                    '<button type="button" class="spec-opt' + (picks[gi] === o[0] ? ' on' : '') + '"' +
                    ' data-gi="' + gi + '" data-v="' + esc(o[0]) + '">' + esc(o[0]) +
                    (o[1] ? '<span class="delta">+' + money(o[1]) + '</span>' : '') + '</button>').join('') +
                '</div></div>').join('');
        }

        const layer = document.createElement('div');
        layer.className = 'sheet-mask spec-sheet';
        layer.innerHTML =
            '<div class="sheet" role="dialog" aria-modal="true">' +
                '<div class="sheet-head">' + esc(entry.dish.name) +
                    '<button type="button" class="close" data-sheet="close" aria-label="关闭">' + icon('close') + '</button></div>' +
                '<div class="sheet-body">' + bodyHTML() + '</div>' +
                '<div class="spec-foot">' +
                    '<span class="price">' + priceHTML(unit()) + '</span>' +
                    '<button type="button" class="btn-primary" data-spec-add style="padding:11px 26px">加入购物车</button>' +
                '</div>' +
            '</div>';

        layer.addEventListener('click', e => {
            if (e.target.closest('[data-sheet="close"]') || e.target === layer) { layer.remove(); syncLock(); return; }
            const opt = e.target.closest('.spec-opt');
            if (opt) {
                picks[Number(opt.dataset.gi)] = opt.dataset.v;
                layer.querySelector('.sheet-body').innerHTML = bodyHTML();
                layer.querySelector('.spec-foot .price').innerHTML = priceHTML(unit());
                return;
            }
            if (e.target.closest('[data-spec-add]')) {
                layer.remove(); syncLock();
                addDish(dishId, picks);
                toast('已加入购物车');
            }
        });
        $('#layerRoot').appendChild(layer);
        syncLock();
    }

    ];
    function visibleShops() {
        let list = SHOPS.slice();
        if (state.category !== 'all' && state.category !== 'coupon' && state.category !== 'ranking' && state.category !== 'more') {
            list = list.filter(s => s.cat === state.category);
        }
        if (state.sort === 'sales') list.sort((a, b) => b.monthSales - a.monthSales);
        else if (state.sort === 'distance') list.sort((a, b) => a.distance - b.distance);
        else if (state.sort === 'rating') list.sort((a, b) => b.rating - a.rating);
        else list.sort((a, b) => (b.rating * 500 + b.monthSales / 10) - (a.rating * 500 + a.monthSales / 10));
        return list;
    }

        const promo = shop.discounts.map(d => '满' + d.threshold + '减' + d.cut).join(' · ');

    /* ======================================================================

     * ==================================================================== */
    const HOT_WORDS = ['麻辣烫', '寿司', '汉堡', '烤肉', '提拉米苏', '刺身', '薯条', '葡萄'];
    function searchResults(keyword) {
        const kw = keyword.trim().toLowerCase();
        if (!kw) return null;
        return SHOPS.map(shop => {
            const shopHit = shop.name.toLowerCase().includes(kw) || shop.desc.toLowerCase().includes(kw);
            const dishes = shop.menu.filter(d =>
                d.name.toLowerCase().includes(kw) || d.desc.toLowerCase().includes(kw) || d.cat.toLowerCase().includes(kw));
            if (!shopHit && !dishes.length) return null;
            return { shop: shop, dishes: dishes };
        }).filter(Boolean);
    }
    function renderSearch() {
        const kw = state.searchKeyword || '';
        const results = searchResults(kw);
        const head = '<div class="search-head">' +
            '<button type="button" class="icon-btn" data-go="home" aria-label="返回">' + icon('back') + '</button>' +

                      '</div></div>'

    function dishRowHTML(dish) {
        const qty = state.cart.lines.filter(l => l.dishId === dish.id).reduce((s, l) => s + l.qty, 0);
        const hasSpec = specsOf(dish.id).length > 0;
        return '<div class="dish" data-dish-row="' + dish.id + '">' +
            artHTML(dish.art[0], dish.art[1], dish.art[2], imgURL(dish.id)) +
            '<span class="dish-body">' +
                '<span class="dish-name">' + esc(dish.name) + '</span>' +
                '<span class="dish-desc">' + esc(dish.desc) + '</span>' +
                '<span class="dish-sales">月售 ' + dish.sales + (hasSpec ? ' · 多规格' : '') + '</span>' +
                '<span class="dish-bottom">' +
                    '<span class="price">' + priceHTML(dish.price) +
                        (dish.orig ? '<span class="orig">' + money(dish.orig) + '</span>' : '') + '</span>' +
                    '<span class="stepper">' +
                        (qty > 0
                            ? '<button type="button" class="step-btn step-minus" data-action="minus-dish" data-id="' + dish.id + '" aria-label="减少 ' + esc(dish.name) + '">' + icon('minus') + '</button>' +
                              '<span class="step-qty" data-qty="' + dish.id + '" aria-live="polite">' + qty + '</span>'
                            : '') +
                        '<button type="button" class="step-btn step-add" data-action="add-dish" data-id="' + dish.id + '" aria-label="增加 ' + esc(dish.name) + '">' + icon('plus') + '</button>' +
                    '</span>' +
                '</span>' +
            '</span>' +
        '</div>';
    }
    function cartBarHTML(shop) {
        const n = cartCount();
        const subtotal = cartSubtotal();
        const enough = shop ? subtotal >= shop.minPrice : false;
        const lack = shop ? Math.max(shop.minPrice - subtotal, 0) : 0;
        const gap = nextDiscountGap(shop, subtotal);
        const hint = !n ? '购物车是空的'
            : (subtotal < shop.minPrice ? '差 ' + money(lack) + ' 起送'
                : (gap ? '再买 ' + money(gap.need) + ' 可减 ' + money(gap.cut)
                    : '已满 ' + money(shop.minPrice) + ' 起送 · 已达最高满减'));
        return '<div class="cartbar' + (n ? '' : ' empty-state') + '" id="cartBar">' +
            '<button type="button" class="cart-ico-wrap" data-action="toggle-drawer" aria-label="展开购物车">' +
                '<span class="cart-ico' + (n ? ' has' : '') + '">' + icon('cart') + '</span>' +
                (n ? '<span class="cart-badge" data-cart-badge>' + n + '</span>' : '') +
            '</button>' +
            '<div class="cart-sum"><div class="amt">' + money(subtotal) + '</div><div class="hint">' + hint + '</div></div>' +
            '<button type="button" class="checkout-btn' + (enough ? ' ready' : '') + '" data-action="go-checkout"' +
                (enough ? '' : ' disabled') + '>' + (enough ? '去结算' : money(shop.minPrice) + ' 起送') + '</button>' +
        '</div>';
    }
    function reviewsHTML(shop) {
        const list = shopReviews(shop.id);
        const avg = list.length ? (list.reduce((s, r) => s + r.rating, 0) / list.length) : shop.rating;
        return '<div class="shop-body" style="flex-direction:column;overflow-y:auto">' +
            '<div style="display:flex;align-items:baseline;gap:10px;padding:16px 14px 6px">' +
                '<span style="font-size:32px;font-weight:800;color:var(--mt-yellow-deep)">' + avg.toFixed(1) + '</span>' +
                '<span style="font-size:12.5px;color:var(--mt-text-3)">共 ' + list.length + ' 条评价</span>' +
            '</div>' +
            (list.length
                ? list.map(r =>
                    '<div class="review-item">' +
                        '<div class="review-head">' +
                            '<span class="review-av">' + icon('user') + '</span>' +
                            '<span><div class="review-user">' + esc(r.user) + (r.mine ? ' <span class="tag yellow">我的评价</span>' : '') + '</div>' +
                            '<div class="review-date">' + esc(r.date) + '</div></span>' +
                            '<span class="review-stars">' + [1, 2, 3, 4, 5].map(n =>
                                icon('star', 'fill' + (n <= r.rating ? '' : ' off'))).join('') + '</span>' +
                        '</div>' +
                        (r.text ? '<div class="review-text">' + esc(r.text) + '</div>' : '') +
                        (r.tags && r.tags.length
                            ? '<div class="review-tags">' + r.tags.map(t => '<span class="tag yellow">' + esc(t) + '</span>').join('') + '</div>'
                            : '') +
                    '</div>').join('')
                : emptyState('star', '还没有评价', '下单后来写第一条评价吧')) +
        '</div>';
    }

        }
        const cats = [];
        shop.menu.forEach(d => { if (cats.indexOf(d.cat) === -1) cats.push(d.cat); });
        const promo = shop.discounts.map(d => '满' + d.threshold + '减' + d.cut).join('，');
        const fav = state.favorites.indexOf(shop.id) !== -1;
        const tab = state.shopTab;
        const revCount = shopReviews(shop.id).length;

        const menuPane = '<div class="shop-body">' +
                '<nav class="dish-cats" aria-label="菜品分类">' +
                    cats.map((cat, i) =>
                        '<button type="button" class="dish-cat' + (i === 0 ? ' on' : '') + '" data-cat-nav="' + esc(cat) + '">' +
                            esc(cat) + '<span class="dot" data-cat-dot="' + esc(cat) + '" hidden></span>' +
                        '</button>').join('') +
                '</nav>' +
                '<div class="dish-list" id="dishList">' +
                    cats.map(cat =>
                        '<section data-cat-section="' + esc(cat) + '">' +
                            '<h3 class="dish-section-title">' + esc(cat) + '</h3>' +

                        '</section>').join('') +

            '<div class="cart-mask" id="cartMask" data-action="close-drawer"></div>' +

                    '<span data-drawer-title>已选商品</span>' +
                    '<button type="button" class="clr" data-action="clear-cart">' + icon('trash') + '清空</button>' +
                '</div>' +
                '<div class="cart-drawer-list" data-drawer-list></div>' +
            '</div>' +
            cartBarHTML(shop);

        return '<div class="shop-page">' +
            '<div class="shop-hero">' +
                '<div class="shop-hero-top">' +
                    '<button type="button" class="back" data-go="home" aria-label="返回">' + icon('back') + '</button>' +
                    '<span class="ttl">' + esc(shop.name) + '</span>' +
                    '<button type="button" class="fav-btn' + (fav ? ' on' : '') + '" data-action="toggle-fav" data-id="' + shop.id + '"' +
                        ' aria-label="收藏商家" aria-pressed="' + (fav ? 'true' : 'false') + '">' + icon('heart') + '</button>' +
                    '<button type="button" class="icon-btn" data-action="toggle-theme" aria-label="切换深色模式">' + icon('moon') + '</button>' +
                '</div>' +
                '<div class="shop-brief">' +
                    artHTML(shop.art[0], shop.art[1], shop.art[2], imgURL('s' + shop.id)) +
                    '<span class="info">' +
                        '<h2>' + esc(shop.name) + '</h2>' +
                        '<span class="meta"><span class="stars">' + icon('star', 'fill') +
                            '<span class="num">' + shopRating(shop.id, shop.rating).toFixed(1) + '</span></span>' +
                            '<span>月售 ' + shop.monthSales + '</span>' +
                            '<span>' + shop.minutes + ' 分钟</span>' +
                            '<span>' + shop.distance + 'km</span></span>' +
                        '<span class="promo"><span class="k">满减</span><span class="v">' + esc(promo) + '</span></span>' +
                        '<span class="promo"><span class="k">配送</span><span class="v">起送 ' + money(shop.minPrice) +
                            ' · 配送费 ' + money(shop.deliveryFee) + ' · 打包 ' + money(shop.packingFee) + '/件</span></span>' +
                    '</span>' +
                '</div>' +
            '</div>' +
            '<div class="shop-tabs">' +
                '<button type="button" class="shop-tab' + (tab !== 'reviews' ? ' on' : '') + '" data-action="shop-tab" data-tab="menu">点菜</button>' +
                '<button type="button" class="shop-tab' + (tab === 'reviews' ? ' on' : '') + '" data-action="shop-tab" data-tab="reviews">评价<span class="cnt">' + revCount + '</span></button>' +
            '</div>' +
            (tab === 'reviews' ? reviewsHTML(shop) : menuPane) +
        '</div>';
    }
    function refreshShopUI() {
        if (!document.querySelector('.shop-page')) return;
        const shop = cartShop() || SHOP_BY_ID.get(Number(parseHash().args[0]));
        if (!shop) return;
        document.querySelectorAll('[data-dish-row]').forEach(row => {
            const id = Number(row.dataset.dishRow);
            const qty = state.cart.lines.filter(l => l.dishId === id).reduce((s, l) => s + l.qty, 0);
            const stepper = row.querySelector('.stepper');
            const exist = stepper.querySelector('[data-qty]');
            if (qty > 0) {
                if (exist) exist.textContent = qty;
                else stepper.insertAdjacentHTML('afterbegin',
                    '<button type="button" class="step-btn step-minus" data-action="minus-dish" data-id="' + id + '" aria-label="减少">' + icon('minus') + '</button>' +
                    '<span class="step-qty" data-qty="' + id + '" aria-live="polite">' + qty + '</span>');
            } else if (exist) {
                exist.previousElementSibling.remove();
                exist.remove();
            }
        });
        document.querySelectorAll('[data-cat-dot]').forEach(dot => {
            const total = state.cart.lines.filter(l => {
                const dd = DISH_INDEX.get(l.dishId);
                return dd && dd.dish.cat === dot.dataset.catDot;
            }).reduce((s, l) => s + l.qty, 0);
            dot.hidden = total === 0;
            dot.textContent = total;
        });
        const bar = document.getElementById('cartBar');
        if (bar) bar.outerHTML = cartBarHTML(shop);
        renderDrawer();
    }
    function renderDrawer() {
        const drawer = document.getElementById('cartDrawer');
        if (!drawer) return;
        const lines = cartLines();
        const title = drawer.querySelector('[data-drawer-title]');
        const list = drawer.querySelector('[data-drawer-list]');
        if (title) title.textContent = lines.length ? '已选 ' + cartCount() + ' 件' : '购物车是空的';
        if (!list) return;
        list.innerHTML = lines.length
            ? lines.map(l => {
                const dd = DISH_INDEX.get(l.dishId).dish;
                return '<div class="cart-row">' +
                    '<button type="button" class="step-btn step-minus" data-action="minus-line" data-key="' + esc(l.key) + '" aria-label="减少">' + icon('minus') + '</button>' +
                    '<span class="nm">' + esc(dd.name) +
                        (l.picks.length ? '<span style="color:var(--mt-text-3);font-size:11px"> · ' + esc(l.picks.join(' / ')) + '</span>' : '') +
                    '</span>' +
                    '<span class="pr">' + money(l.unit * l.qty) + '</span>' +
                    '<button type="button" class="step-btn step-add" data-action="add-dish" data-id="' + l.dishId + '" data-picks="' + esc(l.picks.join('>')) + '" aria-label="增加">' + icon('plus') + '</button>' +
                '</div>';
            }).join('')
            : '<div style="padding:28px;text-align:center;color:var(--mt-text-3)">还没有选择菜品</div>';
    }
    function toggleDrawer(force) {
        const drawer = document.getElementById('cartDrawer');
        const mask = document.getElementById('cartMask');
        if (!drawer) return;
        const open = typeof force === 'boolean' ? force : !drawer.classList.contains('open');
        drawer.classList.toggle('open', open);
        if (mask) mask.classList.toggle('open', open);
    }
    function afterRenderShop() {
        const list = document.getElementById('dishList');
        if (!list) return;
        const navBtns = Array.prototype.slice.call(document.querySelectorAll('[data-cat-nav]'));
        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const section = list.querySelector('[data-cat-section="' + btn.dataset.catNav + '"]');
                if (section) list.scrollTop = section.offsetTop;
            });
        });
        list.addEventListener('scroll', () => {
            const sections = Array.prototype.slice.call(list.querySelectorAll('[data-cat-section]'));
            if (!sections.length) return;
            const top = list.scrollTop + 10;
            let current = sections[0];
            sections.forEach(s => { if (s.offsetTop <= top) current = s; });
            navBtns.forEach(b => b.classList.toggle('on', b.dataset.catNav === current.dataset.catSection));
        });
        renderDrawer();
    }

    /* ======================================================================
     * 10. 结算
     * ==================================================================== */
    function renderCheckout() {
        const shop = cartShop();
        const lines = cartLines();
        if (!shop || !lines.length) {
            return '<div class="page"><div class="subheader">' +
                '<button type="button" class="back" data-go="home" aria-label="返回">' + icon('back') + '</button><h1>确认订单</h1></div>' +
                emptyState('cart', '购物车是空的', '先去挑点好吃的吧') +
                '<div style="padding:0 24px"><button type="button" class="btn-primary" style="width:100%" data-go="home">去逛逛</button></div>' +
            '</div>';
        }
        const addr = state.addresses.find(a => a.id === state.addressId) || currentAddress();
        const b = bill(shop, lines, state.couponId);
        const coupon = state.couponId ? COUPON_BY_ID.get(state.couponId) : null;
        const usable = state.ownedCoupons.filter(cid => {
            const c = COUPON_BY_ID.get(cid);
            return c && b.subtotal >= c.threshold;
        }).length;
        const balanceCut = state.useBalance ? Math.min(state.balance, b.total) : 0;
        const payable = b.total - balanceCut;
        const nextGap = nextDiscountGap(shop, b.subtotal);
        return '<div class="page" style="padding-bottom:96px">' +
            '<div class="subheader">' +
                '<button type="button" class="back" data-go="shop/' + shop.id + '" aria-label="返回">' + icon('back') + '</button>' +
                '<h1>确认订单</h1>' +
            '</div>' +
            '<div class="card">' +
                '<button type="button" class="row" data-action="choose-address">' +
                    '<span class="addr-line">' + icon('pin') +
                        '<span class="txt">' +
                            '<span class="nm">' + esc(addr.name) + '<span class="phone">' + esc(addr.phone) + '</span></span>' +
                            '<span class="detail">' + esc(addr.detail) + '</span>' +
                        '</span></span>' +
                    icon('chev-r', 'caret') +
                '</button>' +
                '<button type="button" class="row" data-action="choose-time">' +
                    '<span class="k">送达时间</span>' +
                    '<span class="v">' + esc(state.timeSlot) + '</span>' +
                    icon('chev-r', 'caret') +
                '</button>' +
                '<div class="row"><span class="k">商家</span><span class="v">' + esc(shop.name) + '</span></div>' +
            '</div>' +
            '<div class="card">' +
                '<div class="order-items">' +
                    lines.map(l => {
                        const dd = DISH_INDEX.get(l.dishId).dish;
                        return '<div class="oi"><span class="nm">' + esc(dd.name) +
                            (l.picks.length ? '<span style="color:var(--mt-text-3);font-size:11px">（' + esc(l.picks.join(' / ')) + '）</span>' : '') +
                            '</span>' +
                            '<span class="qt">×' + l.qty + '</span>' +
                            '<span>' + money(l.unit * l.qty) + '</span></div>';
                    }).join('') +
                '</div>' +
                '<button type="button" class="row" data-action="choose-coupon">' +
                    '<span class="k">红包</span>' +
                    '<span class="v">' + (coupon
                        ? '<span class="val-red">' + esc(coupon.title) + ' −' + money(coupon.amount) + '</span>'
                        : (usable ? usable + ' 个可用' : '暂无可用')) + '</span>' +
                    icon('chev-r', 'caret') +
                '</button>' +
                '<div class="field"><label for="remark">备注</label>' +
                    '<input id="remark" type="text" placeholder="口味、忌口、餐具需求…" maxlength="40" value="' + esc(state.remark) + '" data-remark></div>' +
            '</div>' +
            '<div class="card" style="padding:8px 0 12px">' +
                '<div class="bill-row"><span>商品小计</span><span class="amt">' + money(b.subtotal) + '</span></div>' +
                '<div class="bill-row"><span>打包费（' + b.qty + ' 件）</span><span class="amt">' + money(b.packing) + '</span></div>' +
                '<div class="bill-row"><span>配送费</span><span class="amt">' + money(b.delivery) + '</span></div>' +
                (b.discount ? '<div class="bill-row cut"><span>满减优惠</span><span class="amt">−' + money(b.discount) + '</span></div>' : '') +
                (b.couponCut ? '<div class="bill-row cut"><span>红包抵扣</span><span class="amt">−' + money(b.couponCut) + '</span></div>' : '') +
                '<div class="balance-row">' +
                    '<span class="k">余额支付</span>' +
                    '<span class="v">可用 <em>' + money(state.balance) + '</em>' +
                        (balanceCut ? ' · 抵扣 ' + money(balanceCut) : '') + '</span>' +
                    '<button type="button" class="switch' + (state.useBalance ? ' on' : '') + '" data-action="toggle-balance" aria-label="使用余额支付"></button>' +
                '</div>' +
                '<div class="bill-row total"><span>实付</span><span class="amt">' + money(payable) + '</span></div>' +
            '</div>' +
            (nextGap
                ? '<div style="margin:-4px 12px 10px;padding:9px 12px;border-radius:10px;background:var(--mt-yellow-bg);font-size:12px;color:#8A6A00">' +
                  '再买 <b>' + money(nextGap.need) + '</b> 可触发「满 ' + money(nextGap.need + b.subtotal) + ' 减 ' + money(nextGap.cut) + '」</div>'
                : '') +
            '<div style="padding:0 14px 20px;font-size:11.5px;color:var(--mt-text-3);line-height:1.6">' +
                '满减规则：' + esc(shop.discounts.map(d => '满' + d.threshold + '减' + d.cut).join('，')) +
                '，按最高档位计算，可与红包叠加。<br>' +
                '本页为演示环境，提交后仅生成一条本地模拟订单，不产生真实交易。' +
            '</div>' +
            '<div class="submit-bar">' +
                '<div class="sum"><div class="amt">' + money(payable) + '</div>' +
                    '<div class="hint">' + ((b.discount + b.couponCut + balanceCut) ? '已优惠 ' + money(b.discount + b.couponCut + balanceCut) : '暂无优惠') + '</div></div>' +
                '<button type="button" class="btn-primary" data-action="submit-order">提交订单</button>' +
            '</div>' +
        '</div>';
    }
    function renderSuccess(orderId) {
        const order = state.orders.find(o => o.id === orderId);
        if (!order) return renderHome();

            '<div class="subheader"><h1>下单成功</h1></div>' +
            '<div class="card" style="text-align:center;padding:34px 20px">' +
                '<div class="empty-art" style="background:var(--mt-yellow-soft)">' + icon('check') + '</div>' +
                '<div style="font-size:19px;font-weight:700;margin-bottom:6px">订单已提交</div>' +
                '<div style="color:var(--mt-text-3);font-size:13px">预计 ' + esc(order.eta) + ' 送达</div>' +
                '<div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--mt-line);font-size:13px;color:var(--mt-text-2);text-align:left">' +
                    '<div class="order-line"><span>订单号</span><span>' + esc(order.id) + '</span></div>' +
                    '<div class="order-line"><span>商家</span><span>' + esc(shop.name) + '</span></div>' +
                    '<div class="order-line"><span>实付</span><span style="color:var(--mt-red);font-weight:700">' + money(order.total) + '</span></div>' +
                '</div>' +
                '<div style="display:flex;gap:10px;margin-top:24px">' +
                    '<button type="button" class="btn-sm" style="flex:1;padding:12px" data-go="home">返回首页</button>' +
                    '<button type="button" class="btn-sm solid" style="flex:1;padding:12px" data-go="order/' + order.id + '">查看订单</button>' +
                '</div>' +

        '</div>';

    /* ======================================================================
     * 11. 订单
     * ==================================================================== */
    const ORDER_FILTERS = [
        { id: 'all', name: '全部' }, { id: 'active', name: '进行中' }, { id: 'done', name: '已完成' }
    ];
    function filteredOrders() {
        if (state.orderFilter === 'active') return state.orders.filter(o => liveStatus(o) < 3);
        if (state.orderFilter === 'done') return state.orders.filter(o => liveStatus(o) >= 3);
        return state.orders.slice();
    }
    function orderCardHTML(order) {
        const shop = SHOP_BY_ID.get(order.shopId);
        const st = liveStatus(order);
        const done = st >= 3;
        const qty = order.items.reduce((s, i) => s + i.qty, 0);
        const first = order.items[0];
        return '<div class="order-card">' +
            '<div class="order-card-head">' +
                artHTML(shop.art[0], shop.art[1], shop.art[2], imgURL('s' + shop.id)) +
                '<span class="nm">' + esc(shop.name) + '</span>' +
                '<span class="st' + (done ? ' done' : '') + '">' + ORDER_FLOW[st] + '</span>' +
            '</div>' +
            '<div class="order-line"><span class="nm">' + esc(first.name) +
                (order.items.length > 1 ? ' 等 ' + order.items.length + ' 种商品' : '') + '</span>' +
                '<span class="qt">共 ' + qty + ' 件</span></div>' +
            '<div class="order-line"><span class="nm">下单时间 ' + esc(order.createdAt) + '</span>' +
                '<span class="qt">' + esc(order.id) + '</span></div>' +
            '<div class="order-card-foot">' +
                '<span class="order-total">实付 <em>' + money(order.payable != null ? order.payable : order.total) + '</em></span>' +
                '<button type="button" class="btn-sm" data-go="order/' + order.id + '">订单详情</button>' +
                (done
                    ? (order.review

        switch (route.path) {

            case 'shop':     html = renderShop(route.args[0]); break;
            case 'checkout': html = renderCheckout(); break;

        }

    function submitOrder() {
        const shop = cartShop();
        const lines = cartLines();
        if (!shop || !lines.length) { toast('购物车是空的'); return; }
        const b = bill(shop, lines, state.couponId);
        const addr = state.addresses.find(a => a.id === state.addressId) || currentAddress();
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const eta = pad((now.getHours() + Math.floor((now.getMinutes() + shop.minutes) / 60)) % 24) +
                    ':' + pad((now.getMinutes() + shop.minutes) % 60);
        const balanceCut = state.useBalance ? Math.min(state.balance, b.total) : 0;
        const order = {
            id: 'FD' + String(Date.now()).slice(-10),
            shopId: shop.id, status: 0, ts: Date.now(),
            createdAt: now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) +
                       ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()),
            eta: eta, distance: (Math.random() * 3 + 0.8).toFixed(1),
            address: addr ? addr.detail : '', remark: state.remark,
            items: lines.map(l => {
                const dd = DISH_INDEX.get(l.dishId).dish;
                return { id: dd.id, name: dd.name, price: l.unit, qty: l.qty, spec: l.picks.join(' / ') };
            }),
            subtotal: b.subtotal, packing: b.packing, delivery: b.delivery,
            discount: b.discount, couponCut: b.couponCut, total: b.total,
            balanceCut: balanceCut, payable: b.total - balanceCut,
            reviewed: false
        };
        state.orders.unshift(order);
        saveOrders();
        if (balanceCut) { state.balance -= balanceCut; saveBalance(); }
        state.cart = { shopId: null, lines: [] };
        state.couponId = null; state.remark = ''; state.timeSlot = TIME_SLOTS[0];
        state.useBalance = true;
        saveCart();
        go('success/' + order.id);
    }
    function reorder(orderId) {
        const order = state.orders.find(o => o.id === orderId);
        if (!order) return;
        const shop = SHOP_BY_ID.get(order.shopId);
        const lines = [];
        let skipped = 0;
        order.items.forEach(i => {
            const entry = DISH_INDEX.get(i.id);
            if (!entry) { skipped++; return; }
            const picks = typeof i.spec === 'string' && i.spec ? i.spec.split(' / ') : [];
            lines.push({
                key: lineKey(i.id, picks), dishId: i.id, picks: picks,
                qty: i.qty, unit: specUnitPrice(entry.dish, picks)
            });
        });
        if (!lines.length) { toast('该商家菜品已全部下架'); return; }
        state.cart = { shopId: shop.id, lines: lines };
        state.couponId = null;
        saveCart();
        toast(skipped ? skipped + ' 件商品已下架，其余已加入购物车' : '已加入购物车');
        go('shop/' + shop.id);
    }
    /* 订单状态随时间推进：0 待接单 → 1 已接单 → 2 骑手取货 → 3 已送达 */
    function liveStatus(o) {
        if (o.status >= 3 || o.cancelled) return o.status;
        if (!o.ts) return o.status;
        const mins = (Date.now() - o.ts) / 60000;
        if (mins >= 6) return 3;
        if (mins >= 3) return 2;
        if (mins >= 1) return 1;
        return 0;
    }
    const shopReviews = shopId =>
        (SEED_REVIEWS[shopId] || []).slice().concat(
            state.orders.filter(o => o.shopId === shopId && o.review)
                .map(o => ({ user: '袋鼠用户', rating: o.review.rating, tags: o.review.tags || [],
                             text: o.review.text || '', date: o.createdAt.slice(0, 10), mine: true }))
        );
    function shopRating(shopId, base) {
        const rs = shopReviews(shopId);
        if (!rs.length) return base;
        const avg = rs.reduce((s, r) => s + r.rating, 0) / rs.length;
        return Math.round(((base * 3 + avg) / 4) * 10) / 10;   // 基础分权重 3，用户评分权重 1
    }
    function doSearch() {
        const input = document.getElementById('kw');
        const kw = input ? input.value.trim() : '';
        state.searchKeyword = kw;
        if (kw) {
            state.searchHistory = [kw].concat(state.searchHistory.filter(w => w !== kw)).slice(0, 10);
            saveHistory();
        }
        renderApp();
    }

    /* 搜索联想：只更新联想层，不重绘整页（保住输入框焦点） */
    function renderSuggest(value) {
        const box = document.getElementById('suggest');
        if (!box) return;
        const kw = String(value || '').trim().toLowerCase();
        if (!kw) { box.hidden = true; box.innerHTML = ''; return; }
        const hits = [];
        SHOPS.forEach(s => s.menu.forEach(d => {
            if (hits.length < 8 && (d.name.toLowerCase().includes(kw) || d.desc.toLowerCase().includes(kw))) hits.push(d);
        }));
        if (!hits.length) { box.hidden = true; box.innerHTML = ''; return; }
        box.hidden = false;
        box.innerHTML = hits.map(d =>
            '<button type="button" class="sug-item" data-sug="' + esc(d.name) + '">' +
            icon('search') + '<span>' + esc(d.name) + '</span>' +
            '<span style="margin-left:auto;color:var(--mt-text-3);font-size:11.5px">' + money(d.price) + '</span></button>').join('');
    }
    function showAddressSheet() {
        const body = state.addresses.map(a =>
            '<button type="button" class="row" data-pick-address="' + a.id + '">' +
                '<span style="flex:1;text-align:left">' +
                    '<span style="font-weight:600">' + esc(a.name) +
                    ' <span style="font-weight:400;color:var(--mt-text-3);font-size:12.5px">' + esc(a.phone) + '</span></span>' +
                    '<div style="font-size:12.5px;color:var(--mt-text-2);margin-top:3px">' + esc(a.detail) + '</div>' +
                '</span>' +
                (a.id === state.addressId ? '<span style="color:var(--mt-yellow-deep)">' + icon('check') + '</span>' : '') +
            '</button>').join('') +
            '<div style="padding:12px 14px 18px">' +
                '<button type="button" class="btn-sm" style="width:100%;padding:12px" data-pick-address="__manage">管理收货地址</button>' +
            '</div>';
        openSheet('选择收货地址', body, (ev, close) => {
            const btn = ev.target.closest('[data-pick-address]');
            if (!btn) return;
            const id = btn.dataset.pickAddress;
            close();
            if (id === '__manage') { go('address'); return; }
            state.addressId = id;
            renderApp();
        });
    }
    function showTimeSheet() {
        const body = TIME_SLOTS.map(s =>
            '<button type="button" class="row" data-pick-time="' + esc(s) + '">' +
                '<span style="flex:1">' + esc(s) + '</span>' +
                (s === state.timeSlot ? '<span style="color:var(--mt-yellow-deep)">' + icon('check') + '</span>' : '') +
            '</button>').join('');
        openSheet('选择送达时间', body, (ev, close) => {
            const btn = ev.target.closest('[data-pick-time]');
            if (!btn) return;
            state.timeSlot = btn.dataset.pickTime;
            close();
            renderApp();
        });
    }
    function showCouponSheet(selectedId) {
        const subtotal = cartSubtotal();
        const mine = state.ownedCoupons.map(id => COUPON_BY_ID.get(id)).filter(Boolean);
        const body = mine.map(c => {
            const usable = subtotal === 0 || subtotal >= c.threshold;
            return '<button type="button" class="coupon' + (c.id === selectedId ? ' picked' : '') + (usable ? '' : ' used') + '"' +
                ' data-pick-coupon="' + c.id + '"' + (usable ? '' : ' disabled') + '>' +
                '<span class="l"><span class="amt"><em>¥</em>' + c.amount + '</span>' +
                    '<span class="th">' + (c.threshold ? '满 ' + c.threshold + ' 可用' : '无门槛') + '</span></span>' +
                '<span class="r"><span class="t">' + esc(c.title) + '</span>' +
                    '<span class="e">' + esc(c.scope) + ' · ' + esc(c.expire) + ' 到期</span></span>' +
            '</button>';
        }).join('') +
        (!mine.length ? '<div style="padding:26px;text-align:center;color:var(--mt-text-3)">还没有红包，去领券中心领几张吧</div>' : '') +
        '<div style="padding:6px 14px 18px">' +
            (selectedId ? '<button type="button" class="btn-sm" style="width:100%;padding:12px;margin-bottom:8px" data-pick-coupon="__none">不使用红包</button>' : '') +
            '<button type="button" class="btn-sm solid" style="width:100%;padding:12px" data-action="goto-coupon-center">去领券中心</button>' +
        '</div>';
        openSheet(subtotal ? '我的红包（商品小计 ' + money(subtotal) + '）' : '我的红包', body, (ev, close) => {
            const btn = ev.target.closest('[data-pick-coupon]');
            if (btn) {
                const id = btn.dataset.pickCoupon;
                close();
                state.couponId = (id === '__none') ? null : id;
                if (parseHash().path === 'checkout') renderApp();
                else toast(id === '__none' ? '已取消选择' : '已选择红包');
                return;
            }
            if (ev.target.closest('[data-action="goto-coupon-center"]')) { close(); go('coupons'); }
        });
    }

    /* ======================================================================
     * 16. 事件
     * ==================================================================== */
    function makeActions(el) {
        return {
            'toggle-theme': () => { applyTheme(!isDark()); renderApp(); },
            'pick-category': () => { state.category = el.dataset.cat; renderApp(); },
            'pick-sort': () => { state.sort = el.dataset.sort; renderApp(); },
            'open-notice': () => go('messages'),
            'open-coupons': () => showCouponSheet(null),
            'goto-coupon-center': () => go('coupons'),

            'shop-tab': () => { state.shopTab = el.dataset.tab; renderApp(); },
            'toggle-fav': () => {
                const id = Number(el.dataset.id);
                const i = state.favorites.indexOf(id);
                if (i === -1) { state.favorites.push(id); toast('已收藏'); }
                else { state.favorites.splice(i, 1); toast('已取消收藏'); }
                saveFavs();
                renderApp();
            },
            'claim-coupon': () => {
                const id = el.dataset.id;
                if (state.ownedCoupons.indexOf(id) !== -1) { toast('已经领过啦'); return; }
                state.ownedCoupons.push(id);
                saveCoupons();
                toast('领取成功，已放入红包');
                renderApp();
            },
            'minus-line': () => minusLine(el.dataset.key),
            'toggle-balance': () => {
                state.useBalance = !state.useBalance;
                renderApp();
            },
            'cancel-order': () => {
                const id = el.dataset.id;
                confirmDialog({ title: '取消订单', message: '确定取消这笔订单吗？取消后不可恢复。', okText: '取消订单' }).then(ok => {
                    if (!ok) return;
                    state.orders = state.orders.filter(o => o.id !== id);
                    saveOrders(); toast('订单已取消'); go('orders'); renderApp();
                });
            },
            'delete-order': () => {
                const id = el.dataset.id;
                confirmDialog({ title: '删除记录', message: '删除后订单将不再显示，确定吗？', okText: '删除' }).then(ok => {
                    if (!ok) return;
                    state.orders = state.orders.filter(o => o.id !== id);
                    saveOrders(); toast('已删除'); go('orders'); renderApp();
                });
            },
            'open-review': () => openReviewSheet(el.dataset.id),
            'add-dish': () => addDish(Number(el.dataset.id),
                el.dataset.picks !== undefined ? el.dataset.picks.split('>').filter(Boolean) : undefined),
            'minus-dish': () => minusDish(Number(el.dataset.id)),
            'toggle-drawer': () => toggleDrawer(),
            'close-drawer': () => toggleDrawer(false),
            'clear-cart': () => {
                if (!cartCount()) { toast('购物车已经是空的'); return; }
                confirmDialog({ title: '清空购物车', message: '确定要清空购物车吗？', okText: '清空' })
                    .then(ok => { if (ok) { clearCart(); toast('已清空'); } });
            },
            'go-checkout': () => {
                const shop = cartShop();
                if (!shop) { toast('购物车是空的'); return; }
                if (cartSubtotal() < shop.minPrice) { toast('还差 ' + money(shop.minPrice - cartSubtotal()) + ' 起送'); return; }
                toggleDrawer(false);
                go('checkout');
            },

            'choose-address': () => showAddressSheet(),
            'choose-time': () => showTimeSheet(),
            'choose-coupon': () => showCouponSheet(state.couponId),
            'submit-order': () => submitOrder(),

            'filter-orders': () => { state.orderFilter = el.dataset.filter; renderApp(); },
            'reorder': () => reorder(el.dataset.id),
            'urge': () => toast('已提醒商家，请耐心等待'),

            'set-default': () => {
                state.addresses.forEach(a => { a.isDefault = a.id === el.dataset.id; });
                saveAddresses(); toast('已设为默认地址'); renderApp();
            },
            'del-address': () => {
                const id = el.dataset.id;
                confirmDialog({ title: '删除地址', message: '确定删除这条收货地址吗？', okText: '删除' }).then(ok => {
                    if (!ok) return;
                    state.addresses = state.addresses.filter(a => a.id !== id);
                    if (state.addresses.length && !state.addresses.some(a => a.isDefault)) state.addresses[0].isDefault = true;
                    saveAddresses(); toast('已删除'); renderApp();
                });
            },
            'add-address': () => {
                const name = (document.getElementById('a-name') || {}).value || '';
                const phone = (document.getElementById('a-phone') || {}).value || '';
                const detail = (document.getElementById('a-detail') || {}).value || '';
                const tag = (document.getElementById('a-tag') || {}).value || '家';
                if (!name.trim()) { toast('请填写联系人'); return; }
                if (!/^1\d{10}$/.test(phone.trim())) { toast('手机号格式不正确'); return; }
                if (detail.trim().length < 5) { toast('详细地址太短了'); return; }
                state.addresses.push({
                    id: 'a' + Date.now(), name: name.trim(),
                    phone: phone.trim().slice(0, 3) + '****' + phone.trim().slice(-4),
                    tag: tag, detail: detail.trim(), isDefault: false
                });
                saveAddresses(); toast('地址已保存'); renderApp();
            },

            'use-word': () => {
                state.searchKeyword = el.dataset.word;
                state.searchHistory = [el.dataset.word].concat(state.searchHistory.filter(w => w !== el.dataset.word)).slice(0, 10);
                saveHistory(); renderApp();
            },
            'clear-kw': () => { state.searchKeyword = ''; renderApp(); },
            'do-search': () => doSearch(),
            'clear-history': () => { state.searchHistory = []; saveHistory(); renderApp(); },

            'reset-demo': () => {
                confirmDialog({ title: '重置演示数据', message: '将清空购物车、订单、地址、红包、收藏与偏好，恢复初始状态。', okText: '重置' }).then(ok => {
                    if (!ok) return;
                    ['kd.cart', 'kd.orders', 'kd.addresses', 'kd.searchHistory', 'kd.favs', 'kd.coupons', 'kd.balance'].forEach(k => store(k, null));
                    state.cart = { shopId: null, lines: [] };
                    state.orders = SEED_ORDERS.slice();
                    state.addresses = DEFAULT_ADDRESSES.slice();
                    state.searchHistory = []; state.searchKeyword = '';
                    state.couponId = null; state.addressId = 'a1';
                    state.favorites = []; state.ownedCoupons = ['c1', 'c2'];
                    state.balance = 128; state.useBalance = true;
                    toast('已重置'); go('home'); renderApp();
                });
            }
        };
    }

    document.addEventListener('click', e => {
        const sug = e.target.closest('[data-sug]');
        if (sug) {
            state.searchKeyword = sug.dataset.sug;
            state.searchHistory = [sug.dataset.sug].concat(state.searchHistory.filter(w => w !== sug.dataset.sug)).slice(0, 10);
            saveHistory();
            renderApp();
            return;
        }

        const goto = e.target.closest('[data-go]');
        if (goto) {
            const target = goto.dataset.go;
            const cur = parseHash();
            const curPath = cur.path + (cur.args[0] ? '/' + cur.args[0] : '');
            if (curPath === target) renderApp(); else go(target);
            return;
        }
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const handler = makeActions(el)[el.dataset.action];
        if (handler) handler();
    });

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            const layer = document.querySelector('.sheet-mask, .mask');
            if (layer) { layer.remove(); syncLock(); return; }
            toggleDrawer(false);
            if (parseHash().path === 'search') { state.searchKeyword = ''; go('home'); }
            return;
        }
        if (e.key === 'Enter') {
            if (e.target.id === 'kw') { e.preventDefault(); doSearch(); return; }
            if (e.target.dataset && 'remark' in e.target.dataset) e.target.blur();
        }
    });

    /* ======================================================================
     * 17. 启动
     * ==================================================================== */
    initTheme();
    loadState();
    window.addEventListener('hashchange', renderApp);
    if (!location.hash) location.hash = '#/home';
    renderApp();

    window.__app = {
        state: state, go: go, renderApp: renderApp, bill: bill,
        cartCount: cartCount, cartSubtotal: cartSubtotal,
        shops: SHOPS, coupons: COUPONS,
        shopById: id => SHOP_BY_ID.get(Number(id)), parseHash: parseHash,
        art: artHTML, icon: icon, imgURL: imgURL,
        liveStatus: liveStatus, shopReviews: shopReviews, shopRating: shopRating,
        specsOf: specsOf, specUnitPrice: specUnitPrice, nextDiscountGap: nextDiscountGap
    };
})();
</script>
</body>
</html>
