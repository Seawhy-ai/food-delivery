    /* ======================================================================
     * 13. 主题
     * ==================================================================== */
    /* 从主屏幕独立运行（iOS「添加到主屏幕」/ Android PWA）时加标记，
       CSS 据此避让刘海并禁用下拉刷新 */
    const isStandalone = () =>
        window.navigator.standalone === true ||
        !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (isStandalone()) document.body.classList.add('standalone');
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isDark = () => document.body.classList.contains('dark');
    function applyTheme(dark) {
        document.body.classList.toggle('dark', dark);
        store('kd.dark', dark ? '1' : '0');
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#1B1B1E' : '#FFD100');
    }
    function initTheme() {
        const saved = store('kd.dark');
        if (saved === '0' || saved === '1') { applyTheme(saved === '1'); return; }
        applyTheme(!!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
    }

    /* ======================================================================
     * 14. 渲染分发
     * ==================================================================== */
    function renderApp() {
        const route = parseHash();
        let html;
        switch (route.path) {
            case 'search':   html = renderSearch(); break;
            case 'shop':     html = renderShop(route.args[0]); break;
            case 'checkout': html = renderCheckout(); break;
            case 'success':  html = renderSuccess(route.args[0]); break;
            case 'orders':   html = renderOrders(); break;
            case 'order':    html = renderOrderDetail(route.args[0]); break;
            case 'profile':  html = renderProfile(); break;
            case 'address':  html = renderAddress(); break;
            case 'favs':     html = renderFavs(); break;
            case 'vip':      html = renderVip(); break;
            case 'coupons':  html = renderCouponCenter(); break;
            case 'messages': html = renderMessages(); break;
            case 'lottery':  html = renderLottery(); break;
            case 'groupon':  html = renderGroupon(); break;
            default:         html = renderHome();
        }
        document.getElementById('app').innerHTML = html;
        window.scrollTo(0, 0);
        if (route.path === 'shop') afterRenderShop();
        if (route.path === 'lottery') afterRenderLottery();
        if (route.path === 'checkout') {
            const remark = document.querySelector('[data-remark]');
            if (remark) remark.addEventListener('input', e => { state.remark = e.target.value; });
        }
        if (route.path === 'search') {
            const input = document.getElementById('kw');
            if (input) {
                input.focus(); input.setSelectionRange(input.value.length, input.value.length);
                input.addEventListener('input', () => renderSuggest(input.value));
                renderSuggest(input.value);
            }
        }
    }

    /* ======================================================================
     * 15. 业务动作
     * ==================================================================== */
    function submitOrder() {
        const shop = cartShop();
        const lines = cartLines();
        if (!shop || !lines.length) { toast('购物车是空的'); return; }
        const b = bill(shop, lines, state.couponId, state.member.on);
        const addr = state.addresses.find(a => a.id === state.addressId) || currentAddress();
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const eta = pad((now.getHours() + Math.floor((now.getMinutes() + shop.minutes) / 60)) % 24) +
                    ':' + pad((now.getMinutes() + shop.minutes) % 60);
        const balanceCut = state.useBalance ? Math.min(state.balance, b.total) : 0;
        const order = {
            id: 'FD' + String(Date.now()).slice(-10),
            shopId: shop.id, status: 0, ts: Date.now(),
            createdAt: now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) +
                       ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()),
            eta: eta, distance: (Math.random() * 3 + 0.8).toFixed(1),
            address: addr ? addr.detail : '', remark: state.remark,
            items: lines.map(l => {
                const dd = DISH_INDEX.get(l.dishId).dish;
                return { id: dd.id, name: dd.name, price: l.unit, qty: l.qty, spec: l.picks.join(' / ') };
            }),
            subtotal: b.subtotal, packing: b.packing, delivery: b.delivery,
            discount: b.discount, couponCut: b.couponCut, shipCut: b.shipCut, total: b.total,
            balanceCut: balanceCut, payable: b.total - balanceCut,
            reviewed: false
        };
        state.orders.unshift(order);
        saveOrders();
        if (balanceCut) { state.balance -= balanceCut; saveBalance(); }
        state.cart = { shopId: null, lines: [] };
        state.couponId = null; state.couponOptOut = false; state.remark = ''; state.timeSlot = TIME_SLOTS[0];
        state.useBalance = true;
        saveCart();
        go('success/' + order.id);
    }
    function reorder(orderId) {
        const order = state.orders.find(o => o.id === orderId);
        if (!order) return;
        const shop = SHOP_BY_ID.get(order.shopId);
        const lines = [];
        let skipped = 0;
        order.items.forEach(i => {
            const entry = DISH_INDEX.get(i.id);
            if (!entry) { skipped++; return; }
            const picks = typeof i.spec === 'string' && i.spec ? i.spec.split(' / ') : [];
            lines.push({
                key: lineKey(i.id, picks), dishId: i.id, picks: picks,
                qty: i.qty, unit: specUnitPrice(entry.dish, picks)
            });
        });
        if (!lines.length) { toast('该商家菜品已全部下架'); return; }
        state.cart = { shopId: shop.id, lines: lines };
        state.couponId = null;
        saveCart();
        toast(skipped ? skipped + ' 件商品已下架，其余已加入购物车' : '已加入购物车');
        go('shop/' + shop.id);
    }
    /* 订单状态随时间推进：0 待接单 → 1 已接单 → 2 骑手取货 → 3 已送达 */
    function liveStatus(o) {
        if (o.status >= 3 || o.cancelled) return o.status;
        if (!o.ts) return o.status;
        const mins = (Date.now() - o.ts) / 60000;
        if (mins >= 6) return 3;
        if (mins >= 3) return 2;
        if (mins >= 1) return 1;
        return 0;
    }
    const shopReviews = shopId =>
        (SEED_REVIEWS[shopId] || []).slice().concat(
            state.orders.filter(o => o.shopId === shopId && o.review)
                .map(o => ({ user: '袋鼠用户', rating: o.review.rating, tags: o.review.tags || [],
                             text: o.review.text || '', date: o.createdAt.slice(0, 10), mine: true }))
        );
    function shopRating(shopId, base) {
        const rs = shopReviews(shopId);
        if (!rs.length) return base;
        const avg = rs.reduce((s, r) => s + r.rating, 0) / rs.length;
        return Math.round(((base * 3 + avg) / 4) * 10) / 10;   // 基础分权重 3，用户评分权重 1
    }
    function doSearch() {
        const input = document.getElementById('kw');
        const kw = input ? input.value.trim() : '';
        state.searchKeyword = kw;
        if (kw) {
            state.searchHistory = [kw].concat(state.searchHistory.filter(w => w !== kw)).slice(0, 10);
            saveHistory();
        }
        renderApp();
    }

    /* 搜索联想：只更新联想层，不重绘整页（保住输入框焦点） */
    function renderSuggest(value) {
        const box = document.getElementById('suggest');
        if (!box) return;
        const kw = String(value || '').trim().toLowerCase();
        if (!kw) { box.hidden = true; box.innerHTML = ''; return; }
        const hits = [];
        SHOPS.forEach(s => s.menu.forEach(d => {
            if (hits.length < 8 && (d.name.toLowerCase().includes(kw) || d.desc.toLowerCase().includes(kw))) hits.push(d);
        }));
        if (!hits.length) { box.hidden = true; box.innerHTML = ''; return; }
        box.hidden = false;
        box.innerHTML = hits.map(d =>
            '<button type="button" class="sug-item" data-sug="' + esc(d.name) + '">' +
            icon('search') + '<span>' + esc(d.name) + '</span>' +
            '<span style="margin-left:auto;color:var(--mt-text-3);font-size:11.5px">' + money(d.price) + '</span></button>').join('');
    }

    function showCouponSheet(selectedId) {
        const subtotal = cartSubtotal();
        const shop = parseHash().path === 'checkout' ? cartShop() : null;
        const canUse = c => (!c.shopId || (shop && c.shopId === shop.id)) && (subtotal === 0 || subtotal >= c.threshold);
        const val = c => (c.ship ? (shop ? shop.deliveryFee : 8) : c.amount);
        const mine = state.ownedCoupons.map(id => COUPON_BY_ID.get(id)).filter(Boolean)
            .sort((x, y) => (canUse(y) ? 1 : 0) - (canUse(x) ? 1 : 0) || val(y) - val(x));
        const bestId = (mine.find(canUse) || {}).id || null;
        const body = mine.map(c => {
            const usable = canUse(c);
            const shopName = c.shopId && SHOP_BY_ID.get(c.shopId) ? SHOP_BY_ID.get(c.shopId).name : null;
            return '<button type="button" class="coupon' + (c.id === selectedId ? ' picked' : '') + (usable ? '' : ' used') + '"' +
                ' data-pick-coupon="' + c.id + '"' + (usable ? '' : ' disabled') + '>' +
                '<span class="l"><span class="amt">' + (c.ship ? '免配送' : '<em>¥</em>' + c.amount) + '</span>' +
                    '<span class="th">' + (c.threshold ? '满 ' + c.threshold + ' 可用' : '无门槛') + '</span></span>' +
                '<span class="r"><span class="t">' + (c.id === bestId ? '<i class="best-badge">最优</i>' : '') + esc(c.title) + '</span>' +
                    '<span class="e">' + esc(c.scope) + ' · ' + esc(c.expire) + ' 到期</span>' +
                    (shopName && !usable && shop && c.shopId !== shop.id
                        ? '<span class="e" style="color:var(--mt-red)">仅限 ' + esc(shopName) + ' 门店使用</span>' : '') +
                '</span>' +
            '</button>';
        }).join('') +
        (!mine.length ? '<div style="padding:26px;text-align:center;color:var(--mt-text-3)">还没有红包，去领券中心领几张吧</div>' : '') +
        '<div style="padding:6px 14px 18px">' +
            (selectedId ? '<button type="button" class="btn-sm" style="width:100%;padding:12px;margin-bottom:8px" data-pick-coupon="__none">不使用红包</button>' : '') +
            '<button type="button" class="btn-sm solid" style="width:100%;padding:12px" data-action="goto-coupon-center">去领券中心</button>' +
        '</div>';
        openSheet(subtotal ? '我的红包（商品小计 ' + money(subtotal) + '）' : '我的红包', body, (ev, close) => {
            const btn = ev.target.closest('[data-pick-coupon]');
            if (btn) {
                const id = btn.dataset.pickCoupon;
                close();
                state.couponId = (id === '__none') ? null : id;
                state.couponOptOut = (id === '__none');
                if (parseHash().path === 'checkout') renderApp();
                else toast(id === '__none' ? '已取消选择' : '已选择红包');
                return;
            }
            if (ev.target.closest('[data-action="goto-coupon-center"]')) { close(); go('coupons'); }
        });
    }

    /* ======================================================================
     * 16. 事件
     * ==================================================================== */
    function makeActions(el) {
        return {
            'toggle-theme': () => { applyTheme(!isDark()); renderApp(); },
            'pick-category': () => {
                const c = el.dataset.cat;
                if (c === 'group') { go('groupon'); return; }
                if (c === 'coupon') { showCouponSheet(null); return; }
                if (c === 'ranking') { state.category = 'all'; state.sort = 'sales'; renderApp(); return; }
                if (c === 'errand') { toast('跑腿代购即将上线，敬请期待'); return; }
                state.category = c; renderApp();
            },
            'pick-sort': () => { state.sort = el.dataset.sort; renderApp(); },
            'open-notice': () => go('messages'),
            'open-coupons': () => showCouponSheet(null),
            'goto-coupon-center': () => go('coupons'),

            'shop-tab': () => { state.shopTab = el.dataset.tab; renderApp(); },
            'toggle-fav': () => {
                const id = Number(el.dataset.id);
                const i = state.favorites.indexOf(id);
                if (i === -1) { state.favorites.push(id); toast('已收藏'); }
                else { state.favorites.splice(i, 1); toast('已取消收藏'); }
                saveFavs();
                renderApp();
            },
            'coupon-tab': () => { state.couponTab = el.dataset.tab; renderApp(); },
            'goto-vip': () => go('vip'),
            'open-member': () => {
                if (state.balance < MEMBER_FEE) { toast('余额不足，请先充值'); go('profile'); return; }
                confirmDialog({ title: '开通袋鼠会员', message: '将使用余额 ¥' + MEMBER_FEE + ' 开通 ' + MEMBER_DAYS + ' 天会员，期间下单自动免配送费并解锁会员专享券。', okText: '确认开通' }).then(ok => {
                    if (!ok) return;
                    const d = new Date(); d.setDate(d.getDate() + MEMBER_DAYS);
                    const pad = n => String(n).padStart(2, '0');
                    state.member = { on: true, expire: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) };
                    state.balance -= MEMBER_FEE;
                    saveMember(); saveBalance();
                    ['m1', 'm4'].forEach(id => { if (state.ownedCoupons.indexOf(id) === -1) state.ownedCoupons.push(id); });
                    saveCoupons();
                    toast('会员已开通，免配送费已生效');
                    renderApp();
                });
            },
            'cancel-member': () => {
                state.member = { on: false, expire: '' };
                saveMember(); toast('已关闭自动续费，权益保留至到期'); renderApp();
            },
            'claim-coupon': () => {
                const id = el.dataset.id;
                const c = COUPON_BY_ID.get(id);
                if (c && c.vip && !state.member.on) { toast('会员专享券，请先开通会员'); go('vip'); return; }
                if (state.ownedCoupons.indexOf(id) !== -1) { toast('已经领过啦'); return; }
                state.ownedCoupons.push(id);
                saveCoupons();
                toast('领取成功，已放入红包');
                renderApp();
            },
            'claim-group': () => {
                const id = el.dataset.id;
                if (state.claimedGroups.indexOf(id) !== -1) { toast('已经领过啦'); return; }
                claimGroup(id);
                const g = GROUP_BY_ID.get(id);
                toast('领取成功：' + (g ? g.title : '团购券'));
                renderApp();
            },
            'draw-lottery': () => {
                const today = todayStr();
                if (state.lastDrawDate !== today) { state.freeDraws = 1; state.lastDrawDate = today; }
                if (state.freeDraws > 0) state.freeDraws--;
                else if (state.balance >= LOTTERY_COST) { state.balance -= LOTTERY_COST; saveBalance(); }
                else { toast('今日免费抽奖已用完，余额不足 ¥' + LOTTERY_COST); return; }
                saveDraws();
                const tot = LOTTERY_PRIZES.reduce((s, p) => s + p.w, 0);
                let r = Math.random() * tot, target = 0;
                for (let i = 0; i < LOTTERY_PRIZES.length; i++) { r -= LOTTERY_PRIZES[i].w; if (r <= 0) { target = i; break; } }
                state._spin = { target: target };
                renderApp();
            },
            'minus-line': () => minusLine(el.dataset.key),
            'toggle-balance': () => {
                state.useBalance = !state.useBalance;
                renderApp();
            },
            'cancel-order': () => {
                const id = el.dataset.id;
                confirmDialog({ title: '取消订单', message: '确定取消这笔订单吗？取消后不可恢复。', okText: '取消订单' }).then(ok => {
                    if (!ok) return;
                    state.orders = state.orders.filter(o => o.id !== id);
                    saveOrders(); toast('订单已取消'); go('orders'); renderApp();
                });
            },
            'delete-order': () => {
                const id = el.dataset.id;
                confirmDialog({ title: '删除记录', message: '删除后订单将不再显示，确定吗？', okText: '删除' }).then(ok => {
                    if (!ok) return;
                    state.orders = state.orders.filter(o => o.id !== id);
                    saveOrders(); toast('已删除'); go('orders'); renderApp();
                });
            },
            'open-review': () => openReviewSheet(el.dataset.id),
            'add-dish': () => addDish(Number(el.dataset.id),
                el.dataset.picks !== undefined ? el.dataset.picks.split('>').filter(Boolean) : undefined),
            'minus-dish': () => minusDish(Number(el.dataset.id)),
            'toggle-drawer': () => toggleDrawer(),
            'close-drawer': () => toggleDrawer(false),
            'clear-cart': () => {
                if (!cartCount()) { toast('购物车已经是空的'); return; }
                confirmDialog({ title: '清空购物车', message: '确定要清空购物车吗？', okText: '清空' })
                    .then(ok => { if (ok) { clearCart(); toast('已清空'); } });
            },
            'go-checkout': () => {
                const shop = cartShop();
                if (!shop) { toast('购物车是空的'); return; }
                if (cartSubtotal() < shop.minPrice) { toast('还差 ' + money(shop.minPrice - cartSubtotal()) + ' 起送'); return; }
                toggleDrawer(false);
                go('checkout');
            },

            'choose-address': () => showAddressSheet(),
            'choose-time': () => showTimeSheet(),
            'choose-coupon': () => showCouponSheet(state.couponId),
            'submit-order': () => submitOrder(),

            'filter-orders': () => { state.orderFilter = el.dataset.filter; renderApp(); },
            'reorder': () => reorder(el.dataset.id),
            'urge': () => toast('已提醒商家，请耐心等待'),

            'set-default': () => {
                state.addresses.forEach(a => { a.isDefault = a.id === el.dataset.id; });
                saveAddresses(); toast('已设为默认地址'); renderApp();
            },
            'del-address': () => {
                const id = el.dataset.id;
                confirmDialog({ title: '删除地址', message: '确定删除这条收货地址吗？', okText: '删除' }).then(ok => {
                    if (!ok) return;
                    state.addresses = state.addresses.filter(a => a.id !== id);
                    if (state.addresses.length && !state.addresses.some(a => a.isDefault)) state.addresses[0].isDefault = true;
                    saveAddresses(); toast('已删除'); renderApp();
                });
            },
            'add-address': () => {
                const name = (document.getElementById('a-name') || {}).value || '';
                const phone = (document.getElementById('a-phone') || {}).value || '';
                const detail = (document.getElementById('a-detail') || {}).value || '';
                const tag = (document.getElementById('a-tag') || {}).value || '家';
                if (!name.trim()) { toast('请填写联系人'); return; }
                if (!/^1\d{10}$/.test(phone.trim())) { toast('手机号格式不正确'); return; }
                if (detail.trim().length < 5) { toast('详细地址太短了'); return; }
                state.addresses.push({
                    id: 'a' + Date.now(), name: name.trim(),
                    phone: phone.trim().slice(0, 3) + '****' + phone.trim().slice(-4),
                    tag: tag, detail: detail.trim(), isDefault: false
                });
                saveAddresses(); toast('地址已保存'); renderApp();
            },

            'use-word': () => {
                state.searchKeyword = el.dataset.word;
                state.searchHistory = [el.dataset.word].concat(state.searchHistory.filter(w => w !== el.dataset.word)).slice(0, 10);
                saveHistory(); renderApp();
            },
            'clear-kw': () => { state.searchKeyword = ''; renderApp(); },
            'do-search': () => doSearch(),
            'clear-history': () => { state.searchHistory = []; saveHistory(); renderApp(); },

            'reset-demo': () => {
                confirmDialog({ title: '重置演示数据', message: '将清空购物车、订单、地址、红包、收藏与偏好，恢复初始状态。', okText: '重置' }).then(ok => {
                    if (!ok) return;
                    ['kd.cart', 'kd.orders', 'kd.addresses', 'kd.searchHistory', 'kd.favs', 'kd.coupons',
                     'kd.balance', 'kd.member', 'kd.groups', 'kd.points', 'kd.draws', 'kd.dark']
                        .forEach(k => store(k, null));
                    state.cart = { shopId: null, lines: [] };
                    state.orders = SEED_ORDERS.slice();
                    state.addresses = DEFAULT_ADDRESSES.slice();
                    state.searchHistory = []; state.searchKeyword = '';
                    state.couponId = null; state.couponOptOut = false; state.addressId = 'a1';
                    state.favorites = []; state.ownedCoupons = ['c1', 'c2'];
                    state.member = { on: false, expire: '' };
                    state.claimedGroups = []; state.points = 0;
                    state.freeDraws = 1; state.lastDrawDate = todayStr();
                    state.balance = 128; state.useBalance = true;
                    initTheme();
                    toast('已重置'); go('home'); renderApp();
                });
            }
        };
    }

    document.addEventListener('click', e => {
        const sug = e.target.closest('[data-sug]');
        if (sug) {
            state.searchKeyword = sug.dataset.sug;
            state.searchHistory = [sug.dataset.sug].concat(state.searchHistory.filter(w => w !== sug.dataset.sug)).slice(0, 10);
            saveHistory();
            renderApp();
            return;
        }

        const goto = e.target.closest('[data-go]');
        if (goto) {
            const target = goto.dataset.go;
            const cur = parseHash();
            const curPath = cur.path + (cur.args[0] ? '/' + cur.args[0] : '');
            if (curPath === target) renderApp(); else go(target);
            return;
        }
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const handler = makeActions(el)[el.dataset.action];
        if (handler) handler();
    });

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            const layer = document.querySelector('.sheet-mask, .mask');
            if (layer) { layer.remove(); syncLock(); return; }
            toggleDrawer(false);
            if (parseHash().path === 'search') { state.searchKeyword = ''; go('home'); }
            return;
        }
        if (e.key === 'Enter') {
            if (e.target.id === 'kw') { e.preventDefault(); doSearch(); return; }
            if (e.target.dataset && 'remark' in e.target.dataset) e.target.blur();
        }
    });

    /* ======================================================================
     * 17. 启动
     * ==================================================================== */
    initTheme();
    loadState();
    window.addEventListener('hashchange', renderApp);
    if (!location.hash) location.hash = '#/home';
    renderApp();

    window.__app = {
        state: state, go: go, renderApp: renderApp, bill: bill,
        cartCount: cartCount, cartSubtotal: cartSubtotal,
        shops: SHOPS, coupons: COUPONS,
        shopById: id => SHOP_BY_ID.get(Number(id)), parseHash: parseHash,
        art: artHTML, icon: icon, imgURL: imgURL,
        memberFee: MEMBER_FEE, couponKinds: COUPON_KINDS,
        liveStatus: liveStatus, shopReviews: shopReviews, shopRating: shopRating,
        specsOf: specsOf, specUnitPrice: specUnitPrice, nextDiscountGap: nextDiscountGap,
        shopGeo: SHOP_GEO, groupDeals: GROUP_DEALS, groupById: GROUP_BY_ID,
        lotteryPrizes: LOTTERY_PRIZES, mapCenter: MAP_CENTER
    };
})();
</script>
</body>
</html>
